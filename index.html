<!doctype html>
<html lang="ja">
<head>

<title>NRサプリ練習問題</title>
<style>
:root {
  --bg: #faf8f5; --surface: #ffffff; --text: #1f1d1a; --muted: #6b655d; --line: #e4ded5;
  --accent: #b5541c; --accent-soft: #fbeee5; --ok: #1f7a4d; --ok-soft: #e5f4ec; --ng: #b42318; --ng-soft: #fdecea;
  --warn-soft: #fff6db; --warn: #8a6100;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1816; --surface: #24211e; --text: #f0ece6; --muted: #a59d92; --line: #3a3530;
    --accent: #e8874d; --accent-soft: #3a2a20; --ok: #5cc28e; --ok-soft: #1d3328; --ng: #f2867b; --ng-soft: #3b2220;
    --warn-soft: #3a3118; --warn: #e6c063; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1816; --surface: #24211e; --text: #f0ece6; --muted: #a59d92; --line: #3a3530;
  --accent: #e8874d; --accent-soft: #3a2a20; --ok: #5cc28e; --ok-soft: #1d3328; --ng: #f2867b; --ng-soft: #3b2220;
  --warn-soft: #3a3118; --warn: #e6c063;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; line-height: 1.7; }
main { max-width: 720px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.35rem; margin: 8px 0 4px; }
h2 { font-size: 1.05rem; margin: 24px 0 8px; }
.sub { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .85rem; margin: 12px 0; }
label.row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
label.row input { margin-top: 6px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; }
button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 12px; font-size: 1rem; }
button:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; color: var(--muted); padding: 4px 0; text-decoration: underline; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; gap: 8px; }
.field { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: .8rem; margin: 8px 0; }
.stem { font-weight: 600; margin: 4px 0 8px; }
.passage { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0 12px; }
.choice { display: flex; gap: 10px; width: 100%; text-align: left; margin: 8px 0; padding: 10px 12px; line-height: 1.6; }
.choice .n { font-weight: 700; color: var(--accent); min-width: 1em; }
.choice:disabled { opacity: 1; cursor: default; color: var(--muted); }
.choice.correct, .choice.wrong { color: var(--text); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
.verdict { font-size: 1.1rem; font-weight: 700; margin: 12px 0 4px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; white-space: nowrap; }
td.mk { width: 2.2em; text-align: center; font-weight: 700; }
td.pg { width: 5.5em; white-space: nowrap; color: var(--accent); }
.big { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.foot { color: var(--muted); font-size: .78rem; margin-top: 32px; }
.stack > * + * { margin-top: 10px; }
</style>
</head>

<script>
const DATA = [{"chapter": 1, "chapterTitle": "NR・サプリメントアドバイザーの役割と倫理", "questions": [{"id": "1-01", "section": "1 アドバイザリースタッフとは ❷保健機能食品とは", "type": "correct", "stem": "食品の機能に関する記述である。正しいのはどれか。", "passage": "", "choices": ["一次機能とは、味・香りなどの感覚にかかわる機能である。", "二次機能とは、生体防御や疾病の予防などの体調調節機能である。", "三次機能（体調調節機能）を有する食品を機能性食品と定義した。", "機能性食品（functional food）という用語は、米国で最初に定義された。", "文部省（現 文部科学省）の特定研究「食品機能の系統的解析と展開」は1990年に発足した。"], "answer": 3, "explanations": [{"ok": false, "basis": "一次機能は栄養機能（栄養素やエネルギーを供給する機能）。感覚機能は二次機能", "page": "p.2"}, {"ok": false, "basis": "二次機能は感覚機能。体調調節機能は三次機能", "page": "p.2"}, {"ok": true, "basis": "三次機能（体調調節機能）を有する食品を機能性食品と定義した", "page": "p.2"}, {"ok": false, "basis": "世界に先駆けて日本において定義された概念", "page": "p.2"}, {"ok": false, "basis": "特定研究の発足は1984年。1990年は「機能性食品の制度化について」の報告書", "page": "p.2"}], "status": "確認済み"}, {"id": "1-02", "section": "1 アドバイザリースタッフとは ❷保健機能食品とは", "type": "incorrect", "stem": "保健機能食品制度に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["2001年に、特定保健用食品と栄養機能食品からなる保健機能食品の制度が創設された。", "栄養機能食品は、定められた規格基準を満たせば、個々に許可を得ずに定められた表示ができる。", "機能性表示食品は、2015年に新たに位置づけられた。", "特定保健用食品は、健康増進法に規定される特別用途食品の1つに位置づけられている。", "特定保健用食品は、規格基準を満たせば、商品ごとの許可を必要としない。"], "answer": 5, "explanations": [{"ok": true, "basis": "2001年、特定保健用食品と新たに定められた栄養機能食品とからなる保健機能食品の制度が創設", "page": "p.3"}, {"ok": true, "basis": "栄養機能食品は一定の規格基準を満たせば個々に許可を得ずに表示ができる", "page": "p.3"}, {"ok": true, "basis": "2015年には機能性表示食品が新たに位置づけられた", "page": "p.3"}, {"ok": true, "basis": "健康増進法第43条で規定されている特別用途食品の1つに位置づけられている", "page": "p.2"}, {"ok": false, "basis": "特定保健用食品は「個別評価型」。商品ごとに成分を評価したうえで表示の許可が行われる", "page": "p.3"}], "status": "確認済み"}, {"id": "1-03", "section": "2 アドバイザリースタッフの役割 ❶インフォームドチョイスとは／❷インフォームドチョイスを達成するためにすべきこと", "type": "correct", "stem": "インフォームドチョイスに関する記述である。正しいのはどれか。", "passage": "", "choices": ["2000年に発表されたEU白書に、インフォームドチョイスが可能となることが記載されている。", "消費者を説得して適切な商品を購入させることは、インフォームドチョイスに含まれる。", "インフォームドチョイスという言葉は、米国では使用されていない。", "厚生労働省の2001年の通知「保健機能食品制度の創設について」では、インフォームドチョイスの達成は制度の目的に掲げられていない。", "インフォームドチョイスの考え方は、日本独自の健康表示制度の前提となっている。"], "answer": 1, "explanations": [{"ok": true, "basis": "2000年発表のEU白書に、informed choice が可能となる旨の記載", "page": "p.3"}, {"ok": false, "basis": "説得して特定の商品を購入させることがあってはならず、それはインフォームドチョイスとはいえない", "page": "p.4"}, {"ok": false, "basis": "米国でも使用されている", "page": "p.3"}, {"ok": false, "basis": "同通知は、インフォームドチョイスの達成を本制度の目的に掲げている", "page": "p.3"}, {"ok": false, "basis": "国際的な健康表示の制度の前提となっている", "page": "p.3"}], "status": "確認済み"}, {"id": "1-04", "section": "3 企業およびNR・サプリメントアドバイザーの社会的役割 ❶企業の社会的役割", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "社会的責任を果たすCSRには4つの段階があると考えられる。第一は「（ a ）を全うする」こと、第二は「（ a ）に書かれていないことであっても、正義感や科学的根拠をもって、製造・販売を行う」こと、第三は「（ b ）をよりよいものにするために地球人としての自覚をもって取り組む」こと、第四は「正しい（ c ）をより多く消費者に開示して、適切な商品の選択に役立てる」ことである。", "choices": ["a 法律　b 地域社会　c 価格", "a 利益　b 地球環境　c 情報", "a 法律　b 地球環境　c 情報", "a 利益　b 地域社会　c 情報", "a 法律　b 地球環境　c 価格"], "answer": 3, "explanations": [{"ok": false, "basis": "b は地球環境、c は情報", "page": "p.5"}, {"ok": false, "basis": "a は法律", "page": "p.5"}, {"ok": true, "basis": "CSRの4段階：法律を全うする／法律に書かれていなくても正義感や科学的根拠をもって製造・販売／地球環境をよりよいものに／正しい情報をより多く消費者に開示", "page": "p.5"}, {"ok": false, "basis": "a は法律、b は地球環境", "page": "p.5"}, {"ok": false, "basis": "c は情報", "page": "p.5"}], "status": "確認済み"}, {"id": "1-05", "section": "3 企業およびNR・サプリメントアドバイザーの社会的役割 ❷アドバイザリースタッフの社会的役割", "type": "correct", "stem": "NR・サプリメントアドバイザーの資格統合に関する記述である。正しいのはどれか。", "passage": "", "choices": ["NR認定事業を日本臨床栄養協会に移管し資格を統合することは、2011年9月に合意された。", "統合資格「NR・サプリメントアドバイザー」の試験は、2012年7月から実施されている。", "NR資格保有者の協会への移籍は、1回のみ行われた。", "両資格は、健康食品やサプリメントを栄養よりも重視する点で考え方が一致している。", "両資格の資格取得者は、医師が主体であるという共通点がある。"], "answer": 1, "explanations": [{"ok": true, "basis": "2011年9月に合意", "page": "p.5"}, {"ok": false, "basis": "統合資格の試験は2013年12月から実施。2012年7月は移籍の第1回", "page": "p.5"}, {"ok": false, "basis": "2012年7月の第1回を皮切りに延7回にわたって行われた", "page": "p.5"}, {"ok": false, "basis": "栄養を重視し、健康食品やサプリメントをあくまで補助的なものと位置づける点で一致", "page": "p.5"}, {"ok": false, "basis": "管理栄養士・栄養士・薬剤師等が主体であるという共通点", "page": "p.5"}], "status": "確認済み"}, {"id": "1-06", "section": "3 企業およびNR・サプリメントアドバイザーの社会的役割 ❷(1)食品のリスク", "type": "pair", "stem": "食品が健康に悪影響を及ぼす要因とその分類の組合せである。正しいのはどれか。", "passage": "", "choices": ["食中毒 ―― 化学的要因", "残留農薬 ―― 化学的要因", "混入異物 ―― 生化学的要因", "残留農薬 ―― 物理的要因", "食中毒 ―― 物理的要因"], "answer": 2, "explanations": [{"ok": false, "basis": "食中毒は生化学的要因", "page": "p.6"}, {"ok": true, "basis": "残留農薬などの化学的要因", "page": "p.6"}, {"ok": false, "basis": "混入異物は物理的要因", "page": "p.6"}, {"ok": false, "basis": "残留農薬は化学的要因", "page": "p.6"}, {"ok": false, "basis": "食中毒は生化学的要因", "page": "p.6"}], "status": "確認済み"}, {"id": "1-07", "section": "3 企業およびNR・サプリメントアドバイザーの社会的役割 ❷(3)行政とのコミュニケーション", "type": "incorrect", "stem": "健康に関連する食品の用語に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["「サプリメント」という言葉は、日本では法律的にも学問的にも定義された言葉ではない。", "保健機能食品は、特定保健用食品、栄養機能食品および機能性表示食品をサブカテゴリーとする。", "「栄養補助食品」は、米国のダイエタリーサプリメントの訳語として従来用いられていた。", "「機能性食品」は、法律で定義された用語である。", "本テキストでいうサプリメントには、消費者庁の定めた制度に基づく食品も、そのほかの健康食品も含まれる。"], "answer": 4, "explanations": [{"ok": true, "basis": "日本では法律的にも学問的にも、定義された言葉ではない", "page": "p.7"}, {"ok": true, "basis": "3つをサブカテゴリーとする保健機能食品は、消費者庁が定めた制度に基づく", "page": "p.7"}, {"ok": true, "basis": "米国のダイエタリーサプリメントの訳語として従来用いられていた", "page": "p.7"}, {"ok": false, "basis": "文部省（現 文部科学省）の国家プロジェクトで定義された言葉で、法律的に定義された用語ではない", "page": "p.7"}, {"ok": true, "basis": "通常の食生活を補う食品成分を含有する食品を指し、制度に基づく食品もそのほかの健康食品も含む", "page": "p.7"}], "status": "確認済み"}]}, {"chapter": 2, "chapterTitle": "基礎の生理学", "questions": [{"id": "2-01", "section": "1 身体の構造と機能 ❷人体組織の構築原理", "type": "pair", "stem": "細胞とその働きの組合せである。正しいのはどれか。", "passage": "", "choices": ["骨芽細胞 ―― 骨基質を分解してカルシウムを血液中に溶出させる", "破骨細胞 ―― コラーゲン線維などの骨基質を合成する", "肥満細胞（マスト細胞） ―― ヒスタミンを分泌する", "線維芽細胞 ―― 強い食作用をもつ", "シュワン細胞 ―― 中枢神経系で神経細胞の支持，栄養・代謝の調節を担う"], "answer": 3, "explanations": [{"ok": false, "basis": "骨基質を分解してカルシウムを血液中に溶出させる（骨吸収）のは破骨細胞。骨芽細胞は骨基質を合成し骨を形成する", "page": "p.10〜11"}, {"ok": false, "basis": "コラーゲン線維などの骨基質を合成するのは骨芽細胞。破骨細胞は骨基質を分解する", "page": "p.10〜11"}, {"ok": true, "basis": "結合組織にはヒスタミンを分泌する肥満細胞（マスト細胞）が含まれる", "page": "p.10"}, {"ok": false, "basis": "線維芽細胞は膠原線維をつくる細胞。強い食作用をもつのはマクロファージや白血球", "page": "p.10"}, {"ok": false, "basis": "シュワン細胞は末梢神経系で軸索を保護する支持細胞。中枢神経系の支持細胞はグリア細胞（神経膠細胞）", "page": "p.12"}], "status": "確認済み"}, {"id": "2-02", "section": "1 身体の構造と機能 ❸器官とその統合", "type": "incorrect", "stem": "器官系に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["心臓自体を養う特殊な血管は，冠状動脈という。", "腎臓の糸球体で濾過され，尿細管に導かれた原尿は約150L/日である。", "脳からは12対の脳神経，脊髄からは31対の脊髄神経の線維が出入りする。", "排尿に必要な膀胱壁の筋の収縮は，交感神経によって促進される。", "骨格筋は横紋筋で構成され，大脳からの指令によって動かすことができる随意筋である。"], "answer": 4, "explanations": [{"ok": true, "basis": "心臓自体を養う特殊な血管は冠状動脈という", "page": "p.13"}, {"ok": true, "basis": "糸球体で濾過され尿細管に導かれた原尿は約150L/日", "page": "p.13"}, {"ok": true, "basis": "脳からは12対の末梢神経（脳神経），脊髄からは31対の末梢神経（脊髄神経）の線維が出入りする", "page": "p.13"}, {"ok": false, "basis": "膀胱壁の筋の収縮（と尿道括約筋の弛緩）は副交感神経によって支配される。交感神経は排尿を抑制する（表2-4）", "page": "p.13, p.38"}, {"ok": true, "basis": "骨格筋は横紋筋で構成され，大脳からの指令によって動かすことができる随意筋", "page": "p.13"}], "status": "確認済み"}, {"id": "2-03", "section": "1 身体の構造と機能 ❹器官系の成長・発達の特徴", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "スキャモンは，臓器の発育パターンを一般型，神経系型，生殖器型，リンパ系型の4つに類型化した。脳，脊髄，頭部，眼球などの大きさの成長が乳児期に極めて速く，その後緩やかになるのは（ a ）である。（ b ）は思春期から急激なスパートがあり，これは内分泌系の機能の亢進によるものである。リンパ系型に属する胸腺，扁桃，リンパ節などの重量は（ c ）歳ごろに最大となり，その後減少する。", "choices": ["a 一般型　b 生殖器型　c 10〜12", "a 神経系型　b 生殖器型　c 10〜12", "a 神経系型　b 一般型　c 16〜18", "a 神経系型　b 生殖器型　c 16〜18", "a 一般型　b 生殖器型　c 16〜18"], "answer": 2, "explanations": [{"ok": false, "basis": "a は神経系型。一般型は生後S字型の発育曲線を示す", "page": "p.14〜15"}, {"ok": true, "basis": "神経系型は乳児期に極めて速く成長し，その後緩やか。生殖器型は思春期から急激なスパート（内分泌系の機能亢進による）。リンパ系型の重量は10〜12歳ごろに最大", "page": "p.15"}, {"ok": false, "basis": "b は生殖器型，c は10〜12", "page": "p.15"}, {"ok": false, "basis": "c は10〜12", "page": "p.15"}, {"ok": false, "basis": "a は神経系型，c は10〜12", "page": "p.15"}], "status": "確認済み"}, {"id": "2-04", "section": "1 身体の構造と機能 ❺加齢に伴う器官系の機能の変化", "type": "correct", "stem": "加齢に伴う器官系の機能の変化に関する記述である。正しいのはどれか。", "passage": "", "choices": ["唾液，胃液，膵液によって分泌される消化酵素の活性は若年者の30〜70%まで低下し，特に胃酸分泌量の減少が著しい。", "高齢者のたんぱく質や脂質の消化・吸収率は，若年者に比べて大きく低下する。", "心臓は，加齢によって萎縮する。", "腎臓の機能の低下は，60歳ごろからみられる。", "女性では，エストロゲンの血中濃度の低下に伴い，卵胞刺激ホルモン（FSH）と黄体形成ホルモン（LH）の血中濃度も低下する。"], "answer": 1, "explanations": [{"ok": true, "basis": "加齢により消化酵素の活性は若年者の30〜70%まで低下し，特に胃酸分泌量の減少は著しい", "page": "p.15"}, {"ok": false, "basis": "消化・吸収速度は低下していると考えられるが，消化・吸収率は高齢者と若年者に大きな差はない", "page": "p.15"}, {"ok": false, "basis": "心臓は加齢によって萎縮することはないが，弾力性が低下する", "page": "p.17"}, {"ok": false, "basis": "腎臓は40歳ごろから機能の低下がみられる", "page": "p.17"}, {"ok": false, "basis": "エストロゲン低下に伴い，代償的にFSH・LHの血中濃度は上昇する", "page": "p.17"}], "status": "確認済み"}, {"id": "2-05", "section": "2 消化・吸収 ❶消化器系の構造と機能", "type": "incorrect", "stem": "消化管の構造に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["消化管は，原則として粘膜，筋層，漿膜（食道では外膜）の3層からなる。", "消化管の筋層は，原則として内輪，外縦の2層の平滑筋からなる。", "胃は消化管の中で最も拡張した部分であり，成人では内容が1,200〜1,400mLになる。", "小腸は6〜7mの管であり，十二指腸は約25cmである。", "小腸管腔の表面積は，輪状ひだならびに絨毛の形成によって約20倍に増大する。"], "answer": 5, "explanations": [{"ok": true, "basis": "消化管は原則として粘膜，筋層，漿膜（食道では外膜）の3層からなる", "page": "p.18"}, {"ok": true, "basis": "筋層は原則として内輪，外縦の2層の平滑筋からなる", "page": "p.18"}, {"ok": true, "basis": "胃は消化管の中で最も拡張した部分で，成人では内容が1,200〜1,400mL", "page": "p.18"}, {"ok": true, "basis": "小腸は6〜7mの管で，十二指腸（約25cm），空腸（残りの約2/5），回腸（約3/5）に分けられる", "page": "p.20"}, {"ok": false, "basis": "輪状ひだと絨毛による増大は約30倍。約20倍は微絨毛による1個の細胞当たりの管腔表面積の増大", "page": "p.20"}], "status": "確認済み"}, {"id": "2-06", "section": "2 消化・吸収 ❷消化・吸収の基本概念", "type": "pair", "stem": "消化管ホルモンとそれを分泌する細胞の組合せである。正しいのはどれか。", "passage": "", "choices": ["ガストリン ―― S細胞", "セクレチン ―― I細胞", "コレシストキニン（CCK） ―― K細胞", "グルカゴン様ペプチド（GLP-1） ―― L細胞", "グレリン ―― G細胞"], "answer": 4, "explanations": [{"ok": false, "basis": "ガストリンはG細胞から分泌される", "page": "p.23"}, {"ok": false, "basis": "セクレチンはS細胞から分泌される", "page": "p.23"}, {"ok": false, "basis": "コレシストキニン（CCK）はI細胞から分泌される。K細胞はGIP", "page": "p.23"}, {"ok": true, "basis": "GLP-1はL細胞から分泌される（表2-2）", "page": "p.23"}, {"ok": false, "basis": "グレリンはX細胞から分泌される", "page": "p.23"}], "status": "確認済み"}, {"id": "2-07", "section": "2 消化・吸収 ❷消化・吸収の基本概念／❸管腔内消化とその調節", "type": "correct", "stem": "消化液の分泌とその調節に関する記述である。正しいのはどれか。", "passage": "", "choices": ["ペプシノーゲンは，胃腺の壁細胞から分泌される。", "ペプシノーゲンは，胃酸によって直ちに活性型のペプシンに転換される。", "舌下腺からは主に漿液が，耳下腺からは主に粘液が分泌される。", "アウエルバッハ神経叢は粘膜下層にあり，絨毛運動にかかわる。", "胃内容物のpHが2以下になると，ガストリンの分泌は促進される。"], "answer": 2, "explanations": [{"ok": false, "basis": "ペプシノーゲンは主細胞から分泌される。壁細胞は塩酸（胃酸）を分泌する", "page": "p.24"}, {"ok": true, "basis": "主細胞が分泌するペプシノーゲンは，胃酸によって直ちに活性型のペプシンに転換される", "page": "p.24"}, {"ok": false, "basis": "舌下腺からは主に粘液，耳下腺からは主に漿液が分泌される", "page": "p.23"}, {"ok": false, "basis": "アウエルバッハ神経叢は筋層の内・外層の間にあり収縮運動にかかわる。粘膜下層にあり絨毛運動にかかわるのはマイスナー神経叢", "page": "p.22"}, {"ok": false, "basis": "胃内容物のpHが2以下になると，ガストリンの分泌は抑制される（フィードバック機構）", "page": "p.24〜25"}], "status": "確認済み"}, {"id": "2-08", "section": "2 消化・吸収 ❸管腔内消化とその調節", "type": "incorrect", "stem": "膵液と胆汁の分泌に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["膵臓は，重さ80〜160gの実質臓器である。", "消化粥のH⁺濃度の上昇を感受して，S細胞からセクレチンが分泌される。", "一次胆汁酸と二次胆汁酸は，いずれも空腸上部で能動的に吸収される。", "トリプシノーゲンは，小腸微絨毛膜にあるエンテロペプチダーゼによって活性型のトリプシンになる。", "コレシストキニン（CCK）は，胆嚢を収縮させる。"], "answer": 3, "explanations": [{"ok": true, "basis": "膵臓は長さ約15cm，重さ80〜160gの実質臓器", "page": "p.26"}, {"ok": true, "basis": "消化粥のH⁺濃度の上昇を感受してS細胞からセクレチンが分泌される", "page": "p.26"}, {"ok": false, "basis": "一次胆汁酸と二次胆汁酸は，いずれも回腸下部で能動的に吸収され，門脈を経て肝細胞に取り込まれる", "page": "p.27"}, {"ok": true, "basis": "トリプシノーゲンが小腸微絨毛膜のエンテロペプチダーゼによって一部切断されて活性型のトリプシンになる", "page": "p.26"}, {"ok": true, "basis": "CCKは胆嚢を収縮させる", "page": "p.27"}], "status": "確認済み"}, {"id": "2-09", "section": "2 消化・吸収 ❹膜消化・吸収", "type": "correct", "stem": "膜消化・吸収に関する記述である。正しいのはどれか。", "passage": "", "choices": ["管腔内消化に関与するα-アミラーゼやトリプシンは，「エキソ型」の加水分解酵素である。", "小腸上皮の細胞側路は陰イオンに対する選択性を有し，Cl⁻に対する透過性が高い。", "一次性能動輸送の本体であるNa⁺/K⁺-ATPアーゼは，吸収細胞の微絨毛膜に存在する。", "微絨毛膜を通過した水溶性の栄養素は，側面・底面膜を能動輸送によって通過する。", "胃ではアルコールや一部の薬物が吸収されるが，水やグルコースは吸収されない。"], "answer": 5, "explanations": [{"ok": false, "basis": "α-アミラーゼ，トリプシンなどは末端以外のユニット間を切断する「エンド型」。エキソ型の酵素は微絨毛膜に局在する", "page": "p.27"}, {"ok": false, "basis": "細胞側路は陽イオンに対する選択性を有し，K⁺やNa⁺の透過性が高く，Cl⁻の透過性は低い", "page": "p.28"}, {"ok": false, "basis": "Na⁺/K⁺-ATPアーゼ（一次性能動輸送）は吸収細胞の側面・底面膜に存在する", "page": "p.28"}, {"ok": false, "basis": "側面・底面膜の輸送は担体を通して行われるが能動輸送ではなく，濃度勾配に従った促進拡散", "page": "p.29"}, {"ok": true, "basis": "胃ではアルコールや一部の薬物が吸収されるが，水やグルコースは吸収されない", "page": "p.27"}], "status": "確認済み"}, {"id": "2-10", "section": "2 消化・吸収 ❺栄養素別の消化・吸収", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "グルコースとガラクトースは，小腸吸収細胞の微絨毛膜の（ a ）によって能動的に細胞内に取り込まれる。フルクトースは（ b ）によって細胞内に取り込まれる。これらの単糖の細胞内の濃度が高まると，側面・底面膜に局在する（ c ）によって細胞間隙へ輸送され，門脈に集められる。", "choices": ["a SGLT1　b GLUT2　c GLUT5", "a GLUT2　b GLUT5　c SGLT1", "a SGLT1　b GLUT5　c GLUT4", "a SGLT1　b GLUT5　c GLUT2", "a GLUT5　b SGLT1　c GLUT2"], "answer": 4, "explanations": [{"ok": false, "basis": "b はGLUT5（フルクトース輸送体），c はGLUT2", "page": "p.31"}, {"ok": false, "basis": "a はSGLT1（Na⁺/D-グルコース共輸送体），c はGLUT2", "page": "p.31"}, {"ok": false, "basis": "c はGLUT2。GLUT4は骨格筋と脂肪組織でインスリンに応答する輸送体", "page": "p.31, p.50"}, {"ok": true, "basis": "グルコースとガラクトースはSGLT1で能動的に，フルクトースはGLUT5で取り込まれ，側面・底面膜のGLUT2で細胞間隙へ輸送される", "page": "p.31"}, {"ok": false, "basis": "a はSGLT1，b はGLUT5", "page": "p.31"}], "status": "確認済み"}, {"id": "2-11", "section": "2 消化・吸収 ❺栄養素別の消化・吸収", "type": "incorrect", "stem": "たんぱく質と脂質の消化・吸収に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["微絨毛膜におけるアミノ酸の輸送は，Na⁺の濃度勾配を利用する能動輸送である。", "膵リパーゼは，トリアシルグリセロールの2位の脂肪酸エステル結合を加水分解する。", "ジペプチド，トリペプチドは，H⁺の濃度勾配を利用した能動輸送によって細胞内に取り込まれる。", "摂取された50gの脂肪がすべて十二指腸に達するには，4〜6時間かかる。", "中鎖脂肪酸は水溶性が高いため，門脈血中に取り込まれる。"], "answer": 2, "explanations": [{"ok": true, "basis": "微絨毛膜におけるアミノ酸の輸送はNa⁺の濃度勾配を利用する能動輸送", "page": "p.32"}, {"ok": false, "basis": "膵リパーゼはトリアシルグリセロールの1,3位の脂肪酸エステル結合を加水分解し，脂肪酸とモノアシルグリセロールが生じる", "page": "p.33"}, {"ok": true, "basis": "ジペプチド，トリペプチドはH⁺の濃度勾配を利用して能動輸送によって細胞内に取り込まれる", "page": "p.32"}, {"ok": true, "basis": "摂取された50gの脂肪がすべて十二指腸に達するには4〜6時間かかる", "page": "p.3 5, "explanations": [{"ok": true, "basis": "表2-5で空腹，睡眠不足は生物学的要因に挙げられている", "page": "p.39"}, {"ok": true, "basis": "警告反応の初期は血圧，体温，血糖などが低下し，抵抗力が一時的に低下する（ショック相）", "page": "p.39"}, {"ok": true, "basis": "CRHの分泌により下垂体からACTHが分泌され，副腎皮質におけるコルチゾールやミネラルコルチコイドの分泌が促進される", "page": "p.40"}, {"ok": true, "basis": "コルチゾールの過剰分泌に伴い，胸腺，リンパ腺，脾臓の萎縮が起こり，免疫力が低下する", "page": "p.41"}, {"ok": false, "basis": "抵抗期にほかのストレスが加わると，新たなストレスに対する抵抗力は弱い", "page": "p.39〜40"}], "status": "確認済み"}, {"id": "2-15", "section": "4 内分泌，ホルモンの作用 ❶〜❷ホルモンの構造と作用機序，分泌調節機構", "type": "correct", "stem": "ホルモンの分泌様式と作用機序に関する記述である。正しいのはどれか。", "passage": "", "choices": ["たんぱく質・ペプチドホルモンの受容体は，標的細胞の核内に存在する。", "自己の細胞に作用する分泌様式を，傍分泌（パラクリン）という。", "ステロイドホルモンはコレステロールを材料にして合成され，副腎皮質および性腺から分泌される。", "甲状腺ホルモンはチロシンの誘導体であり，水溶性が高い。", "副腎髄質ホルモンは脂溶性であり，核内受容体を介して作用する。"], "answer": 3, "explanations": [{"ok": false, "basis": "たんぱく質・ペプチドホルモンは細胞膜を通過できないため，受容体は標的細胞の細胞膜に存在する", "page": "p.42"}, {"ok": false, "basis": "自己の細胞に作用するのは自己分泌（オートクリン）。傍分泌（パラクリン）は組織液を介して近くの細胞に作用する", "page": "p.42"}, {"ok": true, "basis": "ステロイドホルモンはコレステロールを材料にして合成され，副腎皮質および性腺から分泌される", "page": "p.42"}, {"ok": false, "basis": "甲状腺ホルモンはチロシンの誘導体であるが水溶性は低く，核内受容体を介して作用する", "page": "p.43"}, {"ok": false, "basis": "副腎髄質ホルモン（カテコールアミン）は水溶性であり，細胞膜の受容体に結合して作用する", "page": "p.43"}], "status": "確認済み"}, {"id": "2-16", "section": "4 内分泌，ホルモンの作用 ❸視床下部，下垂体とホルモン", "type": "pair", "stem": "下垂体ホルモンとその標的組織の組合せである。正しいのはどれか。", "passage": "", "choices": ["成長ホルモン ―― 乳腺", "卵胞刺激ホルモン（FSH） ―― 精巣（ライディッヒ細胞）", "抗利尿ホルモン（バソプレシン） ―― 子宮", "オキシトシン ―― 腎臓の集合管", "黄体形成ホルモン（LH） ―― 精巣（ライディッヒ細胞）"], "answer": 5, "explanations": [{"ok": false, "basis": "成長ホルモンの標的組織は全身。乳腺はプロラクチンの標的組織", "page": "p.45"}, {"ok": false, "basis": "FSHの標的組織は卵巣と精巣（セルトリ細胞）", "page": "p.45"}, {"ok": false, "basis": "抗利尿ホルモン（バソプレシン）の標的組織は腎臓の集合管", "page": "p.45"}, {"ok": false, "basis": "オキシトシンの標的組織は平滑筋（子宮・乳腺）", "page": "p.45"}, {"ok": true, "basis": "LHの標的組織は卵巣と精巣（ライディッヒ細胞）", "page": "p.45"}], "status": "確認済み"}, {"id": "2-17", "section": "4 内分泌，ホルモンの作用 ❹甲状腺と甲状腺ホルモン〜❻副腎皮質・髄質とホルモン", "type": "correct", "stem": "甲状腺，副甲状腺および副腎のホルモンに関する記述である。正しいのはどれか。", "passage": "", "choices": ["サイロキシン（T4）は，分子内にヨウ素を3個有する。", "アルドステロンは，腎臓の遠位尿細管に作用し，ナトリウムの再吸収と水の再吸収を促進する。", "副甲状腺ホルモン（PTH）は，腎尿細管におけるカルシウムの再吸収を抑制する。", "カルシトニンは，血中のカルシウム濃度が低下したときに分泌が亢進する。", "トリヨードサイロニン（T3）は，脱ヨウ素化されてT4に変換される。"], "answer": 2, "explanations": [{"ok": false, "basis": "サイロキシン（T4）はヨウ素を4個有する。ヨウ素3個はトリヨードサイロニン（T3）", "page": "p.47"}, {"ok": true, "basis": "アルドステロンは腎臓の遠位尿細管に作用し，ナトリウムの再吸収と水の再吸収を促進する", "page": "p.48"}, {"ok": false, "basis": "PTHは腎尿細管におけるカルシウムの再吸収を促進し，血中カルシウム濃度を上昇させる", "page": "p.48"}, {"ok": false, "basis": "カルシトニンは血中のカルシウム濃度が上昇したときに分泌が亢進する", "page": "p.48"}, {"ok": false, "basis": "T4が脱ヨウ素化されてT3に変換される。T3が甲状腺ホルモンの主要な生理的活性体", "page": "p.47"}], "status": "確認済み"}, {"id": "2-18", "section": "4 内分泌，ホルモンの作用 ❼膵臓ランゲルハンス島とホルモン〜❾性腺とホルモン", "type": "correct", "stem": "膵臓，消化管および性腺のホルモンに関する記述である。正しいのはどれか。", "passage": "", "choices": ["インスリンは，ランゲルハンス島のα細胞から分泌される。", "GLP-1を分泌するL細胞は，十二指腸から空腸にかけて分布する。", "食事中のたんぱく質は，GIPの分泌を著しく促進する。", "ソマトスタチンは，δ細胞から分泌された後，血管を介さずに隣接するα細胞やβ細胞に作用する。", "プロゲステロンは，排卵と子宮筋の運動を促進する。"], "answer": 4, "explanations": [{"ok": false, "basis": "インスリンはβ細胞から分泌される。α細胞はグルカゴンを分泌する", "page": "p.50"}, {"ok": false, "basis": "L細胞は空腸下部から結腸にかけて散在する。十二指腸から空腸にかけて分布するのはGIPを分泌するK細胞", "page": "p.51"}, {"ok": false, "basis": "食事中のたんぱく質はGIPの分泌促進作用は弱いが，GLP-1の分泌を著しく促進する", "page": "p.51"}, {"ok": true, "basis": "ソマトスタチンはδ細胞から分泌された後，血管を介さずに隣接するα細胞やβ細胞に作用（傍分泌）し，グルカゴンやインスリンの過剰分泌を抑制する", "page": "p.50"}, {"ok": false, "basis": "プロゲステロンは排卵と子宮筋の運動を抑制し，妊娠状態を安定化させる", "page": "p.52"}], "status": "確認済み"}]}, {"chapter": 3, "chapterTitle": "基礎の生化学", "questions": [{"id": "3-01", "section": "1 糖質の代謝 ❶糖質の代謝の概要／❷解糖経路", "type": "correct", "stem": "糖質の代謝と解糖経路に関する記述である。正しいのはどれか。", "passage": "", "choices": ["解糖経路は、ミトコンドリア内で行われる。", "解糖経路では、グルコース1分子から正味2分子のATPが生成される。", "ペントースリン酸経路では、NADH+H⁺が生成され、脂肪酸やステロイド合成の際の水素供与体として使われる。", "ウロン酸経路で生じるグルクロン酸は、主に核酸の合成に利用される。", "好気的条件下では、酸化的リン酸化により2分子のNADH+H⁺から3分子のATPが生成する。"], "answer": 2, "explanations": [{"ok": false, "basis": "解糖経路は細胞質ゾルで行われる", "page": "p.54"}, {"ok": true, "basis": "嫌気的条件下で起こり、グルコース1分子から正味2分子のATPが生成される", "page": "p.54"}, {"ok": false, "basis": "ペントースリン酸経路で生成されるのはリボース5-リン酸とNADPH+H⁺。NADPH+H⁺が水素供与体（還元型補酵素）として使われる", "page": "p.53"}, {"ok": false, "basis": "ウロン酸経路のグルクロン酸は解毒反応の抱合に利用される。核酸合成に必要なリボース5-リン酸はペントースリン酸経路で生成", "page": "p.53"}, {"ok": false, "basis": "2分子のNADH+H⁺からは5分子のATP。3分子のATPが生成するのは2分子のFADH₂から", "page": "p.54"}], "status": "確認済み"}, {"id": "3-02", "section": "1 糖質の代謝 ❹糖新生／❺グリコーゲンの代謝", "type": "incorrect", "stem": "糖新生とグリコーゲンの代謝に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["糖新生は、肝臓や腎臓で、糖原性アミノ酸、乳酸、グリセロールなどからグルコースを生成することである。", "解糖経路には、不可逆反応が3カ所存在する。", "筋肉にはグルコース-6-ホスファターゼが存在するため、筋肉グリコーゲンは血糖の供給に利用される。", "糖新生で1分子のグルコースを生成するためには、6分子の高エネルギー化合物（ATPとGTP）が消費される。", "グリコーゲン合成では、UDP-グルコースのグルコース残基が既存のグリコーゲン分子に移され、α-1,4結合する。"], "answer": 3, "explanations": [{"ok": true, "basis": "肝臓や腎臓で糖原性アミノ酸、乳酸、グリセロールなど糖質以外の物質からグルコースを生成することを糖新生という", "page": "p.56"}, {"ok": true, "basis": "解糖経路には不可逆反応が3カ所あり、糖新生ではこの3カ所は別の経路や酵素で進行する", "page": "p.56"}, {"ok": false, "basis": "筋肉にはグルコース-6-ホスファターゼが存在しないため解糖経路で代謝される。筋肉グリコーゲンは血糖供給を行わない", "page": "p.57"}, {"ok": true, "basis": "1分子のグルコースを生成するためには6分子の高エネルギー化合物（ATPとGTP）が消費される", "page": "p.56"}, {"ok": true, "basis": "UDP-グルコースのグルコース残基は既存のグリコーゲン分子に移されα-1,4結合する（グリコーゲンシンターゼが触媒）", "page": "p.57"}], "status": "確認済み"}, {"id": "3-03", "section": "1 糖質の代謝 ❻血糖の調節", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "血糖が上昇すると、膵臓のランゲルハンス島（ a ）細胞からインスリンが分泌され、グリコーゲンシンターゼを活性型に変える。血糖が低下すると、膵臓のランゲルハンス島α細胞からグルカゴンが、（ b ）からアドレナリンが分泌され、グリコーゲンホスホリラーゼを活性型に、グリコーゲンシンターゼを（ c ）に変える。", "choices": ["a α　b 副腎髄質　c 不活性型", "a β　b 副腎皮質　c 不活性型", "a β　b 副腎髄質　c 活性型", "a β　b 副腎髄質　c 不活性型", "a α　b 副腎皮質　c 活性型"], "answer": 4, "explanations": [{"ok": false, "basis": "a はβ（インスリンはβ細胞から分泌）", "page": "p.57"}, {"ok": false, "basis": "b は副腎髄質（アドレナリンは副腎髄質から分泌）", "page": "p.57"}, {"ok": false, "basis": "c は不活性型（血糖低下時、グリコーゲンシンターゼは不活性型になる）", "page": "p.57"}, {"ok": true, "basis": "血糖上昇時はβ細胞からインスリン。血糖低下時はα細胞からグルカゴン、副腎髄質からアドレナリンが分泌され、ホスホリラーゼを活性型、シンターゼを不活性型に変える（リン酸化）", "page": "p.57"}, {"ok": false, "basis": "a はβ、b は副腎髄質、c は不活性型", "page": "p.57"}], "status": "確認済み"}, {"id": "3-04", "section": "2 脂質の代謝 ❷リポたんぱく質の代謝の概要", "type": "correct", "stem": "血漿リポたんぱく質に関する記述である。正しいのはどれか。", "passage": "", "choices": ["キロミクロンは、食事脂肪を脂肪組織などへ輸送する働きをもち、肝臓から分泌される。", "LDLは、たんぱく質の占める割合が多く、密度が最も大きい。", "HDLの主なアポたんぱく質は、B-100である。", "VLDLは、末梢組織でリポたんぱく質リパーゼによりトリアシルグリセロールが分解され、IDLを経てLDLへ代謝される。", "キロミクロンは、リポたんぱく質の中で直径が最も小さい。"], "answer": 4, "explanations": [{"ok": false, "basis": "キロミクロンは小腸から分泌される", "page": "p.60"}, {"ok": false, "basis": "たんぱく質の割合が多く密度が最も大きいのはHDL", "page": "p.60"}, {"ok": false, "basis": "表3-1でHDLのアポたんぱく質はA。B-100はLDL（VLDL、IDLにも含まれる）", "page": "p.60"}, {"ok": true, "basis": "VLDLは末梢組織でリポたんぱく質リパーゼによりトリアシルグリセロールが分解され、IDLを経てLDLへ代謝される", "page": "p.60"}, {"ok": false, "basis": "キロミクロンはトリアシルグリセロールに富み、直径が大きく密度が小さい（表3-1：直径75〜1,200 nm）", "page": "p.60"}], "status": "確認済み"}, {"id": "3-05", "section": "2 脂質の代謝 ❸トリアシルグリセロールの合成／❹トリアシルグリセロールの分解", "type": "incorrect", "stem": "脂肪酸の合成と分解に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["脂肪酸の合成は、肝臓、腎臓、脂肪組織などの各組織の細胞質ゾルで行われる。", "パルミチン酸1分子が完全に酸化されると、正味108分子のATPが生成される。", "脂肪酸合成の律速酵素はアセチルCoAカルボキシラーゼであり、インスリンによって活性化される。", "アシルCoAは、カルニチンアシル基転移酵素Ⅰによってアシルカルニチンになり、ミトコンドリア内膜を通過する。", "パルミチン酸の場合は、7回のβ酸化で8分子のアセチルCoAが生成する。"], "answer": 2, "explanations": [{"ok": true, "basis": "脂肪酸の合成は肝臓、腎臓、脂肪組織などの各組織の細胞質ゾルで行われる", "page": "p.61"}, {"ok": false, "basis": "総計108分子だが、パルミチン酸をパルミトイルCoAにする際に2分子のATP相当が消費されるので、正味は106分子", "page": "p.62〜64"}, {"ok": true, "basis": "律速酵素はアセチルCoAカルボキシラーゼ。インスリンで活性化、アドレナリンや脂肪酸で抑制される", "page": "p.61"}, {"ok": true, "basis": "内膜のカルニチンアシル基転移酵素Ⅰによってアシルカルニチンとなり内膜を通過する", "page": "p.61"}, {"ok": true, "basis": "パルミチン酸は7回のβ酸化で8分子のアセチルCoAが生成する", "page": "p.62"}], "status": "確認済み"}, {"id": "3-06", "section": "2 脂質の代謝 ❺ケトン体／❻多価不飽和脂肪酸からのエイコサノイド生成／❽胆汁酸の腸肝循環", "type": "correct", "stem": "ケトン体、エイコサノイドおよび胆汁酸に関する記述である。正しいのはどれか。", "passage": "", "choices": ["肝臓はケトン体を異化する酵素をもつため、ケトン体は主に肝臓でエネルギー源として利用される。", "エイコサノイドは、炭素数が18個の多価不飽和脂肪酸から生成する生理活性物質の総称である。", "一次胆汁酸の合成の律速酵素は、HMG-CoA還元酵素である。", "回腸に達した胆汁酸は、再吸収されずに大部分が糞便中へ排泄される。", "ケトン体は、アセト酢酸、3-ヒドロキシ酪酸、アセトンの総称である。"], "answer": 5, "explanations": [{"ok": false, "basis": "肝臓にはケトン体を異化する酵素がないため、ケトン体は脳や肝外組織に運ばれエネルギー源として利用される", "page": "p.64"}, {"ok": false, "basis": "エイコサノイドは炭素数が20個の多価不飽和脂肪酸から生成する", "page": "p.64"}, {"ok": false, "basis": "一次胆汁酸の合成の律速酵素はコレステロール7α-ヒドロキシラーゼ。HMG-CoA還元酵素はコレステロール合成の律速酵素", "page": "p.65"}, {"ok": false, "basis": "回腸に達した胆汁酸は再吸収され、門脈を経由して肝臓に取り込まれる（腸肝循環）", "page": "p.65"}, {"ok": true, "basis": "ケトン体はアセト酢酸、3-ヒドロキシ酪酸、アセトンの総称", "page": "p.64"}], "status": "確認済み"}, {"id": "3-07", "section": "3 アミノ酸の代謝 ❷アミノ基転移反応／❸酸化的脱アミノ反応／❹尿素回路", "type": "correct", "stem": "アミノ酸の代謝に関する記述である。正しいのはどれか。", "passage": "", "choices": ["アミノ基転移酵素は、補酵素としてチアミンピロリン酸（ビタミンB₁の補酵素型）を必要とする。", "酸化的脱アミノ反応において、グルタミン酸デヒドロゲナーゼなどのアミノ酸脱水素酵素はFADを補酵素とする。", "尿素をつくる窒素の1つはアンモニア由来で、もう1つはアスパラギン酸のアミノ基由来である。", "尿素回路の律速酵素は、アルギナーゼである。", "尿素回路では、アルギニンが加水分解されて尿素が生成し、シトルリンが再生される。"], "answer": 3, "explanations": [{"ok": false, "basis": "アミノ基転移酵素の補酵素はピリドキサールリン酸（ビタミンB₆の補酵素型）", "page": "p.66"}, {"ok": false, "basis": "アミノ酸脱水素酵素はNAD、アミノ酸酸化酵素はFADを補酵素とする", "page": "p.66"}, {"ok": true, "basis": "尿素をつくる窒素の1つはアンモニア由来、もう1つはアスパラギン酸のアミノ基由来", "page": "p.67"}, {"ok": false, "basis": "尿素回路の律速酵素はカルバモイルリン酸シンターゼ（カルバモイルリン酸合成酵素）", "page": "p.66〜67"}, {"ok": false, "basis": "アルギニンはアルギナーゼにより加水分解されて尿素が生成し、オルニチンが再生される", "page": "p.67"}], "status": "確認済み"}, {"id": "3-08", "section": "3 アミノ酸の代謝 ❻アミノ酸特殊生成物への変換", "type": "pair", "stem": "アミノ酸特殊生成物とその材料（アミノ酸）の組合せである。正しいのはどれか。", "passage": "", "choices": ["セロトニン ―― チロシン", "カルニチン ―― ヒスチジン", "タウリン ―― システイン", "S-アデノシルメチオニン ―― グリシン", "ヒスタミン ―― グルタミン酸"], "answer": 3, "explanations": [{"ok": false, "basis": "セロトニンの材料はトリプトファン（表3-2）", "page": "p.69"}, {"ok": false, "basis": "カルニチンの材料はリシン（表3-2）", "page": "p.69"}, {"ok": true, "basis": "タウリンの材料はシステイン（表3-2）", "page": "p.69"}, {"ok": false, "basis": "S-アデノシルメチオニンの材料はメチオニン（表3-2）", "page": "p.69"}, {"ok": false, "basis": "ヒスタミンの材料はヒスチジン。グルタミン酸はγ-アミノ酪酸（GABA）の材料（表3-2）", "page": "p.69"}], "status": "確認済み"}, {"id": "3-09", "section": "4 核酸の化学とたんぱく質合成 ❶核酸／❷プリン・ピリミジンヌクレオチドの代謝", "type": "correct", "stem": "核酸とヌクレオチドの代謝に関する記述である。正しいのはどれか。", "passage": "", "choices": ["ヌクレオチドでは、五炭糖の1′位の炭素に塩基がエステル結合している。", "ヌクレオシドの五炭糖の5′位の炭素にリン酸基がエステル結合すると、ヌクレオチドになる。", "DNAの糖部分は、リボースの3位の水酸基から酸素が外れた2-デオキシリボースである。", "プリンヌクレオチドの de novo 合成で、最初に合成されるプリンヌクレオチドはアデニル酸（AMP）である。", "プリンヌクレオチドの約50%は、サルベージ経路によって再利用されている。"], "answer": 2, "explanations": [{"ok": false, "basis": "五炭糖の1′位の炭素に塩基がN-グリコシド結合している", "page": "p.70"}, {"ok": true, "basis": "ヌクレオシドの五炭糖の5′位の炭素にリン酸基がエステル結合するとヌクレオチドになる", "page": "p.70"}, {"ok": false, "basis": "DNAの2-デオキシリボースは、リボースの2位の水酸基から酸素が外れたもの", "page": "p.70"}, {"ok": false, "basis": "最初に合成されるプリンヌクレオチドはイノシン酸（IMP）。IMPからAMPやGMPが合成される", "page": "p.70"}, {"ok": false, "basis": "プリンヌクレオチドの90%がサルベージ経路によって再利用されている", "page": "p.71"}], "status": "確認済み"}, {"id": "3-10", "section": "4 核酸の化学とたんぱく質合成 ❸核酸と遺伝子／❹たんぱく質合成", "type": "correct", "stem": "遺伝子とたんぱく質合成に関する記述である。正しいのはどれか。", "passage": "", "choices": ["DNAでは、グアニン（G）はチミン（T）と相補的塩基対を形成する。", "転写では、RNAポリメラーゼが相補的なヌクレオチドを3′から5′方向へ連結していく。", "mRNAは、5′末端にポリA鎖を、3′末端にキャップ構造を付加される。", "翻訳では、ペプチド鎖がC末端からN末端に向かって合成される。", "メチオニンとトリプトファンを除いて、アミノ酸は複数のコドンで指定される。"], "answer": 5, "explanations": [{"ok": false, "basis": "グアニン（G）はシトシン（C）と、アデニン（A）はチミン（T）またはウラシル（U）と相補的塩基対を形成する", "page": "p.74"}, {"ok": false, "basis": "RNAポリメラーゼはヌクレオチドを5′から3′方向へ連結していく", "page": "p.74"}, {"ok": false, "basis": "5′末端にキャップ構造を、3′末端にポリA鎖を付加する", "page": "p.74"}, {"ok": false, "basis": "ペプチド鎖はN末端からC末端に向かって合成される", "page": "p.75"}, {"ok": true, "basis": "メチオニンとトリプトファンを除いてアミノ酸は複数のコドンで指定される", "page": "p.75"}], "status": "確認済み"}, {"id": "3-11", "section": "5 血液の働き ❶血液の成分と組成，主要な機能／❷ヘモグロビン", "type": "correct", "stem": "血液の成分とヘモグロビンに関する記述である。正しいのはどれか。", "passage": "", "choices": ["ヘモグロビンは、血漿中の酸素溶解量にくらべて約7倍の酸素を結合し、運搬する能力がある。", "単球は、血管外に出て形質細胞に分化し、食作用を有する。", "筋肉中のミオグロビンは、酸素平衡曲線がS字曲線になる。", "血液中の約55%は液体成分で、そのうち約90%が水分である。", "ヘムが分解される際に放出された鉄は、大部分が体外に排泄される。"], "answer": 4, "explanations": [{"ok": false, "basis": "ヘモグロビンは血漿中の酸素溶解量にくらべて約70倍の酸素を結合する", "page": "p.77"}, {"ok": false, "basis": "単球は血管外に出てマクロファージに分化し、食作用を有する", "page": "p.78"}, {"ok": false, "basis": "ミオグロビンは1本のポリペプチド鎖からなりアロステリック効果がないため、酸素平衡曲線はS字型にならない", "page": "p.79"}, {"ok": true, "basis": "血液中の約55%は液体成分で、そのうち約90%が水分", "page": "p.77"}, {"ok": false, "basis": "ヘムが分解される際に放出された鉄は大部分が再利用される", "page": "p.79"}], "status": "確認済み"}, {"id": "3-12", "section": "5 血液の働き ❹血漿たんぱく質／❺血液凝固／❻酸-塩基平衡", "type": "incorrect", "stem": "血漿たんぱく質、血液凝固および酸-塩基平衡に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["血漿たんぱく質の組成比は、アルブミン55〜60%、グロブリン30〜40%、フィブリノーゲン2〜3%である。", "γ-グロブリンは免疫グロブリンであり、リンパ球（B細胞）で合成される。", "リン酸緩衝系では、HPO₄²⁻とH₂PO₄⁻のバランスにより肺で調節が行われる。", "血液凝固では、トロンビンがフィブリノーゲンをフィブリンモノマーに変化させる。", "正常な動脈血のpHは7.4である。"], "answer": 3, "explanations": [{"ok": true, "basis": "組成比はアルブミン55〜60%、グロブリン30〜40%、フィブリノーゲン2〜3%", "page": "p.80"}, {"ok": true, "basis": "γ-グロブリンは免疫グロブリンであり、リンパ球（B細胞）で合成される", "page": "p.80"}, {"ok": false, "basis": "リン酸緩衝系はHPO₄²⁻とH₂PO₄⁻のバランスにより腎臓で調節が行われる", "page": "p.81"}, {"ok": true, "basis": "トロンビンがフィブリノーゲンをフィブリンモノマーに変化させ、カルシウムイオン存在下でフィブリン線維に変化して凝固する", "page": "p.81"}, {"ok": true, "basis": "正常な動脈血のpHは7.4", "page": "p.81"}], "status": "確認済み"}, {"id": "3-13", "section": "6 免疫 ❷抗体／❸補体／❹リンパ球", "type": "correct", "stem": "抗体、補体およびリンパ球に関する記述である。正しいのはどれか。", "passage": "", "choices": ["免疫グロブリンは、分子量約5万のL鎖と分子量約2万3,000のH鎖がそれぞれ2本ずつ結合している。", "補体は、血清中に存在する9つの補体たんぱく質（C1〜C9）の複合体である。", "免疫グロブリンの可変領域は、C末端側のFc部分にある。", "IgMは、免疫グロブリン中で最も多く、血清中の全γ-グロブリンの75%を占める。", "1つの形質細胞は、複数の種類の抗体をつくる。"], "answer": 2, "explanations": [{"ok": false, "basis": "L鎖が分子量約2万3,000、H鎖が分子量約5万", "page": "p.82"}, {"ok": true, "basis": "補体は血清中に存在する9つの補体たんぱく質（C1〜C9）の複合体で、抗体の作用を助ける", "page": "p.82"}, {"ok": false, "basis": "可変領域はFab部分のN末端から10 choices": ["栄養素摂取に伴う身体内の状況は、3つの栄養状態に区分される。", "栄養素摂取の不足による欠乏症が進行すると、免疫・抵抗力が低下して感染症も重篤化する。", "栄養素摂取の過剰による肥満は、感染症の主要なリスク因子である。", "「半健康」や「半病気」といった境界の健康状態の概念は、特定健康診査・特定保健指導において「低リスク者」の階層化に利用されている。", "生活習慣病では、健康と疾病の状態を明確に区分することが容易である。"], "answer": 2, "explanations": [{"ok": false, "basis": "適正な栄養状態、バランスがくずれた状態、欠乏した状態、過剰の状態の4つに区分される", "page": "p.90"}, {"ok": true, "basis": "欠乏症（低栄養）が進行すると、免疫・抵抗力が低下して感染症も重篤化する", "page": "p.90"}, {"ok": false, "basis": "肥満は生活習慣病の主要なリスク因子であり、循環器疾患など死因の上位を占める疾患の基盤となっている", "page": "p.90"}, {"ok": false, "basis": "「ハイリスク者」の階層化のために利用されている", "page": "p.90"}, {"ok": false, "basis": "臨床症状が顕在化するまでに長い経過をとるため、健康と疾病の状態を明確に区分することは難しく、連続的なものと考えるほうが自然", "page": "p.90"}], "status": "確認済み"}, {"id": "4-02", "section": "1 栄養学概説 ❹国民健康・栄養調査", "type": "incorrect", "stem": "国民健康・栄養調査に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["以前は「国民栄養調査」と呼ばれ、1945（昭和20）年から開始された。", "2003（平成15）年以降は、健康増進法に基づいて実施されている。", "調査対象は、調査年の11月1日現在で満20歳以上の者である。", "調査は、身体状況調査、栄養摂取状況調査、生活習慣調査の3種類からなっている。", "「健康日本21」などの各種の政策作成の目標設定やその評価のために活用されている。"], "answer": 3, "explanations": [{"ok": true, "basis": "以前は「国民栄養調査」と呼ばれ、1945（昭和20）年から開始された", "page": "p.91"}, {"ok": true, "basis": "1952年以降は栄養改善法、2003年以降は健康増進法に基づいて実施", "page": "p.92"}, {"ok": false, "basis": "対象は世帯および世帯員（調査年の11月1日現在で満1歳以上の者）", "page": "p.92"}, {"ok": true, "basis": "身体状況調査、栄養摂取状況調査、生活習慣調査の3種類の調査からなる", "page": "p.92"}, {"ok": true, "basis": "「健康日本21」や健診・保健指導などの政策作成の目標設定や評価に活用されている", "page": "p.92"}], "status": "確認済み"}, {"id": "4-03", "section": "1 栄養学概説 ❹国民健康・栄養調査", "type": "correct", "stem": "国民健康・栄養調査からみた日本人の栄養状態と食品摂取量に関する記述である。正しいのはどれか。", "passage": "", "choices": ["成人女性の肥満者の割合は、どの年齢階層でも男性より多い。", "成人男性の肥満者の割合は、20〜30代で最も多い。", "20〜30代のやせの女性の割合は、約40%となっている。", "野菜類の1日当たりの摂取量は300g未満であり、あまり変化していない。", "食塩摂取量は、男女ともに徐々に増加している。"], "answer": 4, "explanations": [{"ok": false, "basis": "女性の肥満者の割合はどの年齢階層でも男性より少なく、むしろやせの者が多いことが問題", "page": "p.92"}, {"ok": false, "basis": "特に40〜60代の男性で肥満者の割合が最も多い", "page": "p.92"}, {"ok": false, "basis": "2 足の回避の代替指標は目安量、過剰摂取による健康障害の回避は耐容上限量。習慣的な摂取量とはおおむね1か月程度をみた場合に考えられる", "page": "p.108〜109"}, {"ok": false, "basis": "a は目安量、b は耐容上限量", "page": "p.108"}], "status": "確認済み"}, {"id": "4-12", "section": "3 日本人の食事摂取基準 2 総論 ❷指標", "type": "correct", "stem": "「日本人の食事摂取基準（2025年版）」の指標に関する記述である。正しいのはどれか。", "passage": "", "choices": ["推奨量は、集団ではほとんどの人（90〜95%）が充足している量である。", "推奨量は、推定平均必要量×（1＋3×変動係数）で算出される。", "推定平均必要量は、集団では50%の人が必要量を満たすと推定される摂取量である。", "目安量は、多くの場合、日本人の栄養素摂取量の平均値を用いている。", "習慣的な摂取量が目安量未満であれば、不足していると判断できる。"], "answer": 3, "explanations": [{"ok": false, "basis": "ほとんどの人（97〜98%）が充足している量", "page": "p.109"}, {"ok": false, "basis": "推奨量＝推定平均必要量×（1＋2×変動係数）", "page": "p.110"}, {"ok": true, "basis": "集団では50%の人が必要量を満たす（50%の人が満たさない）と推定される摂取量", "page": "p.109"}, {"ok": false, "basis": "多くの場合、日本人の栄養素摂取量の中央値を用いている", "page": "p.110"}, {"ok": false, "basis": "目安量未満であっても、不足しているかどうかはわからない", "page": "p.110"}], "status": "確認済み"}, {"id": "4-13", "section": "3 日本人の食事摂取基準 2 総論 ❷指標／4 各論", "type": "pair", "stem": "栄養素と、「日本人の食事摂取基準（2025年版）」で設定された指標（成人）の組合せである。正しいのはどれか。", "passage": "", "choices": ["食物繊維 ―― 目標量", "ビタミンK ―― 推奨量", "ビタミンD ―― 推定平均必要量", "n-3系脂肪酸 ―― 目標量", "コレステロール ―― 目標量"], "answer": 1, "explanations": [{"ok": true, "basis": "心筋梗塞の予防を目的として、成人における食物繊維の目標量が設定された", "page": "p.111, p.120"}, {"ok": false, "basis": "ビタミンKは目安量が算定された", "page": "p.111, p.122"}, {"ok": false, "basis": "根拠となる報告が乏しいため、ビタミンDは目安量（と耐容上限量）が設定された", "page": "p.111, p.121"}, {"ok": false, "basis": "n-3系脂肪酸は目安量として絶対量（g/日）で示された", "page": "p.111, p.120"}, {"ok": false, "basis": "十分な科学的根拠が得られなかったため、コレステロールの目標量は策定されなかった（表4-7でも指標はすべて「―」）。脂質異常症の重症化予防を目的とした量は飽和脂肪酸の表の脚注に記載されているが（表4-7※5）、これは目標量ではない", "page": "p.111, p.120"}], "status": "確認済み"}, {"id": "4-14", "section": "3 日本人の食事摂取基準 3 活用／4 各論 ❶エネルギー", "type": "correct", "stem": "エネルギーの食事摂取基準に関する記述である。正しいのはどれか。", "passage": "", "choices": ["目標とするBMIの範囲は、50〜64歳では21.5〜24.9kg/m²である。", "目標とするBMIの範囲は、18〜49歳では18.5〜24.9kg/m²である。", "目標とするBMIの範囲は、75歳以上では20.0〜24.9kg/m²である。", "エネルギー出納のバランスは、「エ タミン酸の摂取が望まれる。1,000μg/日は葉酸の耐容上限量（30〜64歳）", "page": "p.123"}, {"ok": false, "basis": "妊娠期はカルシウムの吸収率が著しく増加し、余剰分は尿中へ排泄されるため、付加量は必要なしとしている", "page": "p.125"}, {"ok": false, "basis": "妊娠初期・妊娠中期・妊娠後期の3区分として策定された", "page": "p.127"}, {"ok": true, "basis": "WHOのガイドライン（5g/日未満）と国民健康・栄養調査の摂取量の中央値との中間値をとり、成人男性7.5g/日未満、成人女性6.5g/日未満とした", "page": "p.124"}], "status": "確認済み"}]}, {"chapter": 5, "chapterTitle": "生活習慣病概論", "questions": [{"id": "5-01", "section": "1 生活習慣病とは／4 生活習慣病の概念と特定健康診査・特定保健指導", "type": "correct", "stem": "生活習慣病の概念と特定健康診査・特定保健指導に関する記述である。正しいのはどれか。", "passage": "", "choices": ["生活習慣病は、医学的な疾患単位の一つである。", "生活習慣病の概念は、1996年に公衆衛生審議会成人病難病対策部門からの答申により施策上に導入された。", "生活習慣病は、「加齢がその発症・進展に関与する疾患群」と定義されている。", "特定健康診査・特定保健指導は、2008年から20歳以上の医療保険被保険者・被扶養者を対象に開始された。", "保健指導を受けた対象者では、体重や腹囲は改善したが、血圧や血清脂質値の改善はみられていない。"], "answer": 2, "explanations": [{"ok": false, "basis": "生活習慣病は医学的な疾患単位ではないが、生活習慣の是正が発症予防や治療に有効な一群の疾患である", "page": "p.129"}, {"ok": true, "basis": "1996年に公衆衛生審議会成人病難病対策部門から厚生労働省への答申により、言葉と概念が施策上に導入された", "page": "p.132"}, {"ok": false, "basis": "「食習慣、運動習慣、休養、喫煙、飲酒などの生活習慣がその発症・進展に関与する疾患群」と定義された", "page": "p.132"}, {"ok": false, "basis": "対象は40歳以上75歳未満の医療保険被保険者・被扶養者", "page": "p.132"}, {"ok": false, "basis": "体重や腹囲、血圧、血清脂質値、耐糖能の改善の成果があがっている", "page": "p.132"}], "status": "確認済み"}, {"id": "5-02", "section": "2 日本人の疾病 ❶寿命と人口構成の変化／❸疾病構造の変化（罹病率・罹患率の変遷）", "type": "correct", "stem": "日本人の寿命・人口構成と疾病構造に関する記述である。正しいのはどれか。", "passage": "", "choices": ["2023（令和5）年の平均寿命は、男性81.09歳、女性87.14歳であった。", "合計特殊出生率は、2023（令和5）年に最低の1.26となった。", "高齢化率は、2023（令和5）年10月1日現在で33.3%である。", "1960年代の死因は、悪性新生物、脳血管疾患、心疾患の順であった。", "2020年の死因の第3位は肺炎である。"], "answer": 1, "explanations": [{"ok": true, "basis": "簡易生命表による2023年の平均寿命は男性81.09歳、女性87.14歳", "page": "p.129"}, {"ok": false, "basis": "2023年に最低の1.20となった", "page": "p.129"}, {"ok": false, "basis": "2023年10月1日現在の高齢化率は29.1%。33.3%は2036年の予想値", "page": "p.130"}, {"ok": false, "basis": "1960年代は脳血管疾患、悪性新生物、心疾患の順", "page": "p.130"}, {"ok": false, "basis": "2020年の第3位は老衰。第4位が脳血管疾患 "}, {"ok": false, "basis": "マジンドールはBMI 35以上の高度肥満において3カ月のみ認められている", "page": "p.135"}, {"ok": false, "basis": "セマグルチドは2023年より抗肥満薬として承認されている", "page": "p.135"}], "status": "確認済み"}, {"id": "5-06", "section": "5 生活習慣病—各論— ❷メタボリックシンドローム (2)診断基準", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "2005年に発表された日本のメタボリックシンドロームの診断基準では、内臓脂肪蓄積過剰を臍レベルでのCT像において脂肪面積（ a ）cm²以上とし、それに相当するウエスト周囲長（腹囲）は、男性は（ b ）cm以上、女性は（ c ）cm以上としている。内臓脂肪型肥満に加え、脂質代謝異常、高血圧、高血糖のうちの（ d ）項目以上が該当する場合、メタボリックシンドロームと診断される。", "choices": ["a 100　b 85　c 90　d 2", "a 100　b 90　c 85　d 2", "a 80　b 85　c 90　d 2", "a 100　b 85　c 90　d 3", "a 80　b 90　c 85　d 1"], "answer": 1, "explanations": [{"ok": true, "basis": "脂肪面積100cm²以上、ウエスト周囲長は男性85cm以上・女性90cm以上、3項目のうち2項目以上", "page": "p.136〜137"}, {"ok": false, "basis": "b は85（男性）、c は90（女性）", "page": "p.136〜137"}, {"ok": false, "basis": "a は100", "page": "p.136〜137"}, {"ok": false, "basis": "d は2", "page": "p.137"}, {"ok": false, "basis": "a は100、b は85、c は90、d は2", "page": "p.136〜137"}], "status": "確認済み"}, {"id": "5-07", "section": "5 生活習慣病—各論— ❷メタボリックシンドローム (3)治療", "type": "incorrect", "stem": "特定健康診査・特定保健指導に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["空腹時血糖の保健指導判定値は、100 mg/dLである。", "HbA1c（NGSP）の受診勧奨判定値は、6.5%である。", "HDLコレステロールの保健指導判定値は、39 mg/dLである。", "腹囲が基準以上で追加リスクが2つ以上該当する40〜64歳の者は、積極的支援の対象となる。", "高血圧等に対する服薬治療を受けている者も、特定保健指導の対象とする。"], "answer": 5, "explanations": [{"ok": true, "basis": "空腹時血糖の保健指導判定値は100 mg/dL（受診勧奨判定値は126 mg/dL）", "page": "p.137"}, {"ok": true, "basis": "HbA1cの受診勧奨判定値は6.5%（保健指導判定値は5.6%）", "page": "p.137"}, {"ok": true, "basis": "HDLコレステロールの保健指導判定値は39 mg/dL（受診勧奨判定値は34 mg/dL）", "page": "p.137"}, {"ok": true, "basis": "腹囲≧85cm（男性）・≧90cm（女性）で追加リスク2つ以上該当の40〜64歳は積極的支援", "page": "p.137"}, {"ok": false, "basis": "服薬治療中の者は医療機関で継続的な医学的管理の一環として指導が行われることが適当なため、特定保健指導の対象としない", "page": "p.137"}], "status": "確認済み"}, {"id": "5-08", "section": "5 生活習慣病—各論— ❸脂質異常症（高脂血症） (2)診断基準", "type": "incorrect", "stem": "「動脈硬化性疾患予防ガイドライン2022年版」の脂質異常症診断基準に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["LDLコレステロール140 mg/dL以上は、高LDLコレステロール血症である。", "LDLコレステロール120〜139 mg/dLは、境界域高LDLコレステロール血症である。", "HDLコレステロール40 mg/dL未満は、低HDLコレステロール血症である。", "随時採血でトリグリセライド150 mg/dL以上は、高トリグリセライド血症である。", "non-HDLコレステロール170 mg/dL以上は、高non-HDLコレステロール血症である。"], "answer": 4, "explanations": [{"ok": true, "basis": "LDL-C 140 mg/dL以上は高LDLコレステロール血症", "page": "p.139"}, {"ok": true, "basis": "LDL-C 120〜139 mg/dLは境界域高LDLコレステロール血症", "page": "p.139"}, {"ok": true, "basis": "HDL-C 40 mg/dL未満は低HDLコレステロール血症", "page": "p.139"}, {"ok": false, "basis": "随時採血では175 mg/dL以上。150 mg/dL以上は空腹時採血（10時間以上の絶食）の基準", "page": "p.139"}, {"ok": true, "basis": "non-HDL-C 170 mg/dL以上は高non-HDLコレステロール血症（150〜169 mg/dLは境界域）", "page": "p.139"}], "status": "確認済み"}, {"id": "5-09", "section": "5 生活習慣病—各論— ❸脂質異常症（高脂血症） (5)治療", "type": "pair", "stem": "脂質異常症治療薬の分類と主な一般名の組合せである。正しいのはどれか。", "passage": "", "choices": ["スタチン ―― エゼチミブ", "PCSK9阻害薬 ―― エボロクマブ", "陰イオン交換樹脂 ―― プロブコール", "フィブラート系薬 ―― ロスバスタチン", "選択的PPARαモジュレーター ―― イコサペント酸エチル"], "answer": 2, "explanations": [{"ok": false, "basis": "エゼチミブは小腸コレステロールトランスポーター阻害薬", "page": "p.141"}, {"ok": true, "basis": "PCSK9阻害薬の主な一般名はエボロクマブ、インクリシラン", "page": "p.141"}, {"ok": false, "basis": "陰イオン交換樹脂はコレスチミド、コレスチラミン。プロブコールは独立した分類", "page": "p.141"}, {"ok": false, "basis": "ロスバスタチンはスタチン。フィブラート系薬はベザフィブラート、フェノフィブラート、クロフィブラート", "page": "p.141"}, {"ok": false, "basis": "選択的PPARαモジュレーターはペマフィブラート。イコサペント酸エチルはn-3系多価不飽和脂肪酸", "page": "p.141"}], "status": "確認済み"}, {"id": "5-10", "section": "5 生活習慣病—各論— ❹高血圧症 (2)診断基準／(3)病態／(5)治療", "type": "correct", "stem": "「高血圧治療ガイドライン2019（JSH2019）」に基づく高血圧症に関する記述である。正しいのはどれか。", "passage": "", "choices": ["家庭血圧の高血圧基準値は、収縮期血圧140 mmHg以上、または拡張期血圧90 mmHg以上である。", "診察室血圧160-179/100-109 mmHgは、Ⅰ度高血圧に分類される。", "75歳未満の成人の降圧目標は、診察室血圧で130/80 mmHg未満である。", "二次性高血圧は、高血圧者の約半数を占める。", "高血圧治療においては、食塩を1日7.5g未満にするよう勧められている。"], "answer": 3, "explanations": [{"ok": false, "basis": "家庭血圧では収縮期血圧135 mmHg以上、または拡張期血圧85 mmHg以上", "page": "p.144"}, {"ok": false, "basis": "160-179/100-109 mmHgはⅡ度高血圧。Ⅰ度高血圧は140-159/90-99 mmHg", "page": "p.144"}, {"ok": true, "basis": "75歳未満の成人の降圧目標は診察室血圧<130/80 mmHg、家庭血圧<125/75 mmHg", "page": "p.145"}, {"ok": false, "basis": "二次性高血圧は高血圧者のうちの数%ほど。大部分は本態性高血圧", "page": "p.144"}, {"ok": false, "basis": "食塩を1日6g未満にするよう勧められている（JSH2019）", "page": "p.145"}], "status": "確認済み"}, {"id": "5-11", "section": "5 生活習慣病—各論— ❺糖尿病 (3)診断基準", "type": "incorrect", "stem": "糖尿病の診断基準に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["早朝空腹時血糖値126 mg/dL以上は、「糖尿病型」と判定する。", "75g OGTT 2時間値200 mg/dL以上は、「糖尿病型」と判定する。", "HbA1c 6.5%以上は、「糖尿病型」と判定する。", "HbA1cのみの反復検査で「糖尿病型」が確認できれば、「糖尿病」と診断してよい。", "早朝空腹時血糖値110 mg/dL未満、75g OGTT 2時間値140 mg/dL未満が確認できる場合、「正常型」と判定できる。"], "answer": 4, "explanations": [{"ok": true, "basis": "早朝空腹時血糖値≧126 mg/dLは糖尿病型", "page": "p.148"}, {"ok": true, "basis": "75g OGTT 2時間値≧200 mg/dLは糖尿病型", "page": "p.148"}, {"ok": true, "basis": "HbA1c≧6.5%は糖尿病型", "page": "p.148"}, {"ok": false, "basis": "HbA1cのみの反復検査による診断は不可。血糖値（①〜③）が別の日に再確認できれば糖尿病と診断してよい", "page": "p.148"}, {"ok": true, "basis": "早朝空腹時血糖値<110 mg/dL、75g OGTT 2時間値<140 mg/dLが確認できる場合は正常型", "page": "p.148"}], "status": "確認済み"}, {"id": "5-12", "section": "5 生活習慣病—各論— ❺糖尿病 (6)治療 ③薬物療法", "type": "pair", "stem": "2型糖尿病の血糖降下薬とその主な作用の組合せである。正しいのはどれか。", "passage": "", "choices": ["α-グルコシダーゼ阻害薬 ―― 肝臓での糖産生抑制", "SGLT2阻害薬 ―― 腎臓でのブドウ糖再吸収阻害による尿中ブドウ糖排泄促進", "チアゾリジン薬 ―― インスリン分泌の促進", "ビグアナイド薬 ―― 骨格筋・肝臓でのインスリン抵抗性改善", "DPP-4阻害薬 ―― GLP-1とGIPの分解促進"], "answer": 2, "explanations": [{"ok": false, "basis": "α-GIは腸管での炭水化物の吸収分解遅延による食後血糖上昇の抑制。肝臓での糖産生抑制はビグアナイド薬", "page": "p.152"}, {"ok": true, "basis": "SGLT2阻害薬は腎臓でのブドウ糖再吸収阻害による尿中ブドウ糖排泄促進", "page": "p.152"}, {"ok": false, "basis": "チアゾリジン薬は骨格筋・肝臓でのインスリン抵抗性改善", "page": "p.152"}, {"ok": false, "basis": "ビグアナイド薬は肝臓での糖産生抑制", "page": "p.152"}, {"ok": false, "basis": "DPP-4阻害薬はGLP-1とGIPの分解抑制による血糖依存性のインスリン分泌促進とグルカゴン分泌抑制", "page": "p.152"}], "status": "確認済み"}, {"id": "5-13", "section": "5 生活習慣病—各論— ❻高尿酸血症・痛風／❼脂肪肝", "type": "correct", "stem": "高尿酸血症・痛風と脂肪肝に関する記述である。正しいのはどれか。", "passage": "", "choices": ["血清尿酸値7.0 mg/dL以上を、高尿酸血症とする。", "高尿酸血症・痛風の治療目標は、血清尿酸値を7.0 mg/dL以下に維持することである。", "痛風発作は、主に手指の関節に好発する。", "脂肪肝は、組織学的には肝細胞の1/2以上に脂肪滴が認められる状態である。", "健診受診者では、女性の約30%が脂肪肝である。"], "answer": 1, "explanations": [{"ok": true, "basis": "血清尿酸値7.0 mg/dL以上が高尿酸血症", "page": "p.154"}, {"ok": false, "basis": "治療目標は血清尿酸値を6.0 mg/dL以下とし、このレベルで維持すること", "page": "p.155"}, {"ok": false, "basis": "痛風発作は足関節や第一中足趾関節などに好発する", "page": "p.154"}, {"ok": false, "basis": "組織学的には肝細胞の1/3以上に脂肪滴が認められる", "page": "p.155"}, {"ok": false, "basis": "健診受診者では男性の約30%、女性の約15%が脂肪肝", "page": "p.156"}], "status": "確認済み"}, {"id": "5-14", "section": "5 生活習慣病—各論— ❽骨粗鬆症 (2)病態／(3)診断基準／(5)治療", "type": "incorrect", "stem": "骨粗鬆症に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["DXA法で測定した骨密度が若年成人骨密度平均値（YAM）の70%未満を、骨粗鬆症と診断する。", "脆弱性骨折がある症例では、YAM 70〜79%の骨量減少レベルでも骨粗鬆症と診断する。", "閉経後のエストロゲン欠乏は、高代謝回転の骨粗鬆症を来す。", "骨粗鬆症の治療には、1日300〜400 mgのカルシウム摂取が勧められている。", "薬物療法では、骨吸収を強力に抑制するビスホスホネート製剤が第一選択薬として使用される。"], "answer": 4, "explanations": [{"ok": true, "basis": "YAMの70%未満を骨粗鬆症、80%以上を正常、その間を骨量減少とする", "page": "p.157"}, {"ok": true, "basis": "脆弱性骨折がある症例ではYAM 70〜79%でも骨粗鬆症と診断する", "page": "p.157"}, {"ok": true, "basis": "閉経後のエストロゲン欠乏は骨吸収を増大させ、高代謝回転の骨粗鬆症を来す", "page": "p.157"}, {"ok": false, "basis": "700〜800 mg/日以上のカルシウム摂取が勧められている", "page": "p.159"}, {"ok": true, "basis": "ビスホスホネート製剤が第一選択薬として使用される", "page": "p.159"}], "status": "確認済み"}, {"id": "5-15", "section": "5 生活習慣病—各論— ❾慢性閉塞性肺疾患（COPD）／❿慢性腎臓病（CKD）／⓫動脈硬化性疾患／⓬がん／⓭認知症", "type": "correct", "stem": "生活習慣病に関する記述である。正しいのはどれか。", "passage": "", "choices": ["COPDは、喫煙が主因となり、10年以上の喫煙歴を経て発症する。", "CKDは、腎疾患の存在を示す所見もしくはGFR 60 mL/分/1.73 m²未満の腎機能低下が、3カ月以上続く状態をいう。", "ラクナ梗塞は、直径30 mm以下の小梗塞である。", "日本におけるがんの約5%は、感染によると推計されている。", "認知症の基礎疾患として最も多いのは、血管性認知症である。"], "answer": 2, "explanations": [{"ok": false, "basis": "COPDは20年以上の喫煙歴を経て発症する", "page": "p.159"}, {"ok": true, "basis": "腎疾患の存在を示す所見もしくは腎機能低下（GFR 60 mL/分/1.73 m²未満）が3カ月以上続く状態をCKDという", "page": "p.160"}, {"ok": false, "basis": "ラクナ梗塞は直径15 mm以下の小梗塞", "page": "p.163"}, {"ok": false, "basis": "日本におけるがんの約20%は感染によると推計されている", "page": "p.164"}, {"ok": false, "basis": "血管性認知症は減少傾向で、最近はアルツハイマー型が最も多く60〜70%を占める", "page": "p.165"}], "status": "確認済み"}, {"id": "5-16", "section": "6 タバコとアルコール ❶タバコ／❷アルコール", "type": "incorrect", "stem": "タバコとアルコールに関する記述である。誤っているのはどれか。", "passage": "", "choices": ["タバコ煙には、約4,800種の化学物質が含まれている。", "タバコ煙のうち、主流煙よりも副流煙のほうが有害物質を高濃度に含む。", "禁煙補助剤のバレニクリンは、α4β2ニコチン性アセチルコリン受容体の選択的部分作動薬・遮断薬である。", "生活習慣病のリスクを高める量は、1日当たりの純アルコール摂取量が男性で40 g以上、女性で20 g以上である。", "脳出血やクモ膜下出血は、非飲酒者にくらべて適度の飲酒者のほうが少ない（Jカーブ現象）。"], "answer": 5, "explanations": [{"ok": true, "basis": "約4,800種の化学物質が含まれている", "page": "p.166"}, {"ok": true, "basis": "副流煙のほうが有害物質を高濃度に含む", "page": "p.166"}, {"ok": true, "basis": "バレニクリンはα4β2ニコチン性アセチルコリン受容体の選択的部分作動薬・遮断薬", "page": "p.167"}, {"ok": true, "basis": "男性40 g以上、女性20 g以上が生活習慣病のリスクを高める量", "page": "p.167"}, {"ok": false, "basis": "脳出血やクモ膜下出血は飲酒量とともに増加する。Jカーブ現象がみられるのは虚血性心疾患や脳梗塞、総死亡率", "page": "p.167"}], "status": "確認済み"}, {"id": "5-17", "section": "7 生活習慣と疾患 ❶睡眠と生活時間／❷ストレス／❸紫外線", "type": "correct", "stem": "生活習慣と疾患に関する記述である。正しいのはどれか。", "passage": "", "choices": ["概日リズムの中枢は、脳視床下部の松果体である。", "睡眠時無呼吸症候群（SAS）は、10秒以上の無呼吸が1晩（7時間）に30回以上出現する病態と定義される。", "睡眠時無呼吸症候群のほとんどは、中枢型である。", "2015年から、労働者が100人以上の事業所では毎年1回ストレスチェックテストの実施が義務付けられた。", "過剰に日光を避けると、皮膚でのビタミンAの活性化が低下する。"], "answer": 2, "explanations": [{"ok": false, "basis": "脳視床下部の視交叉上核が概日リズムの中枢", "page": "p.168"}, {"ok": true, "basis": "10秒以上の無呼吸が1晩（7時間）に30回以上出現する病態と定義される", "page": "p.168"}, {"ok": false, "basis": "中枢型はまれで、ほとんどは上気道の閉塞で起こる閉塞型", "page": "p.168"}, {"ok": false, "basis": "労働者が50人以上の事業所で義務付けられた", "page": "p.170"}, {"ok": false, "basis": "過剰に日光を避けると、皮膚でのビタミンDの活性化が低下してビタミンD不足が起こる", "page": "p.170"}], "status": "確認済み"}]}, {"chapter": 6, "chapterTitle": "臨床栄養と臨床検査", "questions": [{"id": "6-01", "section": "1 臨床栄養 ❶栄養アセスメントと栄養療法", "type": "correct", "stem": "栄養アセスメントと栄養素量の設定に関する記述である。正しいのはどれか。", "passage": "", "choices": ["主観的包括的栄養評価（SGA）は、身体計測値や血液生化学データなどを用いる評価である。", "小野寺の予後推定栄養指数（PNI）は、血清アルブミン値と末梢血中リンパ球数から算出される。", "二重エネルギーX線吸収法（DXA法）では、全身重量を骨塩量、脂肪量、水分量の3要素に分けて測定できる。", "代謝亢進やストレス・侵襲が大きい場合、必要エネルギーは簡易的に体重当たり25〜30kcalを掛け合わせて算出する。", "ストレスがない場合のたんぱく質投与量は、1.5〜2.0 g/kg/日とする。"], "answer": 2, "explanations": [{"ok": false, "basis": "SGAは簡便な質問で体重の変化、食事摂取状況の変化、消化器症状、ADLを評価する。身体計測値や血液生化学データによる評価は客観的栄養評価（ODA）", "page": "p.172"}, {"ok": true, "basis": "小野寺のPNI＝血清アルブミン値×10＋末梢血中リンパ球数×0.005", "page": "p.172"}, {"ok": false, "basis": "DXA法では骨塩量、脂肪量、そのほかの組織（骨格筋、内臓、皮膚や腱、血液など）の3要素に分ける", "page": "p.171"}, {"ok": false, "basis": "代謝亢進やストレス・侵襲が大きい場合は30〜40kcal。25〜30kcalは代謝亢進がなくストレスが軽度の場合", "page": "p.172〜173"}, {"ok": false, "basis": "ストレスがない場合は0.8〜1.0 g/kg/日とし、ストレスに応じて2.0 g/kg/日まで増量する", "page": "p.173"}], "status": "確認済み"}, {"id": "6-02", "section": "1 臨床栄養 ❶栄養アセスメントと栄養療法", "type": "incorrect", "stem": "栄養投与経路に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["経腸栄養を短期間（4週間以内）行う場合には、経鼻胃管を使用する。", "空腸瘻（PEJ）は、胃食道逆流や誤嚥を起こしにくい。", "成分栄養剤（ED）の窒素源（たんぱく質成分）は、アミノ酸である。", "長期的に高エネルギーを投与するためには、四肢の静脈を使用する末梢静脈栄養が行われる。", "低栄養が著しい場合に急激な栄養投与を行うと、低リン血症などを来すリフィーディング症候群を起こすことがある。"], "answer": 4, "explanations": [{"ok": true, "basis": "短期間（4週間以内）には経鼻胃管を使用し、長期間（4週間以上）必要な場合は消化管瘻を造設する", "page": "p.175"}, {"ok": true, "basis": "胃食道逆流や誤嚥を起こしにくい空腸瘻（PEJ）がつくられる", "page": "p.175"}, {"ok": true, "basis": "EDは炭水化物がデキストリン、窒素源がアミノ酸で、脂質は制限されている", "page": "p.175"}, {"ok": false, "basis": "末梢静脈栄養は短期間（約2週間）の投与。長期的に高エネルギーを投与するには中心静脈（内頸静脈や鎖骨下静脈など）から投与する中心静脈栄養（TPN）", "page": "p.175〜176"}, {"ok": true, "basis": "急激な栄養投与で低血糖、低リン血症、低カリウム血症などのリフィーディング症候群を来す", "page": "p.173〜174"}], "status": "確認済み"}, {"id": "6-03", "section": "1 臨床栄養 ❷ライフステージと栄養", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "妊娠糖尿病は、75gOGTTにおいて、空腹時血糖値≧（ a ）mg/dL、1時間値≧（ b ）mg/dL、2時間値≧（ c ）mg/dL の基準の1点以上を満たした場合に診断する。ただし、妊娠中の明らかな糖尿病および糖尿病合併妊娠は含めない。", "choices": ["a 92　b 180　c 153", "a 100　b 180　c 153", "a 92　b 200　c 153", "a 92　b 180　c 140", "a 110　b 200　c 140"], "answer": 1, "explanations": [{"ok": true, "basis": "表6-5：空腹時血糖値≧92mg/dL、1時間値≧180mg/dL、2時間値≧153mg/dLの1点以上で診断", "page": "p.178"}, {"ok": false, "basis": "a は92。100mg/dLは75gOGTTを実施する目安となる随時血糖値", "page": "p.178"}, {"ok": false, "basis": "b は180", "page": "p.178"}, {"ok": false, "basis": "c は153", "page": "p.178"}, {"ok": false, "basis": "a は92、b は180、c は153", "page": "p.178"}], "status": "確認済み"}, {"id": "6-04", "section": "1 臨床栄養 ❷ライフステージと栄養", "type": "incorrect", "stem": "ライフステージと栄養に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["新生児期とは、生後4週間までをいう。", "出生時体重が2,500g未満で生まれた児を、低出生体重児という。", "小児肥満症の診断基準の適用年齢は、6歳から18歳未満である。", "除脂肪組織は加齢とともに減少し、女性では閉経期以降に低下する。", "日本人に合ったサルコペニアの簡単基準案では、65歳以上で普通歩行速度1m/s未満、もしくは握力が男性30kg未満、女性20kg未満の者を脆弱高齢者とする。"], "answer": 5, "explanations": [{"ok": true, "basis": "新生児期（生後4週間まで）", "page": "p.176"}, {"ok": true, "basis": "出生時体重が2,500g未満で生まれた児を低出生体重児という（図6-3）", "page": "p.176"}, {"ok": true, "basis": "表6-4：適用年齢は6歳から18歳未満", "page": "p.177"}, {"ok": true, "basis": "除脂肪組織は加齢とともに減少し、男性では70歳以降に、女性は閉経期以降に低下する", "page": "p.179"}, {"ok": false, "basis": "図6-6：握力の基準は男性25kg未満、女性20kg未満", "page": "p.180"}], "status": "確認済み"}, {"id": "6-05", "section": "1 臨床栄養 ❸疾病予防と健康長寿", "type": "correct", "stem": "「日本人のためのがん予防法」（表6-6）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["飲酒する場合は、1日あたりアルコール量換算で約46g程度までとする。", "食塩は、1日あたり男性7.5g未満、女性6.5g未満を目標とする。", "野菜は、1日あたり250gを目標とする。", "中高年期女性のBMIは、21〜27の範囲とする。", "歩行または同等以上の強度（3メッツ以上）の身体活動を、1日30分以上行うことを目標とする。"], "answer": 2, "explanations": [{"ok": false, "basis": "飲む場合は1日あたりアルコール量換算で約23g程度まで（日本酒1合、ビール大瓶1本程度）", "page": "p.181"}, {"ok": true, "basis": "目標：食塩は1日あたり男性7.5g未満、女性6.5g未満", "page": "p.181"}, {"ok": false, "basis": "目標は1日あたり野菜350g", "page": "p.181"}, {"ok": false, "basis": "中高年期女性はBMI 21〜25。21〜27は中高年期男性", "page": "p.181"}, {"ok": false, "basis": "3メッツ以上の身体活動を1日60分以上。息がはずみ汗をかく程度の運動は週60分程度", "page": "p.181"}], "status": "確認済み"}, {"id": "6-06", "section": "1 臨床栄養 ❹病態栄養—各論— (1)肥満", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "日本肥満学会の肥満 炭水化物にくらべ呼吸商が小さく、高エネルギーでもあるためCOPD患者の栄養補給として優れている", "page": "p.189"}, {"ok": false, "basis": "脂肪含有量が0.6%と著しく低い成分栄養剤（ED）の有効性が確かめられている", "page": "p.190"}, {"ok": false, "basis": "鉄は酸化作用で炎症を強めるため、鉄制限食（6mg/日以下）とする", "page": "p.189"}, {"ok": false, "basis": "高アンモニア血症や肝性脳症などでは低たんぱく質食（0.5〜0.7 g/kg/日）に肝不全用経腸栄養剤を用いる", "page": "p.190"}], "status": "確認済み"}, {"id": "6-09", "section": "2 臨床検査", "type": "correct", "stem": "医療施設で用いられている検査項目（表6-15）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["腹囲が男性90cm、女性85cm以上は、メタボリックシンドロームの可能性がある。", "CT・MRI上で臍レベルの内臓脂肪が100cm²以上の場合は、メタボリックシンドロームの可能性がある。", "中性脂肪は、空腹時175mg/dL以上が脂質異常症である。", "HbA1cは、1〜2週間にわたる血糖コントロールの目安である。", "eGFRが90mL/分/1.73m²未満で持続する場合、慢性の腎臓病が疑われる。"], "answer": 2, "explanations": [{"ok": false, "basis": "腹囲は男性85cm、女性90cm以上", "page": "p.192"}, {"ok": true, "basis": "内臓脂肪：CT・MRI上で臍レベルで100cm²以上の場合はメタボリックシンドロームの可能性", "page": "p.192"}, {"ok": false, "basis": "空腹時150mg/dL、非空腹時175mg/dL以上が脂質異常症", "page": "p.193"}, {"ok": false, "basis": "HbA1cは1〜2カ月にわたる血糖コントロールの目安", "page": "p.193"}, {"ok": false, "basis": "60mL/分/1.73m²未満が持続する場合に慢性の腎臓病が疑われる", "page": "p.192"}], "status": "確認済み"}, {"id": "6-10", "section": "2 臨床検査", "type": "pair", "stem": "検査項目とその説明の組合せである。正しいのはどれか。", "passage": "", "choices": ["ALP ―― 低値は亜鉛不足も考えられる", "γ-GT ―― 低値はビタミンB群不足も考えられる", "アミラーゼ ―― 主に肝臓から分泌される消化酵素", "HA抗体 ―― B型肝炎ウイルスの抗体を調べる検査", "PSA ―― 乳がんで増加する"], "answer": 1, "explanations": [{"ok": true, "basis": "ALPは肝臓・胆道などの病態で高値を示すことがあり、低値は亜鉛不足も考えられる", "page": "p.193"}, {"ok": false, "basis": "低値でビタミンB群不足が考えられるのはALT、LDH。γ-GTは特にアルコールによる肝臓障害で高値", "page": "p.193"}, {"ok": false, "basis": "アミラーゼは主に膵臓や唾液腺から分泌される消化酵素", "page": "p.193"}, {"ok": false, "basis": "HA抗体はA型肝炎ウイルスの抗体を調べる検査", "page": "p.193"}, {"ok": false, "basis": "PSAは前立腺特異抗原で、前立腺がんや前立腺肥大で増加", "page": "p.194"}], "status": "確認済み"}]}, {"chapter": 7, "chapterTitle": "身体活動と栄養", "questions": [{"id": "7-01", "section": "1 身体活動に関するエッセンス ❸身体活動のエネルギー源と代謝", "type": "incorrect", "stem": "身体活動のエネルギー源と代謝に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["ATPの末端のリン酸が切り離されてADPとなるときに、7.3 kcal/molのエネルギーを放出する。", "安静時には、遊離脂肪酸（FFA）が主なエネルギー源となる。", "最大酸素摂取量の50%以下の強度では、脂質と炭水化物はそれぞれ50%の割合で利用される。", "運動強度が高く30〜40秒間の運動時には、クレアチンリン酸が主な供給源となる。", "脂質は、有酸素的代謝でのみエネルギーを供給する。"], "answer": 4, "explanations": [{"ok": true, "basis": "末端のリン酸が切り離されADPとなるときに7.3 kcal/molのエネルギーを放出する", "page": "p.196"}, {"ok": true, "basis": "安静時には遊離脂肪酸（FFA）が主なエネルギー源となる", "page": "p.196"}, {"ok": true, "basis": "最大酸素摂取量の50%以下の強度では、脂質と炭水化物はそれぞれ50%の割合で利用される", "page": "p.196"}, {"ok": false, "basis": "30〜40秒間の高強度運動時の供給源は骨格筋中のグリコーゲン。クレアチンリン酸は運動の初期（10〜15秒間）に機能する", "page": "p.196"}, {"ok": true, "basis": "炭水化物は無酸素的・有酸素的代謝の両方で供給可能だが、脂質は有酸素的代謝でのみエネルギーを供給する", "page": "p.196"}], "status": "確認済み"}, {"id": "7-02", "section": "1 身体活動に関するエッセンス ❺AMPKの作用", "type": "correct", "stem": "AMPK（AMP activated protein kinase）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["身体活動によりATPが減少してAMPが増加すると、AMPKは不活性化する。", "AMPKは、ビグアナイドやチアゾリジンによっても活性化する。", "AMPKは、GLUT4による骨格筋へのグルコース取り込みを抑制する。", "AMPKは、mTORを活性化する。", "mTORは、身体活動によって亢進するオートファジーを促進している。"], "answer": 2, "explanations": [{"ok": false, "basis": "ATPが減少しAMPが増加すると、AMPによってAMPKが活性化する", "page": "p.197"}, {"ok": true, "basis": "AMPKはビグアナイド、チアゾリジン（いずれも糖尿病治療薬）によっても活性化する", "page": "p.197"}, {"ok": false, "basis": "AMPKはGLUT4による骨格筋へのグルコース取り込みを促す", "page": "p.197"}, {"ok": false, "basis": "AMPKはmTORを抑制することで寿命にも関連している", "page": "p.197"}, {"ok": false, "basis": "mTORは身体活動によって亢進するオートファジーに対しても抑制している", "page": "p.197"}], "status": "確認済み"}, {"id": "7-03", "section": "1 身体活動に関するエッセンス ❻身体活動強度 ❽運動処方", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "エネルギー消費率は代謝率（MET）で示し、1 METは酸素摂取量（ a ）mL/分/kgに相当する。全身持久性運動の運動処方で最高心拍を用いる場合は、カルボーネンの式「目標心拍数＝（最高心拍数−（ b ））×k＋（ b ）」に基づいて行う。最高心拍数は「（ c ）−年齢」で求め、kは運動強度で通常は0.5〜0.7程度とする。", "choices": ["a 3.5　b 安静時心拍数　c 220", "a 5.0　b 安静時心拍数　c 220", "a 3.5　b 最低心拍数　c 220", "a 3.5　b 安静時心拍数　c 200", "a 5.0　b 最低心拍数　c 200"], "answer": 1, "explanations": [{"ok": true, "basis": "1 METは酸素摂取量3.5 mL/分/kgに相当。目標心拍数＝（最高心拍数−安静時心拍数）×k＋安静時心拍数、最高心拍数＝220−年齢", "page": "p.198〜199"}, {"ok": false, "basis": "a は3.5", "page": "p.198"}, {"ok": false, "basis": "b は安静時心拍数", "page": "p.199"}, {"ok": false, "basis": "c は220", "page": "p.199"}, {"ok": false, "basis": "a は3.5、b は安静時心拍数、c は220", "page": "p.198〜199"}], "status": "確認済み"}, {"id": "7-04", "section": "2 生活習慣病の予防と治療における運動療法 ❶身体活動と糖質代謝 ❷身体活動と脂質代謝 ❸身体活動と高血圧", "type": "correct", "stem": "身体活動と生活習慣病に関する記述である。正しいのはどれか。", "passage": "", "choices": ["身体活動によるGLUT4の形質膜への移動は、インスリンの場合と同じくAKT2によるAS160への影響が中心である。", "骨格筋細胞内脂肪（IMCL）は、異所性脂肪の一種とされる。", "身体活動を継続すると、骨格筋毛細血管壁のリポたんぱく質リパーゼ（LPL）の活性が低下する。", "身体活動だけでLDLコレステロール値の減少、HDLコレステロール値の増加を達成することは容易である。", "身体活動急性期の収縮期血圧の上昇は、有酸素運動時のほうがレジスタンス運動時よりも著しい。"], "answer": 2, "explanations": [{"ok": false, "basis": "身体活動ではCa²⁺、AMP、cAMPなどが関与しTBC1D1に働き掛ける。AKT2によるAS160への影響が中心となるのはインスリンの場合で、両者は異なる", "page": "p.201〜202"}, {"ok": true, "basis": "骨格筋細胞内脂肪（IMCL）は異所性脂肪の一種とされる", "page": "p.202"}, {"ok": false, "basis": "身体活動を継続すると骨格筋毛細血管壁のLPLの活性が高まり、遊離脂肪酸がエネルギー源として利用される", "page": "p.202"}, {"ok": false, "basis": "身体活動だけでLDL-C減少・HDL-C増加を達成することは容易ではなく、高容量＋高強度の運動を必要とする", "page": "p.202"}, {"ok": false, "basis": "急性期の収縮期血圧の上昇は、レジスタンス運動時のほうが有酸素運動時よりも著しい", "page": "p.202"}], "status": "確認済み"}, {"id": "7-05", "section": "2 生活習慣病の予防と治療における運動療法 ❹身体活動と肥満", "type": "incorrect", "stem": "身体活動と肥満に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["1日当たりの総エネルギー消費量（TEE）は、「基礎エネルギー消費量×活動係数×ストレス係数」として示される。", "有酸素運動のみを対象としたメタ解析では、6カ月プログラムの減量は−1.6 kgであり、減量効果を確実にするには食事療法との併用が求められる。", "irisinは、脂肪細胞のUCP1を増やして、エネルギーを消費しやすい褐色脂肪細胞様にする。", "irisinは、ヒトでは10週間程度の身体活動で基礎レベルの約10倍に上昇する。", "体重の5〜10%減少を達成するための包括的ライフスタイル介入では、体重減少のために有酸素運動（例：速歩）を週150分以上行うことが推奨されている。"], "answer": 4, "explanations": [{"ok": true, "basis": "TEEは「基礎エネルギー消費量×活動係数×ストレス係数」として示される", "page": "p.204"}, {"ok": true, "basis": "Thorogoodらのメタ解析で6カ月の減量は−1.6 kg。大きいとはいえず、食事療法との併用が求められる", "page": "p.204"}, {"ok": true, "basis": "irisinは脂肪細胞の性質を変換し、UCP1を増やしてエネルギーを消費しやすい褐色脂肪細胞様にする", "page": "p.204"}, {"ok": false, "basis": "ヒトでは10週間程度の身体活動で基礎レベルの2倍程度に上昇する", "page": "p.204"}, {"ok": true, "basis": "表7-8：体重減少の身体活動は有酸素運動（例：速歩）を週150分以上行う", "page": "p.204"}], "status": "確認済み"}, {"id": "7-06", "section": "2 生活習慣病の予防と治療における運動療法 ❺身体活動と尿酸値", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "尿酸に関しては、身体活動によって血中（ a ）濃度が増加する一方、尿酸クリアランスが低下する。さらにATP消費が過剰になると、2分子のADPからATPとAMPがつくられ、AMPから（ b ）を介して尿酸となるため、著しいレジスタンストレーニングは好ましくない。一方、最大心拍の（ c ）程度の身体活動であればAMP増加も伴わず、利尿作用による尿酸低下作用も期待できる。", "choices": ["a 乳酸　b キサンチン　c 30%", "a ピルビン酸　b キサンチン　c 30%", "a 乳酸　b クレアチニン　c 30%", "a 乳酸　b キサンチン　c 70%", "a ピルビン酸　b クレアチニン　c 70%"], "answer": 1, "explanations": [{"ok": true, "basis": "血中乳酸濃度が増加し尿酸クリアランスが低下。AMPからキサンチンを介して尿酸となる。最大心拍の30%程度ならAMP増加を伴わない", "page": "p.205"}, {"ok": false, "basis": "a は乳酸", "page": "p.205"}, {"ok": false, "basis": "b はキサンチン", "page": "p.205"}, {"ok": false, "basis": "c は30%", "page": "p.205"}, {"ok": false, "basis": "a は乳酸、b はキサンチン、c は30%", "page": "p.205"}], "status": "確認済み"}, {"id": "7-07", "section": "3 ライフステージと身体活動 ❶ロコモティブシンドローム", "type": "correct", "stem": "ロコモティブシンドロームとサルコペニアに関する記述である。正しいのはどれか。", "passage": "", "choices": ["加齢に伴う生理的な筋力・持久力の低下は、1年間で1〜2%とされる。", "日本整形外科学会は、ロコモティブシンドロームの発見に役立つ10のチェックを提案している。", "サルコペニアの有病率は、80歳以上では男性のほうが女性よりも高い。", "身体活動の低下（ベッド上安静）によるサルコペニアは、一次性サルコペニアに分類される。", "筋組織内に脂肪細胞が浸潤した状態を、カヘキシアと呼ぶ。"], "answer": 1, "explanations": [{"ok": true, "basis": "加齢に伴う生理的な筋力・持久力の低下は1年間で1〜2%とされる", "page": "p.208"}, {"ok": false, "basis": "日本整形外科学会が提案しているのは7つのチェック（ロコチェック）", "page": "p.208〜209"}, {"ok": false, "basis": "80歳以上では男性32%、女性48%で、女性のほうが高い", "page": "p.208"}, {"ok": false, "basis": "一次性は加齢に伴うもの。身体活動の低下（ベッド上安静）によるものは二次性に分けられる", "page": "p.208"}, {"ok": false, "basis": "筋組織内に脂肪細胞が浸潤した状態はsarcopenic obesity。カヘキシアは慢性疾患により骨格筋を含む体重の減少を特徴とする代謝性症候群", "page": "p.208"}], "status": "確認済み"}, {"id": "7-08", "section": "3 ライフステージと身体活動 ❷認知症", "type": "incorrect", "stem": "認知症と身体活動に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["65歳以上の高齢者が全人口に占める割合が21%を超えると、超高齢社会とされる。", "認知症の半分〜2/3をアルツハイマー病が占める。", "身体活動のレベルを高めることで、認知症の約3%を予防できる可能性がある。", "有酸素運動は、脳由来神経栄養因子（BDNF）の増加とも関連している。", "介入研究では、DHA、EPA、ビタミンB、ビタミンEなどによる認知症発症の予防効果が明らかになっている。"], "answer": 5, "explanations": [{"ok": true, "basis": "高齢化率が7%を超えると高齢化社会、21%を超えると超高齢社会とされる", "page": "p.208"}, {"ok": true, "basis": "認知症の半分〜2/3をアルツハイマー病（AD）が占める", "page": "p.208"}, {"ok": true, "basis": "身体活動のレベルを高めることで認知症の約3%を予防できる可能性がある", "page": "p.210"}, {"ok": true, "basis": "有酸素運動は神経細胞の成長を刺激し、BDNFの増加とも関連している", "page": "p.210"}, {"ok": false, "basis": "介入研究でDHA、EPA、ビタミンB、ビタミンEなどが用いられているが、認知症発症の予防効果は明らかではない", "page": "p.210"}], "status": "確認済み"}, {"id": "7-09", "section": "4 スポーツ医学と栄養 ❷エルゴジェニックエイド", "type": "pair", "stem": "エルゴジェニックエイドとその摂取目安量・タイミングの組合せである。正しいのはどれか。", "passage": "", "choices": ["カフェイン ―――――――――― 運動の30〜90分前に3〜9 mg/kg", "クレアチン（維持期） ――――― 20〜28 g/日", "クレアチン（ローディング期） ―― 最大0.03 g/kg/日を4〜6日", "重炭酸ナトリウム ――――――― 運動の60〜90分前に3 g/kg", "HMB（βヒドロキシβメチルブチレート） ―― 15〜30 g/日"], "answer": 1, "explanations": [{"ok": true, "basis": "表7-12：カフェインは運動の30〜90分前に3〜9 mg/kg、または250 mg/日程度", "page": "p.212"}, {"ok": false, "basis": "表7-13：クレアチンの維持期は2〜5 g/日程度（10〜28 g/日はローディング期の量）", "page": "p.213"}, {"ok": false, "basis": "表7-13：ローディング期は最大0.3 g/kg/日もしくは10〜28 g/日（4回に分けて）を4〜6日", "page": "p.213"}, {"ok": false, "basis": "表7-14：重炭酸ナトリウムは運動の60〜90分前に0.3 g/kg、または5 g/回×2回/日を5日間", "page": "p.213"}, {"ok": false, "basis": "表7-15：HMBの摂取目安量は1.5〜3 g/日", "page": "p.213"}], "status": "確認済み"}, {"id": "7-10", "section": "4 スポーツ医学と栄養 ❶グリコーゲンローディング ❸ドーピング ❹運動による中枢性疲労", "type": "correct", "stem": "スポーツ医学と栄養に関する記述である。正しいのはどれか。", "passage": "", "choices": ["グリコーゲンローディングでは、レース当日前3日間は糖質の少ない食事にする。", "グリコーゲンは水分と結合した形で存在するため、激しい練習中には体重チェックがグリコーゲン減少の指標となる。", "筋グリコーゲンは約500 kcal程度貯蔵されている。", "運動によって分枝アミノ酸濃度が上昇すると、トリプトファンの脳内移行が増加し、疲労感を生じるとされる。", "WADAの禁止表国際基準で、S5の利尿薬は競技会（時）にのみ禁止される。"], "answer": 2, "explanations": [{"ok": false, "basis": "当日から1週間前〜4日前までは糖質の少ない食事で運動を行い、レース当日前3日間は糖質の多い食事にする", "page": "p.211"}, {"ok": true, "basis": "グリコーゲンは水分と結合した形で存在するため、激しい練習中には体重チェックがグリコーゲン減少の指標となる", "page": "p.211"}, {"ok": false, "basis": "筋グリコーゲンは1,500 kcal程度貯蔵されている", "page": "p.211"}, {"ok": false, "basis": "分枝アミノ酸濃度が低下すると、輸送体を共有するトリプトファンの脳内移行が増加し、セロトニン合成が高まり疲労感を生じる", "page": "p.214"}, {"ok": false, "basis": "表7-16：S5利尿薬および隠蔽薬は「常に禁止される物質と方法（競技会（時）および競技会外）」に含まれる", "page": "p.214"}], "status": "確認済み"}]}, {"chapter": 8, "chapterTitle": "食品安全衛生学", "questions": [{"id": "8-01", "section": "1 食品の安全とは", "type": "correct", "stem": "食品の安全や衛生に関する記述である。正しいのはどれか。", "passage": "", "choices": ["「安心」とは、客観的・科学的に判断されるものである。", "食品安全基本法と食品衛生法は、医薬品および医薬部外品を含むすべての飲食物を食品と定義している。", "パラケルススは、「毒でなくするものはただ量だけである」と述べた。", "フグ毒のテトロドトキシンは、可食部の筋肉には含まれない。", "食品衛生法は、食品の安全性確保に関する基本理念を定めている。"], "answer": 3, "explanations": [{"ok": false, "basis": "安心は心配・不安がなく心が安らぐことで、主観の問題である。客観的・科学的に判断するのは安全", "page": "p.217"}, {"ok": false, "basis": "両法とも、医薬品医療機器等法に規定する医薬品および医薬部外品を除くすべての飲食物を食品と定義している", "page": "p.218"}, {"ok": true, "basis": "16世紀のスイス人医師パラケルススは「すべてのものが毒となる。毒でなくするものはただ量だけである」と述べた", "page": "p.218"}, {"ok": false, "basis": "肝臓などに濃縮されているが、わずかであるが可食部の筋肉にも含まれる。摂取量が致死量を十分に下回るため有害作用を示さない", "page": "p.218"}, {"ok": false, "basis": "基本理念を定めているのは食品安全基本法。食品衛生法は安全性確保の実践についてより具体的に定めている", "page": "p.218"}], "status": "確認済み"}, {"id": "8-02", "section": "1 食品の安全とは", "type": "pair", "stem": "急性毒性（経口投与でのLD50）に基づく化学物質の毒性の強さの区分（GHS）と、該当する物質の組合せである。正しいのはどれか。", "passage": "", "choices": ["テトロドトキシン ―― 区分3", "カフェイン ―― 区分1", "食塩 ―― 区分2", "エフェドリン ―― 区分2", "ビタミンA ―― 区分1"], "answer": 4, "explanations": [{"ok": false, "basis": "テトロドトキシン（LD50 0.44 mg/kg）は区分1", "page": "p.219"}, {"ok": false, "basis": "カフェイン（LD50 140 mg/kg）は区分3", "page": "p.219"}, {"ok": false, "basis": "食塩（LD50 4,000 mg/kg）は区分5", "page": "p.219"}, {"ok": true, "basis": "エフェドリン（マオウの成分、LD50 8 mg/kg）は区分2", "page": "p.219"}, {"ok": false, "basis": "ビタミンA（LD50 2,600 mg/kg）は区分5", "page": "p.219"}], "status": "確認済み"}, {"id": "8-03", "section": "2 食品のリスク分析 ❶食品安全からみたハザードとリスク／❷食品の安全性確保とリスク分析", "type": "correct", "stem": "食品のハザードとリスクに関する記述である。正しいのはどれか。", "passage": "", "choices": ["ハザードとは、健康への有害影響が生じる確率とその重篤度から推計される度合いである。", "寄生虫は、化学的要因のハザードに分類される。", "食品安全基本法は、1993年に制定された。", "放射線は、物理的要因のハザードに分類される。", "コーデックス委員会は、WTOが設立した政府間組織である。"], "answer": 4, "explanations": [{"ok": false, "basis": "これはリスクの説明。ハザードは健康に有害な影響をもたらす原因となる可能性がある食品中の物質や食品が置かれた状態（危害要因）", "page": "p.221"}, {"ok": false, "basis": "寄生虫は細菌・真菌・ウイルスなどとともに生物学的要因", "page": "p.221"}, {"ok": false, "basis": "食品安全基本法は2003年に制定された", "page": "p.220"}, {"ok": true, "basis": "物理的要因には、異物、放射線、食品が置かれている環境の温度・湿度・光照射などがある", "page": "p.221"}, {"ok": false, "basis": "コーデックス委員会はFAO/WHOが1963年に設立した政府間組織", "page": "p.221"}], "status": "確認済み"}, {"id": "8-04", "section": "2 食品のリスク分析 ❸食品のリスク分析の要素 (1)リスク評価", "type": "incorrect", "stem": "リスク評価に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["リスク評価は、ハザード同定、ハザード特性づけ、曝露評価、リスク判定というステップを経る。", "急性毒性とは、単回または反復投与（2週間ほどまで）後、2週間ほどの間にみられる影響である。", "長期毒性は、ラット、マウスでは約1年半〜2年にわたり投与したときの影響である。", "ベンゾ[a]ピレンは、薬物代謝酵素によって代謝されて発がん性を示すようになる。", "日本では、添加物の曝露評価として、主に陰膳法が実施されている。"], "answer": 5, "explanations": [{"ok": true, "basis": "リスク評価はハザード同定、ハザード特性づけ、曝露評価、リスク判定のステップを経て、リスクを定性的・定量的に示す", "page": "p.222"}, {"ok": true, "basis": "急性毒性は単回または反復投与（2週間ほどまで）後、2週間ほどの間にみられる影響", "page": "p.224"}, {"ok": true, "basis": "長期毒性は試験動物のほぼ全生涯（ラット、マウスでは約1年半〜2年）にわたり投与したときの影響", "page": "p.224"}, {"ok": true, "basis": "タバコ煙などに含まれるベンゾ[a]ピレンは薬物代謝酵素で代謝されて発がん性を示す（代謝活性化）", "page": "p.224"}, {"ok": false, "basis": "日本では主にマーケットバスケット法が実施されている", "page": "p.225"}], "status": "確認済み"}, {"id": "8-05", "section": "2 食品のリスク分析 ❸食品のリスク分析の要素 (1)リスク評価", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "添加物や残留農薬の場合は、（ a ）を不確実係数（安全係数）で除して、1日摂取許容量（ADI）を算出する。添加物の場合、不確実係数として通常（ b ）が用いられる。一方、ダイオキシンなど本来食品に混入してはならない物質については、ADIの代わりに（ c ）という用語が用いられる。", "choices": ["a 無毒性量（NOAEL）　b 10　c 1日耐容摂取量（TDI）", "a 無毒性量（NOAEL）　b 100　c 1日耐容摂取量（TDI）", "a 50％致死量（LD50）　b 100　c 1日耐容摂取量（TDI）", "a 無毒性量（NOAEL）　b 100　c 最大耐容1日摂取量（MTDI）", "a 50％致死量（LD50）　b 10　c 最大耐容1日摂取量（MTDI）"], "answer": 2, "explanations": [{"ok": false, "basis": "b は100。種差（10倍）と個体差（10倍）を考慮する", "page": "p.226"}, {"ok": true, "basis": "NOAEL（またはNOEL）を不確実係数で除してADIを算出。添加物では通常100を用い、ダイオキシンなどにはTDIを用いる", "page": "p.226"}, {"ok": false, "basis": "a は無毒性量（NOAEL）またはNOEL", "page": "p.226"}, {"ok": false, "basis": "c は1日耐容摂取量（TDI）", "page": "p.226"}, {"ok": false, "basis": "a は無毒性量、b は100、c は1日耐容摂取量（TDI）", "page": "p.226"}], "status": "確認済み"}, {"id": "8-06", "section": "2 食品のリスク分析 ❸食品のリスク分析の要素 (2)リスク管理・(3)リスクコミュニケーション", "type": "correct", "stem": "リスク管理とリスクコミュニケーションに関する記述である。正しいのはどれか。", "passage": "", "choices": ["食品安全委員会は、厚生労働省に設置されている。", "わが国の食品安全行政では、リスク評価は農林水産省が行う。", "FAO/WHOが示すリスク管理の4つの過程からなるモデルは、一方向性の過程である。", "リスク管理では、リスクの科学的側面だけでなく、経済的、法律的、社会心理的要素なども考慮する。", "リスクコミュニケーションは、リスク管理者から消費者等への一方通行の情報伝達である。"], "answer": 4, "explanations": [{"ok": false, "basis": "食品安全委員会は内閣府に設置されている", "page": "p.222"}, {"ok": false, "basis": "リスク評価は食品安全委員会が行う。厚生労働省・農林水産省・消費者庁はリスク管理", "page": "p.223"}, {"ok": false, "basis": "①から始まり①へ戻る循環型で、各過程間は反復的であり、一方向性の過程ではない", "page": "p.228"}, {"ok": true, "basis": "リスク管理では科学的側面だけでなく、経済的、法律的、社会心理的あるいは政治的要素、国際動向なども考慮する必要がある", "page": "p.227"}, {"ok": false, "basis": "一方通行ではなく、各関係者が一定の役割・責任をもつ双方向のコミュニケーションでなくてはならない", "page": "p.228"}], "status": "確認済み"}, {"id": "8-07", "section": "3 衛生管理 ❶食品衛生法に基づく衛生管理", "type": "correct", "stem": "食品衛生法に基づく衛生管理に関する記述である。正しいのはどれか。", "passage": "", "choices": ["サウロパス・アンドロジナス（別名：アマメシバ）の粉末剤は、食経験があっても通常とは著しく異なる方法で摂取されるものとして販売禁止となった。", "コンフリーは、急性腎障害を引き起こす成分を含むため販売禁止となった。", "第8条に基づく指定成分等には、2020年6月現在、セイヨウオトギリソウが含まれる。", "食品衛生の分野では、食品の製造・加工・使用・保存等の方法について「規格」という用語が用いられる。", "営業許可が必要な政令で定める業種は、2022年6月現在、28業種である。"], "answer": 1, "explanations": [{"ok": true, "basis": "第7条の「食経験があっても通常とは著しく異なる方法で摂取されるもの」に該当するとして2003年に販売禁止となった", "page": "p.230"}, {"ok": false, "basis": "コンフリーは肝臓障害を引き起こす可能性のあるピロリジジンアルカロイド（echimidine）を含み、肝静脈閉塞性疾患などの被害例が報告された", "page": "p.230"}, {"ok": false, "basis": "指定成分はコレウス・フォルスコリー、ドオウレン、プエラリア・ミリフィカ、ブラックコホシュの4種", "page": "p.230"}, {"ok": false, "basis": "成分については「規格」、製造・加工・使用・保存等の方法については「基準」という用語が用いられる", "page": "p.231"}, {"ok": false, "basis": "政令で定める業種は飲食店営業、食品販売業、食品製造業、添加物製造業等の32業種", "page": "p.233"}], "status": "確認済み"}, {"id": "8-08", "section": "3 衛生管理 ❷HACCP（ハサップ）", "type": "correct", "stem": "HACCPに関する記述である。正しいのはどれか。", "passage": "", "choices": ["HACCPは、1970年代初期に米国の航空宇宙局と民間企業が、宇宙飛行士の安全な食料確保を目的として開発した。", "HACCPは、最終製品の抜き取り検査に重点を置く衛生管理手法である。", "HACCP適用のための12の手順のうち、手順1〜5がHACCPの7原則に当たる。", "日本では、2021年6月から、大規模事業者に限ってHACCPに沿った衛生管理の実施が求められている。", "改正食品衛生法上のHACCPに沿った衛生管理は、第三者機関による認証に基づくものである。"], "answer": 1, "explanations": [{"ok": true, "basis": "1970年代初期に米国の航空宇宙局と民間企業が宇宙飛行士のための安全な食料確保を目的に開発したのが始まり", "page": "p.233"}, {"ok": false, "basis": "抜き取り検査等による最終製品の検査に重点を置いたのはHACCP以前の衛生管理。HACCPは全工程の中で重要な工程を管理する", "page": "p.233"}, {"ok": false, "basis": "手順6〜12が7原則。手順1〜5は原則1の危害分析に必要な準備手順", "page": "p.234"}, {"ok": false, "basis": "2021年6月から、すべての食品等事業者に実施が求められている", "page": "p.233"}, {"ok": false, "basis": "認証や承認に基づくものではなく、保健所等が営業許可の更新時や立ち入り検査等の際に監視指導する", "page": "p.234"}], "status": "確認済み"}, {"id": "8-09", "section": "3 衛生管理 ❸品質マネジメント", "type": "incorrect", "stem": "品質マネジメントに関する記述である。誤っているのはどれか。", "passage": "", "choices": ["ISO（国際標準化機構）は、1947年に設立された非政府機関である。", "ISO9000シリーズは、品質マネジメントの国際規格である。", "ISO14000シリーズは、環境マネジメント規格である。", "ISO22000は、HACCPを核にISO9001の要素を加味した食品安全マネジメント規格である。", "異味・異臭がある製品であっても、人の健康を損なうおそれがなければ不適格商品ではない。"], "answer": 5, "explanations": [{"ok": true, "basis": "ISOは1947年に設立された非政府機関", "page": "p.235"}, {"ok": true, "basis": "ISOは1987年に品質マネジメントの国際規格ISO9000シリーズを制定した", "page": "p.235"}, {"ok": true, "basis": "ISO14000シリーズは、組織の活動による環境への負荷を低減するための環境マネジメント規格", "page": "p.235"}, {"ok": true, "basis": "ISO22000（2005年策定）は、HACCPを核にISO9001の要素を加味した食品安全マネジメント規格", "page": "p.235"}, {"ok": false, "basis": "異味・異臭や包装の不良等がある製品は、仮に人の健康を損なうおそれがなくても不適格商品である", "page": "p.234"}], "status": "確認済み"}, {"id": "8-10", "section": "4 食品の安全性確保 ❶適正製造規範（GMP）／❺(1)健康食品GMP", "type": "correct", "stem": "GMP（適正製造規範）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["GMPを初めて法制化したのは英国である。", "日本では、1974年に厚生省薬務局長通知により医薬品GMPが作成された。", "日本では、食品に関するGMPが法制度として定められている。", "健康食品GMPの認定は、厚生労働省が工場ごとに審査・査察を行っている。", "国内で健康食品GMPの審査を行っている第三者機関は、5つある。"], "answer": 2, "explanations": [{"ok": false, "basis": "GMPを初めて法制化したのは米国（1962年）", "page": "p.235"}, {"ok": true, "basis": "1974年に厚生省薬務局長通知「医薬品の製造および品質管理に関する基準」により医薬品GMPが作成された", "page": "p.235"}, {"ok": false, "basis": "食品に関するGMPは米国では1969年に制定されたが、日本では同様の法制度はない", "page": "p.235〜236"}, {"ok": false, "basis": "GMPの認定は、民間団体である第三者機関が工場ごとに審査・査察を行う", "page": "p.250"}, {"ok": false, "basis": "日本健康・栄養食品協会と日本健康食品規格協会の2つ", "page": "p.250"}], "status": "確認済み"}, {"id": "8-11", "section": "4 食品の安全性確保 ❷トレーサビリティ", "type": "correct", "stem": "食品のトレーサビリティに関する記述である。正しいのはどれか。", "passage": "", "choices": ["川下の事業者にとって、自分が扱ったものが「どこに行ったか」がわかることを追跡可能という。", "生産から小売までのように、複数の段階を通して食品の移動を把握できることを内部トレーサビリティという。", "日本では、事故米の不正転売事件を契機に、牛肉のトレーサビリティが法的に義務化された。", "牛トレーサビリティ制度では、国内で生まれたすべての牛と輸入牛に、10桁の個体識別番号が印字された耳標が装着される。", "米トレーサビリティ法の対象品目に、清酒は含まれない。"], "answer": 4, "explanations": [{"ok": false, "basis": "「どこに行ったか」がわかる（追跡可能）のは川上の事業者。川下の事業者は「どこから来たか」がわかる（遡及可能）", "page": "p.236"}, {"ok": false, "basis": "複数段階を通して把握できることはチェーントレーサビリティ。1つの段階内の把握が内部トレーサビリティ", "page": "p.236"}, {"ok": false, "basis": "牛肉はBSEの国内発生（2001年）が契機。事故米の不正転売事件（2008年）は米・米加工品の契機", "page": "p.236"}, {"ok": true, "basis": "国内で生まれたすべての牛と輸入牛に、10桁の個体識別番号が印字された耳標が装着される", "page": "p.238"}, {"ok": false, "basis": "対象品目には米穀、米粉、米飯類、もち・米菓・清酒などが含まれる", "page": "p.239"}], "status": "確認済み"}, {"id": "8-12", "section": "4 食品の安全性確保 ❷トレーサビリティ (3)牛海綿状脳症とトレーサビリティ", "type": "incorrect", "stem": "牛海綿状脳症（BSE）に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["日本で2005年に変異型CJD（vCJD）と確認された1名の患者は、国内で感染した可能性が高いと考えられている。", "プリオンは、通常の加熱調理などでは不活化されない。", "BSEは、1986年に英国で発見された。", "英国でのBSEの発生は、飼料として与えた汚染肉骨粉によると考えられている。", "BSEは、ヒトのクロイツフェルト・ヤコブ病などとともに、伝達性海綿状脳症（TSE）と呼ばれることもある。"], "answer": 1, "explanations": [{"ok": false, "basis": "英国滞在時に感染した可能性が高いと考えられている", "page": "p.238"}, {"ok": true, "basis": "細菌・ウイルス感染に有効な薬剤でもプリオンには無効で、通常の加熱調理などでは不活化されない", "page": "p.237"}, {"ok": true, "basis": "BSEは1986年の英国での発見以来、世界各地で報告されている", "page": "p.237"}, {"ok": true, "basis": "英国での発生は、飼料として与えた汚染肉骨粉によると考えられている", "page": "p.237"}, {"ok": true, "basis": "羊のスクレイピーやヒトのCJDなどとともに、伝達性海綿状脳症（TSE）と呼ばれることもある", "page": "p.237"}], "status": "確認済み"}, {"id": "8-13", "section": "4 食品の安全性確保 ❸遺伝子組換え食品", "type": "correct", "stem": "遺伝子組換え食品に関する記述である。正しいのはどれか。", "passage": "", "choices": ["日本国内では、食用の遺伝子組換え作物の商業栽培は行われていない。", "2019年の主要な遺伝子組換え栽培作物のうち、栽培面積の割合が最も大きいのはとうもろこしである。", "2019年の遺伝子組換え農作物の栽培面積は、国別ではブラジルが最も大きい。", "遺伝子組換え食品の食品健康影響評価は、厚生労働省が行う。", "日本のカルタヘナ法は、2000年に施行された。"], "answer": 1, "explanations": [{"ok": true, "basis": "日本国内では、食用の遺伝子組換え作物の商業栽培は行われていない", "page": "p.241"}, {"ok": false, "basis": "大豆（48%）が最も大きく、とうもろこし（32%）、わた、なたねと続く", "page": "p.241"}, {"ok": false, "basis": "国別では米国（38%）が最も大きく、ブラジル（28%）、アルゼンチン、カナダと続く", "page": "p.241"}, {"ok": false, "basis": "厚生労働省への申請に対し、内閣府の食品安全委員会が安全性を評価する（食品健康影響評価）", "page": "p.241"}, {"ok": false, "basis": "カルタヘナ法の施行は2004年。2000年はカルタヘナ議定書", "page": "p.241"}], "status": "確認済み"}, {"id": "8-14", "section": "4 食品の安全性確保 ❹添加物 (2)添加物の区分", "type": "correct", "stem": "添加物の区分とその経緯に関する記述である。正しいのはどれか。", "passage": "", "choices": ["1947年の食品衛生法制定の際、添加物のネガティブリスト方式が採用された。", "ヒ素ミルク事件の原因は、乳児用粉乳に添加されたpH調整剤に混入していたヒ素である。", "1995年の食品衛生法改正後も、指定制度の対象は化学的合成品に限られている。", "既存添加物とは、厚生労働大臣が安全性と有効性を確認して指定したものである。", "アカネ色素は、既存添加物として2020年7月現在も使用が認められている。"], "answer": 2, "explanations": [{"ok": false, "basis": "1947年にポジティブリスト方式が世界で初めて採用された", "page": "p.245"}, {"ok": true, "basis": "1955年のヒ素ミルク事件は、乳児用粉乳に添加されたpH調整剤（リン酸水素二ナトリウム）に混入したヒ素が原因", "page": "p.245"}, {"ok": false, "basis": "1995年の改正で化学的合成品と天然物を区別せず、いずれも指定制度の対象となった（その時点で使用されていた天然添加物は既存添加物として引き続き使用を認めた）", "page": "p.245"}, {"ok": false, "basis": "これは指定添加物。既存添加物は長年の使用実績があるものとして厚生労働大臣が認めた天然添加物", "page": "p.244〜245"}, {"ok": false, "basis": "アカネ色素（着色料）は発がん性が認められ、2004年に既存添加物名簿から削除された", "page": "p.246"}], "status": "確認済み"}, {"id": "8-15", "section": "4 食品の安全性確保 ❹添加物 (5)添加物の表示", "type": "incorrect", "stem": "添加物の表示に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["栄養強化の目的で使用されるビタミン類は、表示が免除されている。", "調製粉乳では、栄養強化の目的で使用した添加物であっても表示する必要がある。", "L-アスコルビン酸を酸化防止剤として使用する場合は、表示が免除される。", "保存料や甘味料として使用した場合は、用途名と物質名を併記する。", "香料など14種類の用途で使用する場合は、一括名で表示することが認められている。"], "answer": 3, "explanations": [{"ok": true, "basis": "栄養強化の目的で使用されるビタミン類、ミネラル類、アミノ酸類は表示が免除されている", "page": "p.249"}, {"ok": true, "basis": "調製粉乳では、栄養強化の目的で使用しても主要な混合物として表示する必要がある", "page": "p.249"}, {"ok": false, "basis": "栄養強化目的なら表示免除だが、酸化防止剤として使用する場合は「酸化防止剤（ビタミンC）」のように表示しなければならない", "page": "p.249"}, {"ok": true, "basis": "甘味料、保存料など8つの用途では「保存料（ソルビン酸K）」のように用途名と物質名を併記する", "page": "p.249"}, {"ok": true, "basis": "イーストフードや香料を含む14種類の用途で使用する場合は一括名での表示が認められている", "page": "p.249"}], "status": "確認済み"}, {"id": "8-16", "section": "4 食品の安全性確保 ❺いわゆる健康食品の安全性と食薬区分 (3)医薬品かどうかの判断基準", "type": "correct", "stem": "医薬品かどうかの判断基準（食薬区分）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["4つの観点のすべてで医薬品的と判断された場合に限り、医薬品に該当する。", "錠剤やカプセルの形状のものは、形状だけで直ちに医薬品と判断される。", "舌下錠は、医薬品的な形状と判断される。", "「食事の際に、1個から2個ずつ」という表現は、医薬品的な用法・用量と判断される。", "「健康維持」という表現は、それ自体が医薬品的な効能・効果に該当する。"], "answer": 3, "explanations": [{"ok": false, "basis": "4つの観点のうち1つでも医薬品的と判断されれば医薬品に該当する", "page": "p.251"}, {"ok": false, "basis": "以前は錠剤やカプセルは医薬品の形状とされたが、規制緩和により現在は形状からだけで直ちに医薬品とは判断しない", "page": "p.253"}, {"ok": true, "basis": "アンプルや舌下錠は医薬品的な形状と判断される", "page": "p.253"}, {"ok": false, "basis": "「食事の際に…」は必ずしも医薬品的とは判断されない。「食前、食後に1個から2個ずつ」は医薬品的と判断される", "page": "p.253"}, {"ok": false, "basis": "「健康維持」「美容」の表現自体は医薬品的な効能・効果に該当しない", "page": "p.252"}], "status": "確認済み"}, {"id": "8-17", "section": "5 健康食品のリスクコミュニケーション ❶健康食品のリスクコミュニケーションとNR・サプリメントアドバイザー／❷健康食品に関する情報提供：問題点と対応策", "type": "correct", "stem": "健康食品のリスクコミュニケーションに関する記述である。正しいのはどれか。", "passage": "", "choices": ["日本の行政では、リスク評価は厚生労働省と農林水産省が担当している。", "食品安全委員会は、日常の生活を通じた消費者からの意見などを収集する「食品安全モニター」を募集している。", "NR・サプリメントアドバイザーは、健康食品の販売促進員としての役割をもつ。", "健康食品の問題に深くかかわる2つの要因は、不確かな情報の氾濫と経済的損失である。", "問題となった製品の摘発・公表という措置により、健康食品の問題は根本的に解決できる。"], "answer": 2, "explanations": [{"ok": false, "basis": "リスク評価は食品安全委員会、リスク管理は厚生労働省と農林水産省が担当", "page": "p.254"}, {"ok": true, "basis": "食品安全委員会では「食品安全モニター」が募集され、「食の安全ダイヤル」も開設されている", "page": "p.254"}, {"ok": false, "basis": "決して健康食品の販売促進員ではなく、消費者のインフォームドチョイスの支援者である", "page": "p.255"}, {"ok": false, "basis": "2つの要因は「不確かな情報の氾濫」と「生活習慣の乱れ」", "page": "p.255"}, {"ok": false, "basis": "情報はやがて忘れ去られ類似製品が再登場するため、摘発・公表だけでは根本的な解決は困難", "page": "p.255"}], "status": "確認済み"}, {"id": "8-18", "section": "5 健康食品のリスクコミュニケーション ❹健康食品に関する情報源", "type": "pair", "stem": "健康食品に関する情報源とその説明の組合せである。正しいのはどれか。", "passage": "", "choices": ["PubMed ―― 米国食品医薬品局（FDA）が運営する文献データベース", "The Cochrane Library ―― 無料で利用できるシステマティックレビューのデータベース", "「健康食品」の安全性・有効性情報 ―― 内閣府食品安全委員会が運営するウェブサイト", "健康食品ナビ ―― 消費者庁のウェブサイト", "Natural Medicines Database（NMD） ―― 安全性を5段階にランクづけしている"], "answer": 5, "explanations": [{"ok": false, "basis": "PubMedは米国国立医学図書館の医学・生物学関連の文献データベース", "page": "p.258"}, {"ok": false, "basis": "コクラン・システマティックレビューのデータベースが収載されているが、有料である", "page": "p.259"}, {"ok": false, "basis": "国立研究開発法人 医薬基盤・健康・栄養研究所 国立健康・栄養研究所が運営している", "page": "p.256"}, {"ok": false, "basis": "「健康食品ナビ」は東京都福祉保健局のウェブサイト", "page": "p.258"}, {"ok": true, "basis": "NMDの安全性はlikely safe〜unsafeの5段階、有効性は6段階にランクづけされている", "page": "p.259"}], "status": "確認済み"}]}, {"chapter": 9, "chapterTitle": "健康食品", "questions": [{"id": "9-01", "section": "1 健康食品の全体像 ❶健康食品の歴史", "type": "correct", "stem": "健康食品にかかわる制度や出来事の歴史に関する記述である。正しいのはどれか。", "passage": "", "choices": ["マクガバンレポートは、1977年に米国上院に設置された栄養問題特別委員会がまとめたものである。", "米国のダイエタリーサプリメント健康教育法（DSHEA）は、1984年に成立した。", "日本の特定保健用食品制度は、2001年に創設された。", "2009年に消費者庁が創設され、特定保健用食品などの表示の業務が農林水産省から消費者庁に移管された。", "機能性表示食品制度は、2005年の保健機能食品制度の改正で創設された。"], "answer": 1, "explanations": [{"ok": true, "basis": "1977年に米国上院に設置された栄養問題特別委員会がまとめたのがマクガバンレポート（マクガバンは上院議員の名前）", "page": "p.262"}, {"ok": false, "basis": "DSHEAの成立は1994年", "page": "p.262"},
