{"ok": false, "basis": "特定保健用食品制度の創設は1991年。2001年は保健機能食品制度の創設", "page": "p.263"}, {"ok": false, "basis": "表示の業務は厚生労働省から消費者庁に移管された", "page": "p.263"}, {"ok": false, "basis": "機能性表示食品制度は2015年の食品表示法施行にあわせて創設。2005年は条件付き・規格基準型・疾病リスク低減表示の導入", "page": "p.263"}], "status": "確認済み"}, {"id": "9-02", "section": "1 健康食品の全体像 ❷多様な健康食品", "type": "incorrect", "stem": "医薬品と食品の分類、および「健康食品」に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["健康食品という名称が意味する製品には、明確な法令上の定義はない。", "栄養機能食品は、規格基準の自己認証型の食品に分類される。", "機能性表示食品は事業者責任の届出制の食品であり、許可マークはない。", "保健機能食品以外の食品であっても、栄養成分の機能の表示をすることはできる。", "違法に医薬品成分を添加した製品は、無承認無許可医薬品として摘発され、もはや食品のカテゴリーには入らない。"], "answer": 4, "explanations": [{"ok": true, "basis": "健康食品という名称が意味する製品には明確な法令上の定義はない", "page": "p.263"}, {"ok": true, "basis": "図9-1で栄養機能食品は「規格基準の自己認証型」", "page": "p.264"}, {"ok": true, "basis": "図9-1で機能性表示食品は「事業者責任の届出制」で、栄養機能食品とともに許可マークなし", "page": "p.264"}, {"ok": false, "basis": "保健機能食品以外の食品は、保健機能食品と紛らわしい名称、栄養成分の機能、特定の保健の目的が期待できる旨の表示をすることはできない", "page": "p.264"}, {"ok": true, "basis": "医薬品成分を添加した製品は医薬品医療機器等法違反として摘発され、食品のカテゴリーには入らない", "page": "p.265"}], "status": "確認済み"}, {"id": "9-03", "section": "1 健康食品の全体像 ❸健康食品の問題点", "type": "correct", "stem": "健康食品の利用に関連した被害に関する記述である。正しいのはどれか。", "passage": "", "choices": ["経済的被害は、利用者が健康食品に医薬品のような強い効果を期待し、安価な製品ほど望ましい効果が得られるとの思いで購入した状況で認められる。", "違法製品の利用が関係した健康被害は軽微なものにとどまり、死者が出たことはない。", "製品自体に問題がなくても、製品が医薬品と併用されることによる相互作用など、利用者の不適切な利用が原因で健康被害が起こることがある。", "2024年春に発覚した紅麹サプリメントによる健康被害では、製品はサプリメント形状の特定保健用食品であった。", "無承認無許可医薬品は、事業者からの自主的な申告によって判明した製品をさす。"], "answer": 3, "explanations": [{"ok": false, "basis": "高額な製品ほど望ましい効果が得られるとの思いで、高額な製品を購入した状況で認められる", "page": "p.265"}, {"ok": false, "basis": "違法製品の利用が関係した健康被害は重篤であり、ダイエット関連の食品では死者が出たこともある", "page": "p.265"}, {"ok": true, "basis": "健康被害のもう1つのパターンは、過剰摂取や医薬品との相互作用など、製品に問題がなくても不適切な利用が原因となる事例", "page": "p.266"}, {"ok": false, "basis": "製品はサプリメント形状の機能性表示食品であった", "page": "p.265"}, {"ok": false, "basis": "無承認無許可医薬品は、医薬品成分の含有や治療・治癒を謳った製品であることが行政の検査によって判明したもの（表9-2）", "page": "p.266"}], "status": "確認済み"}, {"id": "9-04", "section": "2 特定保健用食品 ❶特定保健用食品制度の概要", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "2005年2月、食品の機能について正確で十分な情報を国民に提供する観点から、保健機能食品制度が改正された。特定保健用食品については、①「（ a ）特定保健用食品」の制度の導入、②「（ b ）特定保健用食品」の創設、③「（ c ）表示」の容認という3つの表示と制度の拡充が行われた。", "choices": ["a 条件付き　b 個別評価型　c 疾病リスク低減", "a 条件付き　b 規格基準型　c 疾病リスク低減", "a 規格基準型　b 条件付き　c 疾病リスク低減", "a 条件付き　b 規格基準型　c 健康強調", "a 個別評価型　b 規格基準型　c 健康強調"], "answer": 2, "explanations": [{"ok": false, "basis": "b は規格基準型", "page": "p.268"}, {"ok": true, "basis": "2005年の改正で、条件付き特定保健用食品の導入、規格基準型特定保健用食品の創設、疾病リスク低減表示の容認が行われた", "page": "p.268"}, {"ok": false, "basis": "a は条件付き、b は規格基準型", "page": "p.268"}, {"ok": false, "basis": "c は疾病リスク低減", "page": "p.268"}, {"ok": false, "basis": "a は条件付き、c は疾病リスク低減", "page": "p.268"}], "status": "確認済み"}, {"id": "9-05", "section": "2 特定保健用食品 ❶特定保健用食品制度の概要", "type": "correct", "stem": "特定保健用食品の有効性・安全性の根拠となる試験に関する記述である。正しいのはどれか。", "passage": "", "choices": ["臨床試験の摂取期間は、一般的には4週間程度以上を設定する。", "臨床試験の被験者は、目的とする疾病の患者とする。", "無作為化比較試験で危険率10%以下の有意差が認められ、作用機序が明確な場合は、通常の特定保健用食品として扱われる。", "錠剤やカプセルなど一度に過剰量を摂取することが容易な食品の過剰摂取試験は、原則として一日摂取目安量の10倍量を1日に摂取する。", "過剰摂取試験は、原則として申請食品を用いて、一日摂取目安量の3倍量を1日に摂取する。"], "answer": 5, "explanations": [{"ok": false, "basis": "摂取期間は一般的には12週間程度以上。4週間以上は後観察期間", "page": "p.271"}, {"ok": false, "basis": "被験者は健常人から疾病の境界域の者に至るまでの範囲で、目的とする保健の用途の対象として適切な者", "page": "p.271"}, {"ok": false, "basis": "危険率10%以下の無作為化比較試験は、作用機序の明確・不明確にかかわらず条件付き特定保健用食品（表9-3）", "page": "p.268"}, {"ok": false, "basis": "錠剤、カプセルなどの場合は、原則として一日摂取目安量の5倍量を1日に摂取する", "page": "p.271"}, {"ok": true, "basis": "過剰摂取試験は原則として申請食品を用いて一日摂取目安量の3倍量を1日に摂取する", "page": "p.271"}], "status": "確認済み"}, {"id": "9-06", "section": "2 特定保健用食品 ❸特定保健用食品の申請と許可の概略", "type": "pair", "stem": "特定保健用食品の保健の用途の表示内容と代表的な関与成分の組合せである。正しいのはどれか。", "passage": "", "choices": ["お腹の調子を整える ―― ラクトトリペプチド", "血糖値関係 ―― キトサン", "血圧関係 ―― 杜仲葉配糖体（ゲニポシド酸）", "骨関係 ―― ヘム鉄", "歯、歯茎関係 ―― グロビン蛋白分解物"], "answer": 3, "explanations": [{"ok": false, "basis": "ラクトトリペプチドは血圧関係。お腹の調子はオリゴ糖、ビフィズス菌、乳酸菌、食物繊維など", "page": "p.276"}, {"ok": false, "basis": "キトサンはコレステロール関係。血糖値関係は難消化性デキストリン、小麦アルブミン、グァバ葉ポリフェノールなど", "page": "p.276"}, {"ok": true, "basis": "血圧関係の代表的な関与成分は、ラクトトリペプチド、サーデンペプチド、杜仲葉配糖体（ゲニポシド酸）、酢酸など", "page": "p.276"}, {"ok": false, "basis": "ヘム鉄はミネラルの吸収関係（貧血気味の人に適する）。骨関係は大豆イソフラボン、MBPなど", "page": "p.276"}, {"ok": false, "basis": "グロビン蛋白分解物は脂肪関係。歯、歯茎関係はパラチノース、マルチトース、エリスリトールなど", "page": "p.276"}], "status": "確認済み"}, {"id": "9-07", "section": "2 特定保健用食品 ❷特定保健用食品の表示内容と許可", "type": "incorrect", "stem": "特定保健用食品の表示と許可に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["許可証票は国内において製造・貯蔵された製品に、承認証票は国外で表示された製品につけられる。", "特定保健用食品としての審査等に関して、許可証票と承認証票に違いはない。", "一度許可されれば、失効や許可の取り消しがない限り、その表示は無期限に有効である。", "「老化防止に役立つ食品です」という表示は、保健の用途の表示として認められている。", "栄養成分量および熱量は、熱量、たんぱく質、脂質、炭水化物、食塩相当量および関与成分の順に記載する。"], "answer": 4, "explanations": [{"ok": true, "basis": "許可証票は国内で製造・貯蔵された製品、承認証票は国外で表示された製品につけられる", "page": "p.273"}, {"ok": true, "basis": "審査等に関して許可証票と承認証票に違いはない", "page": "p.273"}, {"ok": true, "basis": "失効や許可の取り消しがない限り表示は無期限に有効", "page": "p.273"}, {"ok": false, "basis": "「老化防止に役立つ食品です」は科学的根拠が不明確であり、認められない表示の例", "page": "p.273"}, {"ok": true, "basis": "表9-8：記載順は熱量、たんぱく質、脂質、炭水化物、食塩相当量および関与成分の順", "page": "p.273"}], "status": "確認済み"}, {"id": "9-08", "section": "2 特定保健用食品 ❹特定保健用食品の安全性等に関する情報収集および報告／❻特定保健用食品の再審査と取り消し", "type": "correct", "stem": "特定保健用食品の許可後の安全性確保に関する記述である。正しいのはどれか。", "passage": "", "choices": ["許可を受けた者は、食品の効果や安全性に関する新しい情報を入手してから60日以内に消費者庁長官に報告しなければならない。", "健康被害が発生し、その拡大の可能性があると判断された場合は、速やかに都道府県知事等に情報提供し、消費者庁長官にも報告する。", "報告の対象となる健康被害は、医師の診断の有無を問わず、消費者が申し出たものすべてである。", "2009年には、ジアシルグリセロールを含む食用油製品に、安全性が危惧されるダイオキシン類が高濃度に含まれていた事例があった。", "再審査に際して、内閣総理大臣は、食品安全委員会および国民生活センターの意見を聞くものとされている。"], "answer": 2, "explanations": [{"ok": false, "basis": "新しい情報を入手してから30日以内に報告しなければならない", "page": "p.276"}, {"ok": true, "basis": "健康被害が発生しその拡大の可能性があると判断された場合は、都道府県知事等に情報提供し、消費者庁長官にも報告する", "page": "p.277"}, {"ok": false, "basis": "健康被害は、医師の診断を受け、当該症状が当該食品に起因する（またはその疑いがある）と診断されたものに限られる", "page": "p.277"}, {"ok": false, "basis": "高濃度に含まれていたのはグリシドール脂肪酸エステル", "page": "p.278"}, {"ok": false, "basis": "意見を聞くのは食品安全委員会（安全性にかかわるものに限る）および消費者委員会", "page": "p.278"}], "status": "確認済み"}, {"id": "9-09", "section": "3 栄養機能食品 ❶栄養機能食品の概要", "type": "correct", "stem": "栄養機能食品制度の経緯に関する記述である。正しいのはどれか。", "passage": "", "choices": ["2001年の導入時に表示できた成分は、ビタミン12成分（ビタミンK以外）とミネラル2成分（鉄、カルシウム）であった。", "2004年に、亜鉛、銅、カリウムの3成分が追加された。", "2005年7月に、下限値が栄養素等表示基準値（NRV）の50%に見直された。", "2015年4月に、ビタミンD、カリウム、n-3系脂肪酸が表示対象成分として追加された。", "栄養機能食品には、特定保健用食品と同様に許可証票が表示される。"], "answer": 1, "explanations": [{"ok": true, "basis": "2001年の導入時はビタミン12成分（ビタミンK以外）とミネラル2成分（鉄、カルシウム）", "page": "p.280"}, {"ok": false, "basis": "2004年に追加されたのは亜鉛、銅、マグネシウム", "page": "p.280"}, {"ok": false, "basis": "下限値はNRVの30%に見直された（それまでは第六次改定所要量の1/3）", "page": "p.280"}, {"ok": false, "basis": "2015年4月に追加されたのはビタミンK、カリウム、n-3系脂肪酸（生鮮食品も対象となった）", "page": "p.280"}, {"ok": false, "basis": "栄養機能食品は自己認証による「規格基準型」で、許可証票は存在しない", "page": "p.279"}], "status": "確認済み"}, {"id": "9-10", "section": "3 栄養機能食品 ❷栄養機能食品の規格基準など", "type": "pair", "stem": "栄養機能食品の栄養成分と、許可されている栄養機能表示の組合せである。正しいのはどれか。", "passage": "", "choices": ["ビタミンB1 ―― たんぱく質からのエネルギーの産生と皮膚や粘膜の健康維持を助ける", "ビタミンD ―― 正常な血液凝固能を維持する", "葉酸 ―― 胎児の正常な発育に寄与する", "カリウム ―― 骨や歯の形成に必要", "鉄 ―― 味覚を正常に保つのに必要"], "answer": 3, "explanations": [{"ok": false, "basis": "ビタミンB1は炭水化物からのエネルギー産生と皮膚や粘膜の健康維持を助ける。たんぱく質からのエネルギー産生はビタミンB6", "page": "p.281"}, {"ok": false, "basis": "ビタミンDは腸管でのカルシウムの吸収を促進し、骨の形成を助ける。正常な血液凝固能の維持はビタミンK", "page": "p.281"}, {"ok": true, "basis": "葉酸は赤血球の形成を助け、胎児の正常な発育に寄与する栄養素", "page": "p.281"}, {"ok": false, "basis": "カリウムは正常な血圧を保つのに必要。骨や歯の形成はカルシウム", "page": "p.282"}, {"ok": false, "basis": "鉄は赤血球を作るのに必要。味覚を正常に保つのは亜鉛", "page": "p.282"}], "status": "確認済み"}, {"id": "9-11", "section": "3 栄養機能食品 ❸栄養機能食品の表示／❹栄養機能食品の利用上の留意点", "type": "incorrect", "stem": "栄養機能食品の表示と利用に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["4つ以上の栄養成分について機能の表示をする場合は、そのうち任意の3つを表示すれば足りると判断されている。", "「本品は、特定保健用食品と異なり、消費者庁長官による個別審査を受けたものではありません。」と表示しなければならない。", "葉酸については、栄養機能食品では天然型・合成型の区別はされていない。", "腎機能が低下している者には注意喚起表示をすれば、錠剤、カプセル等の食品でもカリウムの栄養機能表示ができる。", "亜鉛、銅およびマグネシウムについては、乳幼児・小児が栄養機能食品から摂取することを避けるよう注意喚起されている。"], "answer": 4, "explanations": [{"ok": true, "basis": "4つ以上の栄養成分について機能の表示をする場合、任意の3つを表示すれば足りる", "page": "p.284"}, {"ok": true, "basis": "消費者庁長官の個別審査を受けたものではない旨の表示が必要（表9-14）", "page": "p.284"}, {"ok": true, "basis": "特定保健用食品の疾病リスク低減表示では合成型だが、栄養機能食品では天然型・合成型の区別はない", "page": "p.284"}, {"ok": false, "basis": "腎機能低下者が利用した場合の心停止などのリスクから、錠剤、カプセル等の食品にカリウムの栄養機能表示はできない", "page": "p.285"}, {"ok": true, "basis": "亜鉛、銅、マグネシウムは乳幼児・小児が摂取を避けるよう注意喚起されている（通常の食生活で満たされるため）", "page": "p.285"}], "status": "確認済み"}, {"id": "9-12", "section": "4 機能性表示食品 ❷対象者と対象食品", "type": "correct", "stem": "機能性表示食品の対象者と対象成分に関する記述である。正しいのはどれか。", "passage": "", "choices": ["対象者は疾病に罹患していない者で、境界域までの者をいい、診断基準で軽症以上と判定される者は該当しない。", "対象食品は、サプリメント形状の加工食品とその他加工食品の2つに分けられ、生鮮食品は含まれない。", "EPAやDHAは、食事摂取基準に摂取基準が策定されているn-3系脂肪酸の構成成分であるため、機能性関与成分となり得ない。", "糖質のうち、ブドウ糖や果糖は機能性関与成分となり得る。", "生鮮食品の機能性表示では、1日当たりの摂取目安量は、機能性が報告されている機能性関与成分の量の少なくとも30%以上である必要がある。"], "answer": 1, "explanations": [{"ok": true, "basis": "対象者は境界域までの者をいい、診断基準で軽症以上と判定される者は該当しない", "page": "p.286"}, {"ok": false, "basis": "対象食品はサプリメント形状の加工食品、その他加工食品、生鮮食品の3つに分けられる", "page": "p.286"}, {"ok": false, "basis": "表9-15で、EPA、DHAはn-3系脂肪酸の対象成分となり得る構成成分の例とされている", "page": "p.287"}, {"ok": false, "basis": "主として栄養源とされるブドウ糖、果糖、ガラクトース、ショ糖、乳糖、麦芽糖、でんぷん等は除かれる", "page": "p.287"}, {"ok": false, "basis": "少なくとも50%以上である必要がある", "page": "p.287"}], "status": "確認済み"}, {"id": "9-13", "section": "4 機能性表示食品 ❸安全性と機能性の評価／❹機能性の表示範囲", "type": "correct", "stem": "機能性表示食品の安全性と機能性の評価に関する記述である。正しいのはどれか。", "passage": "", "choices": ["安全性は、食経験、既存情報の調査、安全性試験のすべてを実施して評価しなければならない。", "既存情報で安全性を評価する場合、サプリメント形状の加工食品では、摂取量の5倍量までにおける健康被害情報を確認する。", "機能性は、最終製品を用いた臨床試験によってのみ評価される。", "in vitro試験やin vivo試験で説明された根拠のみに基づいた機能性の表現も認められる。", "機能性が研究レビューにより示されている場合は、「〇〇の機能があります」のように表示することが基本である。"], "answer": 2, "explanations": [{"ok": false, "basis": "食経験、既存情報の調査、動物やヒトの安全性試験の実施のいずれかによって評価される", "page": "p.287"}, {"ok": true, "basis": "サプリメント形状の加工食品は摂取量の5倍量、その他加工食品および生鮮食品は3倍量までの健康被害情報を確認する", "page": "p.287"}, {"ok": false, "basis": "最終製品を用いた臨床試験、または最終製品もしくは機能性関与成分に関する研究レビューのいずれかで評価される", "page": "p.287"}, {"ok": false, "basis": "in vitro試験やin vivo試験で説明された根拠のみに基づいた表現は、認められない表現の例", "page": "p.289"}, {"ok": false, "basis": "研究レビューの場合は「〇〇の機能があると報告されています」。「〇〇の機能があります」は最終製品を用いた臨床試験の場合", "page": "p.289"}], "status": "確認済み"}, {"id": "9-14", "section": "4 機能性表示食品 ❹機能性の表示範囲／❺健康被害情報の収集体制，製品の届出，届出製品の検索", "type": "incorrect", "stem": "機能性表示食品の表示と健康被害情報の取り扱いに関する記述である。誤っているのはどれか。", "passage": "", "choices": ["「糖尿病の人に」「高血圧の人に」といった表現は認められない。", "「肉体改造」「増毛」「美白」といった表現は認められない。", "機能性および安全性について国による評価を受けたものではない旨は、義務表示事項である。", "健康被害情報の提供期限は、届出者等が健康被害を診断した医療機関名を知った日から30日以内である。", "届出者は、遵守状況等について自己点検と評価を行い、その結果を消費者庁長官に毎年1回届け出る。"], "answer": 4, "explanations": [{"ok": true, "basis": "疾病の治療効果または予防効果を暗示する表現の例として認められない", "page": "p.288"}, {"ok": true, "basis": "健康の維持および増進の範囲を超えた、意図的な健康の増強を標榜する表現の例として認められない", "page": "p.288〜289"}, {"ok": true, "basis": "表9-16の義務表示事項に含まれる", "page": "p.288"}, {"ok": false, "basis": "提供期限は、医療機関名を知った日を起算点として15日以内", "page": "p.289"}, {"ok": true, "basis": "自己点検と評価を行い、その結果を消費者庁長官に毎年1回届け出ることとなった", "page": "p.289"}], "status": "確認済み"}, {"id": "9-15", "section": "5 特別用途食品 ❶特別用途食品の概要", "type": "correct", "stem": "特別用途食品の制度とその変遷に関する記述である。正しいのはどれか。", "passage": "", "choices": ["特別用途表示をするには、健康増進法に基づく内閣総理大臣（権限は消費者庁長官に委任）の許可が必要である。", "1952年に制定された栄養改善法では、特定の栄養成分の補強を行う旨の「強化食品」として位置づけられた。", "2009年の改正で、低ナトリウム食品が病者用食品の許可基準型に追加された。", "とろみ調整用食品は、病者用食品の中に追加された。", "外国で特別用途表示をして輸入し販売する場合は、消費者庁長官への届出のみでよい。"], "answer": 1, "explanations": [{"ok": true, "basis": "健康増進法（第26条）に基づく内閣総理大臣（権限は消費者庁長官に委任）の許可が必要", "page": "p.291"}, {"ok": false, "basis": "栄養改善法では「特殊栄養食品」として位置づけられた", "page": "p.291"}, {"ok": false, "basis": "2009年の改正で低ナトリウム食品は栄養表示基準（現 食品表示基準）で対応することとなり、特別用途食品の対象外となった", "page": "p.291"}, {"ok": false, "basis": "2018年4月に、とろみ調整用食品はえん下困難者用食品の中に追加された", "page": "p.291"}, {"ok": false, "basis": "外国で特別用途表示をして輸入販売する場合は、内閣総理大臣（消費者庁長官）の承認を受ける", "page": "p.291"}], "status": "確認済み"}, {"id": "9-16", "section": "5 特別用途食品 ❷特別用途食品の基準と表示", "type": "correct", "stem": "許可基準型病者用食品の規格と表示に関する記述である。正しいのはどれか。", "passage": "", "choices": ["低たんぱく質食品のたんぱく質含量は、通常の同種の食品の含量の50%以下である。", "無乳糖食品は、乳糖不耐症またはフェニルケトン尿症に適する旨を表示する。", "経口補水液は、感染性胃腸炎による下痢・嘔吐の脱水状態に適する旨を表示する。", "腎臓病用組合せ食品の食塩相当量は、1食当たり6.0g未満である。", "総合栄養食品の熱量は、100mL当たり100kcal以上と定められている。"], "answer": 3, "explanations": [{"ok": false, "basis": "2009年の改正で「50%以下」から「30%以下」に低く設定された", "page": "p.294"}, {"ok": false, "basis": "無乳糖食品は乳糖不耐症またはガラクトース血症に適する旨", "page": "p.295"}, {"ok": true, "basis": "経口補水液の許容される特別用途表示の範囲は、感染性胃腸炎による下痢・嘔吐の脱水状態に適する旨", "page": "p.297"}, {"ok": false, "basis": "腎臓病用組合せ食品の食塩相当量は1食当たり2.0g未満", "page": "p.297"}, {"ok": false, "basis": "総合栄養食品の熱量（100mLまたは100g当たり）は「設定せず」", "page": "p.296"}], "status": "確認済み"}, {"id": "9-17", "section": "6 いわゆる「健康食品」 ❶いわゆる「健康食品」の種類", "type": "incorrect", "stem": "いわゆる「健康食品」に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["国は、いわゆる「健康食品」の中に保健機能食品も含めることに変更した。", "米国のダイエタリーサプリメントのように国外で健康表示が法的に認められた製品でも、日本で特別用途食品や保健機能食品に該当しなければ「その他のいわゆる『健康食品』」になる。", "「日本人の食事摂取基準（2025年版）」と健康増進法で規定されている微量ミネラル8種類には、ナトリウムが含まれる。", "β-カロテンは、抗酸化作用などの非ビタミンAとしての機能性に着目されていることがある。", "わが国の健康食品のGMP認証は、日本健康・栄養食品協会と日本健康食品規格協会（JIHFS）でそれぞれ実施されている。"], "answer": 3, "explanations": [{"ok": true, "basis": "国は「いわゆる『健康食品』」の中に保健機能食品も含めることに変更した", "page": "p.300〜301"}, {"ok": true, "basis": "国外で健康表示が法的に認められた製品でも、日本で該当しなければ法的定義のない「その他のいわゆる『健康食品』」になる", "page": "p.301"}, {"ok": false, "basis": "ナトリウムは多量ミネラル（5種類）。微量ミネラルは鉄、亜鉛、銅、マンガン、ヨウ素、セレン、クロム、モリブデン（表9-32）", "page": "p.301"}, {"ok": true, "basis": "β-カロテンなどのカロテノイド類は、抗酸化作用などの非ビタミンAとしての機能性に着目されていることがある", "page": "p.301"}, {"ok": true, "basis": "GMP認証は日本健康・栄養食品協会と日本健康食品規格協会（JIHFS）でそれぞれ実施されている", "page": "p.302"}], "status": "確認済み"}, {"id": "9-18", "section": "6 いわゆる「健康食品」 ❷サプリメント／❸諸外国の健康効果を標榜した製品と制度", "type": "correct", "stem": "海外のサプリメントの制度に関する記述である。正しいのはどれか。", "passage": "", "choices": ["米国のダイエタリーサプリメントの「dietary ingredient」とは、1994年10月15日以前に米国で販売された成分をいう。", "米国のダイエタリーサプリメントは、メーカーが販売するにあたりFDAの承認を必要とする。", "EUでは、2005年7月にフードサプリメントが位置づけられた。", "中国の「保健食品」の制度は、わが国の栄養機能食品と類似している。", "カナダとオーストラリアでは、サプリメントは食品として扱われており、製造にGMPは必須ではない。"], "answer": 1, "explanations": [{"ok": true, "basis": "含有成分は「dietary ingredient（1994年10月15日以前に米国で販売された成分）」と「new dietary ingredient（NDI）」に分けられる", "page": "p.302"}, {"ok": false, "basis": "メーカーは販売においてFDAの承認を必要としないが、製品が安全であることの責任をもつ", "page": "p.303"}, {"ok": false, "basis": "EUでフードサプリメントが位置づけられたのは2002年7月。2005年7月はコーデックス委員会のガイドライン", "page": "p.303"}, {"ok": false, "basis": "中国の「保健食品」は食品機能を科学的根拠に基づいて個別審査して許可するもので、わが国の特定保健用食品と類似", "page": "p.303"}, {"ok": false, "basis": "カナダとオーストラリアではサプリメントは医薬品として扱われており、製造にはGMPが必須", "page": "p.304"}], "status": "確認済み"}]}, {"chapter": 10, "chapterTitle": "臨床薬理学", "questions": [{"id": "10-01", "section": "1 医薬品とは ❷医薬品の条件", "type": "correct", "stem": "新薬の開発プロセスに関する記述である。正しいのはどれか。", "passage": "", "choices": ["第1相試験では、少数の患者で安全性の確認と治療に使われる用量を決定する。", "第2相試験では、多数の患者を対象に有効性と安全性を科学的に証明する。", "新薬は、独立行政法人 医薬品医療機器総合機構の審査を経て承認されれば、製造・販売が許可される。", "市販後調査（PMS）は、動物を対象とした非臨床試験の一つである。", "有効な治療法がない重篤な疾患が対象の医薬品を早期承認できる制度は、「先駆け審査指定制度」である。"], "answer": 3, "explanations": [{"ok": false, "basis": "第1相試験は健常人で安全性と薬物動態などを検討する。少数の患者で安全性確認と用量決定を行うのは第2相試験", "page": "p.307"}, {"ok": false, "basis": "多数の患者を対象に有効性と安全性を科学的に証明するのは第3相試験", "page": "p.307"}, {"ok": true, "basis": "製造・販売の許可申請をし、医薬品医療機器総合機構の審査を経て承認されれば製造・販売が許可される", "page": "p.307"}, {"ok": false, "basis": "市販後調査は、日常の診療で広く使用された時の有効性や安全性、副作用情報などを調査するもの", "page": "p.307"}, {"ok": false, "basis": "有効な治療法がない重篤な疾患が対象の医薬品を早期承認できるのは「条件付き早期承認制度」。先駆け審査指定制度は先駆的医薬品等を早期承認する制度", "page": "p.307"}], "status": "確認済み"}, {"id": "10-02", "section": "1 医薬品とは ❸医薬品の分類", "type": "pair", "stem": "OTC医薬品の分類と該当薬物例の組合せである。正しいのはどれか。", "passage": "", "choices": ["要指導医薬品 ―― ダイレクトOTC", "第1類医薬品 ―― 主な風邪薬", "第2類医薬品 ―― H2ブロッカー含有の胃腸薬", "第3類医薬品 ―― ミノキシジル等含有毛髪薬", "第1類医薬品 ―― ビタミン含有保健薬"], "answer": 1, "explanations": [{"ok": true, "basis": "要指導医薬品の該当薬物例はダイレクトOTC、スイッチ直後OTC、毒薬・劇薬含有薬品", "page": "p.309"}, {"ok": false, "basis": "主な風邪薬は第2類医薬品", "page": "p.309"}, {"ok": false, "basis": "H2ブロッカー含有の胃腸薬は第1類医薬品", "page": "p.309"}, {"ok": false, "basis": "ミノキシジル等含有毛髪薬は第1類医薬品", "page": "p.309"}, {"ok": false, "basis": "ビタミン含有保健薬は第3類医薬品", "page": "p.309"}], "status": "確認済み"}, {"id": "10-03", "section": "2 医薬品の作用と効力 ❷受容体と医薬品", "type": "pair", "stem": "受容体、医薬品例、受容体への影響の組合せである。正しいのはどれか。", "passage": "", "choices": ["アドレナリンα1 ―― ミドドリン ―― 遮断", "アドレナリンβ1 ―― メトプロロール ―― 遮断", "ヒスタミンH2 ―― クロルフェニラミン ―― 遮断", "ドパミンD2 ―― クロルプロマジン ―― 刺激", "アドレナリンβ2 ―― プロカテロール ―― 遮断"], "answer": 2, "explanations": [{"ok": false, "basis": "ミドドリンはα1受容体を刺激し、血管収縮作用により低血圧を改善する", "page": "p.312"}, {"ok": true, "basis": "メトプロロールはβ1受容体を遮断し、心機能抑制作用により頻脈性不整脈を改善する", "page": "p.312"}, {"ok": false, "basis": "クロルフェニラミンはヒスタミンH1受容体の遮断薬。H2受容体の遮断薬はシメチジン", "page": "p.312"}, {"ok": false, "basis": "クロルプロマジンはD2受容体を遮断し、統合失調症の症状を改善する", "page": "p.311〜312"}, {"ok": false, "basis": "プロカテロールはβ2受容体を刺激し、気管支平滑筋弛緩作用により喘息発作を改善する", "page": "p.312"}], "status": "確認済み"}, {"id": "10-04", "section": "2 医薬品の作用と効力 ❺医薬品の効力", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "動物実験で経口投与した場合のLD50が体重1kg当たり（ a ）mg以下の場合は毒薬、（ b ）mg以下の場合は劇薬とされている。また、最大有効量からさらに量を増やすと有害作用（中毒症状）が現れるが、その直前の用量を（ c ）という。", "choices": ["a 30　b 300　c 最大耐量", "a 300　b 30　c 最大耐量", "a 30　b 300　c 最小有効量", "a 50　b 500　c 最大耐量", "a 300　b 3000　c 最小有効量"], "answer": 1, "explanations": [{"ok": true, "basis": "LD50が体重1kg当たり30mg以下は毒薬、300mg以下は劇薬。最大有効量を超えて有害作用が現れる直前の用量は最大耐量（極量）", "page": "p.317"}, {"ok": false, "basis": "毒薬は30mg以下、劇薬は300mg以下", "page": "p.317"}, {"ok": false, "basis": "c は最大耐量。最小有効量は医薬品の作用が現れ始める量", "page": "p.316〜317"}, {"ok": false, "basis": "毒薬は30mg以下、劇薬は300mg以下", "page": "p.317"}, {"ok": false, "basis": "毒薬は30mg以下、劇薬は300mg以下。c は最大耐量", "page": "p.316〜317"}], "status": "確認済み"}, {"id": "10-05", "section": "2 医薬品の作用と効力 ❻医薬品の効力に影響する因子", "type": "correct", "stem": "医薬品の効力に影響する因子に関する記述である。正しいのはどれか。", "passage": "", "choices": ["高齢者では、腎排泄機能の低下により、医薬品の生物学的半減期が短縮する。", "高齢者では、血漿たんぱく質濃度の低下により、遊離型薬物量が減少する。", "高齢者では、インスリンや利尿薬のフロセミドに対する感受性が低下している。", "高齢者では、中枢神経抑制薬に対する感受性が低下する傾向がみられる。", "プラセボ効果は、頭痛や不眠などの神経が関連している症状では影響を受けにくい。"], "answer": 3, "explanations": [{"ok": false, "basis": "腎排泄機能の低下により医薬品の生物学的半減期は増加する", "page": "p.317"}, {"ok": false, "basis": "血漿たんぱく質濃度の低下により遊離型薬物量は増加し、薬効が予想より強くなる可能性がある", "page": "p.317"}, {"ok": true, "basis": "アドレナリンβ受容体に作用する医薬品やインスリン、フロセミドに対する感受性は低下しており、薬効が減弱する可能性がある", "page": "p.317"}, {"ok": false, "basis": "中枢神経抑制薬やワルファリンに対する感受性は強まる傾向がみられる", "page": "p.317"}, {"ok": false, "basis": "大脳皮質や神経が関連している症状（頭痛、不眠、各種の痛み、悪心など）の治療薬は、プラセボによる影響を受けやすい", "page": "p.317"}], "status": "確認済み"}, {"id": "10-06", "section": "3 医薬品の体内運命 ❷医薬品の吸収", "type": "pair", "stem": "医薬品の細胞膜輸送の形式とその駆動力の組合せである。正しいのはどれか。", "passage": "", "choices": ["単純拡散 ―― 電気化学勾配", "促進拡散 ―― 濃度勾配", "一次性能動輸送 ―― ATPなどの高エネルギーリン酸化合物の分解で生じるエネルギー", "二次性能動輸送 ―― 濃度勾配", "膜動輸送 ―― 電気化学勾配"], "answer": 3, "explanations": [{"ok": false, "basis": "単純拡散の駆動力は濃度勾配", "page": "p.320"}, {"ok": false, "basis": "促進拡散の駆動力は電気化学勾配", "page": "p.320"}, {"ok": true, "basis": "一次性能動輸送はATPなどの高エネルギーリン酸化合物が加水分解される際に生じるエネルギーを利用する", "page": "p.320"}, {"ok": false, "basis": "二次性能動輸送の駆動力は一次性能動輸送で生じたイオンの電気化学勾配", "page": "p.320"}, {"ok": false, "basis": "膜動輸送は細胞膜の形態変化による輸送", "page": "p.320"}], "status": "確認済み"}, {"id": "10-07", "section": "3 医薬品の体内運命 ❸医薬品の代謝〜❺医薬品の排泄", "type": "correct", "stem": "医薬品の体内動態に関する記述である。正しいのはどれか。", "passage": "", "choices": ["プロドラッグは、代謝を受けることで活性を失う医薬品である。", "CYP2C19の遺伝子変異の発現率は、日本人では白人にくらべて低い。", "初回通過効果とは、吸収された医薬品が最初に腎臓を通過することで量的に減少することである。", "アルブミンは主に塩基性の医薬品と結合し、α1-酸性糖たんぱく質は酸性の医薬品と結合する。", "胆汁中に排泄された医薬品が腸管から再び吸収されることを、腸肝循環という。"], "answer": 5, "explanations": [{"ok": false, "basis": "プロドラッグは代謝により薬理作用を有する化合物に変換され、薬効を示す", "page": "p.320"}, {"ok": false, "basis": "CYP2C19の遺伝子変異の発現率は白人の3%にくらべ、日本人では20%と著しく高い", "page": "p.321"}, {"ok": false, "basis": "初回通過効果は、吸収された医薬品が最初に肝臓を通過することで代謝を受け量的に減少すること", "page": "p.321〜322"}, {"ok": false, "basis": "アルブミンは酸性の医薬品と、α1-酸性糖たんぱく質は塩基性医薬品と結合する", "page": "p.322"}, {"ok": true, "basis": "胆汁として十二指腸へ排泄された医薬品が腸管から再び吸収される場合があり、これを腸肝循環という", "page": "p.322"}], "status": "確認済み"}, {"id": "10-08", "section": "4 医薬品の投与経路と剤形 ❶医薬品の投与経路・❷経口剤", "type": "incorrect", "stem": "医薬品の投与経路と剤形に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["経皮投与は、局所作用を目的としたものと、全身作用を目的としたものに大別される。", "腸溶錠は、酸性下の胃内では溶けず、十二指腸で溶解するようにコーティングされている。", "舌下錠は、有効成分を口腔粘膜から吸収させる。", "トローチは、有効成分を口腔内の患部に適用させる。", "舌下錠やトローチは、飲み込んで消化管から吸収させる。"], "answer": 5, "explanations": [{"ok": true, "basis": "経皮投与は局所作用を目的としたものと、全身作用を目的としたものに大別される", "page": "p.323"}, {"ok": true, "basis": "酸に弱い医薬品のために、酸性下の胃内では溶けず十二指腸で溶解するようにコーティングされた腸溶錠がある", "page": "p.323"}, {"ok": true, "basis": "舌下錠は口腔内で溶かし、有効成分を口腔粘膜から吸収させる", "page": "p.323"}, {"ok": true, "basis": "トローチは口腔内で溶かし、有効成分を口腔内の患部に適用させる", "page": "p.323"}, {"ok": false, "basis": "舌下錠やトローチなど口腔に適用する医薬品は飲み込んではいけない", "page": "p.323"}], "status": "確認済み"}, {"id": "10-09", "section": "5 医薬品の相互作用 ❷吸収過程における相互作用・❸代謝過程における相互作用", "type": "correct", "stem": "医薬品の相互作用に関する記述である。正しいのはどれか。", "passage": "", "choices": ["プロパンテリンを併用すると、アセトアミノフェンの吸収速度は促進される。", "テトラサイクリンと制酸剤を服用する場合は、2剤の服用時間を最低でも30分はあける必要がある。", "フェノバルビタールを併用すると、ワルファリンの代謝が促進され、ワルファリンの作用は減弱する。", "シメチジンを併用すると、肝臓の薬物代謝酵素が誘導され、ワルファリンの作用は減弱する。", "ジゴキシンとキニジンは、P糖たんぱく質を介して互いの作用を弱め合う。"], "answer": 3, "explanations": [{"ok": false, "basis": "プロパンテリンは消化管運動を抑制し胃内容物排出速度を低下させるので、アセトアミノフェンの吸収速度は遅延する", "page": "p.325"}, {"ok": false, "basis": "2剤の服用時間は最低でも2〜3時間はあける必要がある", "page": "p.326"}, {"ok": true, "basis": "フェノバルビタールは肝臓の薬物代謝酵素の働きを増大させ（酵素誘導）、ワルファリンの作用は減弱する", "page": "p.326〜327"}, {"ok": false, "basis": "シメチジンは薬物代謝酵素の活性を低下（阻害）させ、ワルファリンの作用は増強され出血傾向などが起こりやすくなる", "page": "p.327"}, {"ok": false, "basis": "双方の排泄を低下させて互いの作用を強め合い、ジゴキシンの副作用は増強する", "page": "p.326"}], "status": "確認済み"}, {"id": "10-10", "section": "5 医薬品の相互作用 ❹分布過程における相互作用・❻作用部位における相互作用", "type": "blank", "stem": "ワルファリンの相互作用に関する記述である。次の文の空欄に入る正しいものの組合せはどれか。", "passage": "ワルファリンは、血漿中で大部分が（ a ）と結合する性質がある。これに抗炎症薬の（ b ）が併用されると、遊離型のワルファリンが増加する。また、（ b ）は血小板に直接働きその凝集機能を低下させる。一方、ワルファリンは肝臓で（ c ）の産生を抑制するため、両者の併用は出血傾向が強く現れる危険性が増す。", "choices": ["a アルブミン　b アスピリン　c プロトロンビン", "a α1-酸性糖たんぱく質　b アスピリン　c プロトロンビン", "a アルブミン　b シメチジン　c プロトロンビン", "a アルブミン　b アスピリン　c フィブリノーゲン", "a α1-酸性糖たんぱく質　b シメチジン　c フィブリノーゲン"], "answer": 1, "explanations": [{"ok": true, "basis": "ワルファリンは血漿中で大部分がアルブミンと結合する。アスピリンの併用で遊離型が増え、またアスピリンは血小板の凝集機能を低下させる。ワルファリンは肝臓でプロトロンビンの産生を抑制する", "page": "p.328〜329"}, {"ok": false, "basis": "a はアルブミン", "page": "p.328"}, {"ok": false, "basis": "b はアスピリン", "page": "p.328"}, {"ok": false, "basis": "c はプロトロンビン。フィブリノーゲンはトロンビンによってフィブリンに変換される", "page": "p.329"}, {"ok": false, "basis": "a はアルブミン、b はアスピリン、c はプロトロンビン", "page": "p.328〜329"}], "status": "確認済み"}, {"id": "10-11", "section": "6 食品と医薬品の相互作用 ❶吸収過程における食品と医薬品の相互作用", "type": "pair", "stem": "吸収過程における食品・成分と、影響を受ける医薬品例の組合せである。正しいのはどれか。", "passage": "", "choices": ["タンニン（コーヒー、茶） ―― ハロペリドール", "オオバコ種子 ―― 陰イオン交換樹脂", "キトサン ―― 鉄製剤", "カモミール ―― 脂溶性薬物", "大豆たんぱく ―― ジギタリス"], "answer": 1, "explanations": [{"ok": true, "basis": "タンニン（コーヒー、茶）はハロペリドール（抗精神病薬）とキレートを形成し吸収を低下させる", "page": "p.330"}, {"ok": false, "basis": "オオバコ種子の影響を受けるのはジギタリス、リチウム（消化管吸収抑制）および鉄製剤", "page": "p.330"}, {"ok": false, "basis": "キトサンの影響を受けるのは脂溶性薬物（腸肝循環抑制による吸収低下）", "page": "p.330"}, {"ok": false, "basis": "カモミールの影響を受けるのは鉄製剤（キレート形成による吸収低下）", "page": "p.330"}, {"ok": false, "basis": "大豆たんぱくの影響を受けるのは陰イオン交換樹脂（吸着による吸収低下）", "page": "p.330"}], "status": "確認済み"}, {"id": "10-12", "section": "6 食品と医薬品の相互作用 ❷代謝過程〜❸作用部位における食品と医薬品の相互作用", "type": "incorrect", "stem": "食品・成分と医薬品の相互作用に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["グレープフルーツジュースは、薬物代謝酵素（CYP3A4）を阻害して、ニカルジピンの作用を増強するおそれがある。", "セイヨウオトギリソウ（セントジョーンズワート）は、薬物代謝酵素を誘導して、アミノフィリンの薬効を減弱させるおそれがある。", "ビタミンKを多く含む納豆を大量に食べると、ワルファリンの抗凝血作用が増強する。", "イソニアジドで治療中にチラミンを多く含む食品を食べると、急に血圧が上昇することがある。", "甘草のグリチルリチンは、アルドステロン様作用によりジゴキシンの副作用発現を促進させる可能性がある。"], "answer": 3, "explanations": [{"ok": true, "basis": "グレープフルーツジュースは薬物代謝酵素を阻害し、ニカルジピン（Ca2+拮抗薬）などの作用と副作用を増強するおそれがある", "page": "p.330〜331"}, {"ok": true, "basis": "セイヨウオトギリソウは薬物代謝酵素を誘導して血中濃度を低下させ、アミノフィリンなどの薬効を減弱させるおそれがある", "page": "p.330〜331"}, {"ok": false, "basis": "ビタミンKによってワルファリンの抗凝血作用は減弱する（プロトロンビン産生促進による拮抗）", "page": "p.331〜332"}, {"ok": true, "basis": "イソニアジドはチラミンを分解するモノアミン酸化酵素を阻害するため、交感神経が過剰に興奮して急に血圧が上昇することがある", "page": "p.330〜331"}, {"ok": true, "basis": "グリチルリチンにはアルドステロン様作用があり、ジゴキシンやループ系利尿薬の副作用発現を促進させる可能性がある", "page": "p.331"}], "status": "確認済み"}]}, {"chapter": 11, "chapterTitle": "食品機能の科学的根拠", "questions": [{"id": "11-01", "section": "1 動物試験，in vitro試験 ❶動物試験", "type": "pair", "stem": "動物を用いた安全性試験の名称とその内容の組合せである。正しいのはどれか。", "passage": "", "choices": ["急性毒性試験 ―― 動物に被験物を28日間または90日間反復投与して毒性の発現を調べる。", "慢性毒性試験 ―― 動物に被験物を1年以上投与して長期摂取による毒性の発現を調べる。", "変異原性試験 ―― 妊娠動物に被験物を投与して、仔動物に奇形が発生するかを調べる。", "繁殖毒性試験 ―― 被験物によるアレルギー発現の有無を調べる。", "依存性試験 ―― 動物や微生物を用いて遺伝毒性を調べる。"], "answer": 2, "explanations": [{"ok": false, "basis": "28日間または90日間の反復投与は亜急性毒性試験。急性毒性試験は大量に単回投与して毒性の発現を調べる", "page": "p.334"}, {"ok": true, "basis": "慢性毒性試験は被験物を1年以上投与して長期摂取による毒性の発現を調べる（表11-1）", "page": "p.334"}, {"ok": false, "basis": "妊娠動物に投与して仔動物の奇形を調べるのは催奇形性試験。変異原性試験は動物や微生物を用いて遺伝毒性を調べる", "page": "p.334"}, {"ok": false, "basis": "アレルギー発現の有無を調べるのは抗原性試験。繁殖毒性試験は二世代にわたり投与して生殖能力や仔動物の成長・発達への影響を調べる", "page": "p.334"}, {"ok": false, "basis": "遺伝毒性を調べるのは変異原性試験。依存性試験は被験物に対する精神的な依存性の有無を調べる", "page": "p.334"}], "status": "確認済み"}, {"id": "11-02", "section": "2 ヒトを対象とした試験 ❷介入研究", "type": "correct", "stem": "無作為化比較試験（RCT）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["クロスオーバー試験では、前後の試験を連続して行い、両試験の間に間隔を空けない。", "並行群間比較試験では、個人間と個人内の比較が可能となる。", "骨密度を指標とした場合は、6カ月以上の試験が必要となる。", "疾病の罹患率を評価する場合は、5年程度の試験で十分である。", "特定保健用食品の申請では、試験期間が1カ月程度の並行群間比較試験が実施されることが多い。"], "answer": 3, "explanations": [{"ok": false, "basis": "前後の試験の影響を除くため、両試験の間には一定の間隔を空ける必要がある", "page": "p.336"}, {"ok": false, "basis": "並行群間比較試験は個人間の比較。個人間と個人内の比較が可能なのはクロスオーバー試験", "page": "p.336"}, {"ok": true, "basis": "血圧や血糖値の評価は3カ月程度だが、骨密度を指標とした場合は6カ月以上の試験が必要", "page": "p.335〜336"}, {"ok": false, "basis": "疾病の罹患率を評価する場合は10年以上の試験が必要となる", "page": "p.336"}, {"ok": false, "basis": "特定保健用食品の申請では、試験期間は3カ月程度の並行群間比較試験が実施されることが多い", "page": "p.336"}], "status": "確認済み"}, {"id": "11-03", "section": "2 ヒトを対象とした試験 ❸観察研究", "type": "correct", "stem": "観察研究に関する記述である。正しいのはどれか。", "passage": "", "choices": ["横断研究では、疾病と要因の時間的な関係を評価することができる。", "症例対照研究は、過去にさかのぼって調査するため、思い出しバイアスの影響を受ける。", "前向きコホート研究で得られた結果は、ほかの研究にくらべて信頼性が低い。", "後ろ向きコホート研究では、個人の曝露量を常に正確に定量できる。", "観察研究は、倫理的に介入研究ができない場合には実施されない。"], "answer": 2, "explanations": [{"ok": false, "basis": "横断研究は疾病の有無と要因を同時に調査するため、両者の時間的な関係を評価することができない", "page": "p.336"}, {"ok": true, "basis": "症例対照研究は過去にさかのぼって調査するため、思い出しバイアスの影響を受ける", "page": "p.336"}, {"ok": false, "basis": "前向きコホート研究の結果はほかの研究にくらべて信頼性が高いが、長期間の追跡調査が必要で手間と費用がかかる", "page": "p.336"}, {"ok": false, "basis": "後ろ向きコホート研究では、個人の曝露量を正確に定量できないことがある", "page": "p.336"}, {"ok": false, "basis": "観察研究は、倫理的に介入研究ができない場合にも実施される（飽和脂肪酸と動脈硬化、妊婦と児の奇形発現率など）", "page": "p.337"}], "status": "確認済み"}, {"id": "11-04", "section": "3 機能性の科学的根拠 ❷コレステロールが高めの方に適する食品", "type": "incorrect", "stem": "「コレステロールが高めの方に適する食品」の関与成分とその作用機序に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["キトサンは、消化管においてコレステロールを吸着して排泄を促進する。", "低分子化アルギン酸ナトリウムは、消化管において胆汁酸の吸収を妨げる。", "ブロッコリー・キャベツ由来の天然アミノ酸は、コレステロールから胆汁酸への代謝を促進する。", "茶カテキンは、肝臓におけるコレステロールの合成を抑制する。", "これらの食品は、過剰摂取により脂溶性の栄養素の吸収を抑えることがある。"], "answer": 4, "explanations": [{"ok": true, "basis": "大豆たんぱく質、キトサンは消化管でコレステロールを吸着して排泄を促進したり、胆汁酸の排泄を促す", "page": "p.338"}, {"ok": true, "basis": "低分子化アルギン酸ナトリウムは消化管で胆汁酸の吸収を妨げ、血中コレステロールを低下させる", "page": "p.338〜339"}, {"ok": true, "basis": "ブロッコリー・キャベツ由来の天然アミノ酸はコレステロールから胆汁酸への代謝を促進する", "page": "p.339"}, {"ok": false, "basis": "茶カテキンは消化管で胆汁酸中のコレステロールと結合して吸収を抑える。肝臓での合成を抑制するのはセサミン・セサモリン", "page": "p.339"}, {"ok": true, "basis": "これらの食品は過剰摂取により脂溶性の栄養素の吸収を抑えることがあるので注意を要する", "page": "p.339"}], "status": "確認済み"}, {"id": "11-05", "section": "3 機能性の科学的根拠 ❸血圧が高めの方に適する食品", "type": "pair", "stem": "「血圧が高めの方に適する食品」の関与成分と作用機序の組合せである。正しいのはどれか。", "passage": "", "choices": ["杜仲葉配糖体 ―― 副交感神経を刺激して血管を拡張する。", "γ-アミノ酪酸 ―― 一酸化窒素（NO）を介した血管平滑筋弛緩により血圧を下げる。", "酢酸 ―― アンジオテンシン変換酵素（ACE）を阻害する。", "燕龍茶フラボノイド ―― ノルアドレナリンの分泌を抑制する。", "ペプチド類 ―― ブラジキニンの分解を促進する。"], "answer": 1, "explanations": [{"ok": true, "basis": "杜仲葉配糖体は副交感神経を刺激して血管を拡張することにより、血圧の上昇を抑制する", "page": "p.339"}, {"ok": false, "basis": "γ-アミノ酪酸は血管収縮作用伝達物質であるノルアドレナリンの分泌を抑制して血圧を下げる。NOを介するのは燕龍茶フラボノイドとクロロゲン酸類", "page": "p.339"}, {"ok": false, "basis": "酢酸は血管を拡張することにより血圧を下げる。ACE阻害の降圧薬と作用点が同じとされるのはペプチド類", "page": "p.339"}, {"ok": false, "basis": "燕龍茶フラボノイドはNOを介した血管平滑筋弛緩により血圧を下げる。ノルアドレナリンの分泌抑制はγ-アミノ酪酸", "page": "p.339"}, {"ok": false, "basis": "ペプチド類はアンジオテンシンⅡの阻害作用および血圧低下作用があるブラジキニンの分解を抑制する", "page": "p.339"}], "status": "確認済み"}, {"id": "11-06", "section": "3 機能性の科学的根拠 ❼血糖値が気になる方に適する食品", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "「血糖値が気になる方に適する食品」の関与成分のうち、グァバ葉ポリフェノールは（ a ）を阻害して糖の吸収を穏やかにする。L-アラビノースは、ショ糖の分解酵素である（ b ）を特異的に阻害することにより、小腸での糖の吸収を抑える。ネオコタラノールおよびサラシアエキス末は、（ c ）を阻害して糖の吸収を穏やかにする。", "choices": ["a α-アミラーゼ　b スクラーゼ　c α-グルコシダーゼ", "a α-グルコシダーゼ　b スクラーゼ　c α-アミラーゼ", "a α-アミラーゼ　b α-グルコシダーゼ　c スクラーゼ", "a 膵リパーゼ　b スクラーゼ　c α-グルコシダーゼ", "a α-アミラーゼ　b ラクターゼ　c α-グルコシダーゼ"], "answer": 1, "explanations": [{"ok": true, "basis": "グァバ葉ポリフェノールはα-アミラーゼ、L-アラビノースはスクラーゼ、ネオコタラノール・サラシアエキス末はα-グルコシダーゼを阻害する", "page": "p.341"}, {"ok": false, "basis": "a はα-アミラーゼ、c はα-グルコシダーゼ", "page": "p.341"}, {"ok": false, "basis": "b はスクラーゼ、c はα-グルコシダーゼ", "page": "p.341"}, {"ok": false, "basis": "a はα-アミラーゼ。膵リパーゼを阻害するのはグロビン蛋白分解物、ウーロン茶重合ポリフェノール（中性脂肪・体脂肪の項）", "page": "p.341"}, {"ok": false, "basis": "b はショ糖の分解酵素であるスクラーゼ", "page": "p.341"}], "status": "確認済み"}, {"id": "11-07", "section": "4 安全性の科学的根拠 ❷特定保健用食品の安全性評価の基本的な考え方", "type": "correct", "stem": "特定保健用食品の安全性評価に関する記述である。正しいのはどれか。", "passage": "", "choices": ["特定保健用食品の安全性評価は、消費者庁に設置された新開発食品専門調査会において行われる。", "通常の特定保健用食品の安全性評価にあたっては、患者、乳幼児、高齢者、妊婦などを含むすべてのヒトが摂食することを考慮することが重要である。", "同じ製品が食生活の一環として長期にわたって食されてきた実績があり、安全性上の問題がない場合でも、必ず安全性評価を要する。", "関与成分の許容量（値）が設定された場合でも、その許容範囲内の関与成分を含む特定保健用食品は、そのつど安全性の評価を要する。", "多くの場合、特定保健用食品が意図する摂取対象者は、健常者に限られる。"], "answer": 2, "explanations": [{"ok": false, "basis": "内閣府の食品安全委員会のもとに設置された新開発食品専門調査会で評価が行われる。消費者庁はリスク管理機関", "page": "p.342"}, {"ok": true, "basis": "食品は摂取対象者が制限されないため、患者、乳幼児、高齢者、妊婦などを含むすべてのヒトが摂食することを考慮して評価を行うことが重要", "page": "p.343"}, {"ok": false, "basis": "原料・製法などを変えず同じ製品が長期に食されてきた実績があり、安全性上の問題がない場合には、安全性評価を要しないと考えられる", "page": "p.343"}, {"ok": false, "basis": "許容量（値）が設定された場合、基本的にその許容範囲内の関与成分を含む特定保健用食品は、今後の安全性の評価を要しないものとなる", "page": "p.344"}, {"ok": false, "basis": "多くの場合、特定保健用食品が意図する摂取対象者は疾病予備群のヒトである", "page": "p.343"}], "status": "確認済み"}, {"id": "11-08", "section": "5 科学的根拠に基づく情報入手 ①〜⑦", "type": "pair", "stem": "健康食品の有効性・安全性に関する情報源と、その内容の組合せである。正しいのはどれか。", "passage": "", "choices": ["PubMed ―― 米国国立医学図書館が掲載する、医学と生物学に関連する論文のデータベース", "Natural Medicines Comprehensive Database（NMCD） ―― 東京都健康安全研究センターが管理する健康食品に関するウェブサイト", "The Cochrane Library ―― 「いわゆる健康食品」による健康被害事例などの情報", "健康食品ナビ ―― ハーブを中心に、RCTデータを収集し、系統的レビューならびにメタ分析による評価", "厚生労働省 ―― 特定保健用食品や特別用途食品の制度などの食品表示の情報"], "answer": 1, "explanations": [{"ok": true, "basis": "PubMedは米国国立医学図書館が掲載する医学と生物学に関連する論文のデータベースで、抄録が閲覧できる", "page": "p.346"}, {"ok": false, "basis": "東京都健康安全研究センターが管理するのは健康食品ナビ。NMCDはダイエタリーサプリメントなどの天然素材の有効性・安全性の根拠を有料で提供", "page": "p.346"}, {"ok": false, "basis": "健康被害事例などの情報を提供しているのは厚生労働省。The Cochrane Libraryは科学的根拠に基づく医療の情報を提供", "page": "p.345〜346"}, {"ok": false, "basis": "ハーブを中心にRCTデータを収集し系統的レビュー・メタ分析で評価しているのはThe Cochrane Library", "page": "p.346"}, {"ok": false, "basis": "特定保健用食品や特別用途食品の制度などの食品表示の情報を提供しているのは消費者庁", "page": "p.345"}], "status": "確認済み"}]}, {"chapter": 12, "chapterTitle": "行動科学とカウンセリング", "questions": [{"id": "12-01", "section": "1 行動科学と現代心理学 ❶行動科学としての現代心理学／❷行動科学の母体となった学習心理学", "type": "correct", "stem": "行動科学と現代心理学に関する記述である。正しいのはどれか。", "passage": "", "choices": ["1970年代に入ると自然科学と社会科学が協働して現実的な問題にアプローチする考え方が提唱され、行動科学が生まれた。", "行動科学的アプローチは、学際的アプローチと問題解決的アプローチという2つの特徴を有する。", "学習は、「経験の反復による行動の一時的な変容」と定義される。", "スキナーは、古典的条件づけ（レスポンデント条件づけ）の原理と法則を体系化した。", "現代心理学が対象とする行動には、意識や思考などの直接観察できないものは含まれない。"], "answer": 2, "explanations": [{"ok": false, "basis": "自然科学と社会科学が協働する考え方が提唱されたのは1950年代。この立場から行動科学が生まれた", "page": "p.347"}, {"ok": true, "basis": "行動科学的アプローチは学際的アプローチと問題解決的アプローチという2つの特徴を有する", "page": "p.348"}, {"ok": false, "basis": "学習は「経験の反復による行動の比較的永続的な変容」と定義される", "page": "p.348〜349"}, {"ok": false, "basis": "スキナーが体系化したのは道具的条件づけ（オペラント条件づけ）の原理と法則", "page": "p.349"}, {"ok": false, "basis": "意識・思考・感情など直接観察できないが客観的に測定可能なものも含まれる", "page": "p.347"}], "status": "確認済み"}, {"id": "12-02", "section": "2 行動科学と学習理論 ❷学習の基本的な成立過程", "type": "incorrect", "stem": "古典的条件づけと道具的条件づけに関する記述である。誤っているのはどれか。", "passage": "", "choices": ["古典的条件づけでは、CS（条件刺激）とUCS（無条件刺激）を対提示することが強化となる。", "道具的条件づけでは、CR（条件反応）の直後にUCSを随伴させることがCRを条件づける重要な手続きとなる。", "古典的条件づけでは、UCRとCRがほぼ同質である。", "道具的条件づけでは、感情や生理反応など、主に自律反応を条件づける。", "道具的条件づけは、生体の能動性が重要であるため、オペラント（能動的）条件づけと呼ばれる。"], "answer": 4, "explanations": [{"ok": true, "basis": "古典的条件づけの強化はCSとUCSの対提示", "page": "p.352"}, {"ok": true, "basis": "CRの直後にUCSを随伴させることがCRを条件づける重要な手続き", "page": "p.351"}, {"ok": true, "basis": "古典的条件づけではUCRとCRがほぼ同質。道具的条件づけでは全く異なる", "page": "p.352"}, {"ok": false, "basis": "道具的条件づけは筋肉運動など主に中枢の反応を条件づける。自律反応を条件づけるのは古典的条件づけ", "page": "p.352"}, {"ok": true, "basis": "生体の能動性が重要であるためオペラント（能動的）条件づけと呼ばれる", "page": "p.352"}], "status": "確認済み"}, {"id": "12-03", "section": "2 行動科学と学習理論 ❷学習の基本的な成立過程", "type": "pair", "stem": "オペラント条件づけのタイプと、対象の行動に対する強化因子の操作の組合せである。正しいのはどれか。", "passage": "", "choices": ["報酬訓練 ―― 負の強化因子を与える", "罰訓練 ―― 負の強化因子を与える", "省略訓練 ―― 負の強化因子を除去する", "逃避・回避訓練 ―― 正の強化因子を除去する", "罰訓練 ―― 正の強化因子を除去する"], "answer": 2, "explanations": [{"ok": false, "basis": "報酬訓練は正の強化因子を与え、対象の行動が増加する", "page": "p.353"}, {"ok": true, "basis": "罰訓練は負の強化因子を与え、対象の行動が減少する（例：いたずらをして叱られる）", "page": "p.353"}, {"ok": false, "basis": "省略訓練は正の強化因子を除去し、対象の行動が減少する", "page": "p.353"}, {"ok": false, "basis": "逃避・回避訓練は負の強化因子を除去し、対象の行動が増加する", "page": "p.353"}, {"ok": false, "basis": "正の強化因子を除去するのは省略訓練", "page": "p.353"}], "status": "確認済み"}, {"id": "12-04", "section": "2 行動科学と学習理論 ❷学習の基本的な成立過程", "type": "correct", "stem": "条件づけにおける強化と消去に関する記述である。正しいのはどれか。", "passage": "", "choices": ["一般に、習得過程が長いほど、消去抵抗は低くなる。", "50%の部分強化と連続強化を比較すると、習得過程では部分強化のほうが反応がやや小さいが、大きな差ではない。", "部分強化効果とは、毎回強化するほど、条件づけられた反応が消去しにくくなることをいう。", "定時隔強化の一般的な事例として、宝くじやギャンブルがあげられる。", "変率強化のスケジュールの特徴は、生体が行う仕事量が最低になることである。"], "answer": 2, "explanations": [{"ok": false, "basis": "一般に、習得過程が長いほど消去抵抗が高まる", "page": "p.354"}, {"ok": true, "basis": "習得過程では部分強化のほうがやや反応が小さいが大差はない。消去過程では部分強化のほうが消去抵抗がはるかに大きい", "page": "p.354"}, {"ok": false, "basis": "部分強化効果は、毎回強化を与えなくても条件づけられ、とびとびに強化したほうが消去しにくい現象", "page": "p.354"}, {"ok": false, "basis": "定時隔強化の事例は月給。宝くじやギャンブルは変率強化の事例", "page": "p.354"}, {"ok": false, "basis": "変率強化の特徴は極めて強固な行動が生じる（最も消去抵抗が高い）こと。仕事量が最低になるのは定時隔強化", "page": "p.354"}], "status": "確認済み"}, {"id": "12-05", "section": "2 行動科学と学習理論 ❸行動の変容を促進させる要因／❹行動変容を行う場合の個人差の影響", "type": "correct", "stem": "行動変容の動機づけと個人差に関する記述である。正しいのはどれか。", "passage": "", "choices": ["即時のフィードバックは、動機づけを高めるが、正反応の学習を促進する効果はない。", "要求水準が自分の能力以上に高い場合は、成功感が大きくなる。", "輪投げの実験では、高達成動機者は、成功の可能性が50%の難易度を最も選ぶ傾向を示した。", "低達成動機者は、要求水準の変動が小さい。", "親和動機は、達成動機と同じ傾向をもつ社会的動機である。"], "answer": 3, "explanations": [{"ok": false, "basis": "即時のフィードバックは動機づけを高めるだけでなく、正反応の学習を促進し誤反応を未然に防ぐ効果もある", "page": "p.355"}, {"ok": false, "basis": "要求水準が能力以上に高い場合は失敗感が大きくなる", "page": "p.356"}, {"ok": true, "basis": "高達成動機者は成功の可能性が50%の難易度を最も選ぶ傾向を示した（低達成動機者は0%か100%）", "page": "p.356"}, {"ok": false, "basis": "低達成動機者は要求水準の変動が大きい", "page": "p.357"}, {"ok": false, "basis": "親和動機は達成動機とは相反する傾向をもつ動機", "page": "p.357"}], "status": "確認済み"}, {"id": "12-06", "section": "2 行動科学と学習理論 ❺賞罰／❻言語的賞罰の組み合わせと正誤反応の関係", "type": "incorrect", "stem": "賞罰と行動変容に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["児童の加算作業の実験では、賞賛群は日を重ねるごとに成績が上昇を続けた。", "児童の加算作業の実験では、叱責群は3日目以降の成績が2日目を下回った。", "他者が賞賛されるのを観察すると、観察者にとっては「暗黙の負の強化」すなわち罰を受けたことと同じ効果がある。", "賞賛を観察する場合、それを観察する人が多いほど成績が悪くなる。", "正反応に言語的賞賛を、誤反応に言語的罰を与えたRW群は、ほかのいずれの群よりもよい成績を示した。"], "answer": 4, "explanations": [{"ok": true, "basis": "賞賛群は日を重ねるごとに成績が上昇を続けた", "page": "p.358"}, {"ok": true, "basis": "表12-4で叱責群は2日目に16.59と上がったのち、3日目以降は2日目を下回っている（本文では「2日目以降の成績が下がっている」）", "page": "p.358"}, {"ok": true, "basis": "他者が賞賛される（明白な正の強化）のを観察すると、観察者には暗黙の負の強化（罰）と同じ効果がある", "page": "p.359"}, {"ok": false, "basis": "賞賛を観察する場合、それを観察する人が少ないほど成績が悪くなる", "page": "p.359"}, {"ok": true, "basis": "RW群はほかのいずれの群よりもよい成績を示した", "page": "p.359"}], "status": "確認済み"}, {"id": "12-07", "section": "3 行動科学と行動療法および認知行動療法（導入）／❶行動療法", "type": "correct", "stem": "行動療法に関する記述である。正しいのはどれか。", "passage": "", "choices": ["行動療法は、作業療法や運動療法のように、行動したり運動したりすることで治す治療法である。", "系統的脱感作法では、不安の程度の系列リストを作成する際、症状の起こった場面を0、無症状の場面を100とする。", "系統的脱感作法では、系列リストの中で不安の低い場面から順にイメージする。", "オペラント条件づけ療法では、行動目標は初めから最終目標に設定する。", "バイオフィードバック法は、古典的条件づけの手法を生理学的な反応に応用したものである。"], "answer": 3, "explanations": [{"ok": false, "basis": "行動療法は誤って学習された癖や症状、行動をなくしたり変容したりする治療法であり、行動することで治す治療法ではない", "page": "p.359〜360"}, {"ok": false, "basis": "無症状の場面を0、症状の起こった場面を100とする", "page": "p.360"}, {"ok": true, "basis": "系列のリストの中で不安の低い場面から順にイメージする", "page": "p.360"}, {"ok": false, "basis": "行動目標は段階を経て徐々に最終目標へと設定していく（シェイピング法）", "page": "p.360"}, {"ok": false, "basis": "バイオフィードバック法は道具的条件づけの手法を生理学的な反応に応用したもの", "page": "p.361"}], "status": "確認済み"}, {"id": "12-08", "section": "3 行動科学と行動療法および認知行動療法 ❷認知行動療法", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "自律訓練法の練習の公式は、背景公式を含めて（ a ）段階からなっている。第1公式は「両腕両脚が重たい」（（ b ）練習）、第4公式は「とても楽に呼吸をしている」（呼吸調整訓練）、第5公式は「（ c ）のあたりが温かい」（腹部温感練習）である。", "choices": ["a 7　b 重感　c 胃", "a 6　b 重感　c 胃", "a 7　b 温感　c 胃", "a 7　b 重感　c 心臓", "a 6　b 温感　c 心臓"], "answer": 1, "explanations": [{"ok": true, "basis": "練習の公式は背景公式を含めて7段階。第1公式は重感練習、第5公式は「胃のあたりが温かい」", "page": "p.362〜363"}, {"ok": false, "basis": "a は7（背景公式を含めて7段階）", "page": "p.362"}, {"ok": false, "basis": "b は重感。温感練習は第2公式「両腕両脚が温かい」", "page": "p.362〜363"}, {"ok": false, "basis": "c は胃。心臓は第3公式（心臓調整訓練）", "page": "p.363"}, {"ok": false, "basis": "a は7、b は重感、c は胃", "page": "p.362〜363"}], "status": "確認済み"}, {"id": "12-09", "section": "4 保健指導を支える心理学の理論 ❷理論横断モデル", "type": "pair", "stem": "理論横断モデルにおけるプロセスと、それを用いる変化ステージの組合せである。正しいのはどれか。", "passage": "", "choices": ["意識高揚 ―― 実行期・維持期", "自己解放 ―― 準備期", "刺激コントロール ―― 無関心期・関心期", "環境再評価 ―― 実行期・維持期", "支援関係 ―― 準備期"], "answer": 2, "explanations": [{"ok": false, "basis": "意識高揚は無関心期・関心期で用いるプロセス", "page": "p.365〜366"}, {"ok": true, "basis": "準備期では自己解放（健康行動を変える誓いを立てる）を用いる", "page": "p.366"}, {"ok": false, "basis": "刺激コントロールは実行期・維持期で用いるプロセス", "page": "p.366"}, {"ok": false, "basis": "環境再評価は無関心期・関心期で用いるプロセス", "page": "p.365〜366"}, {"ok": false, "basis": "支援関係は実行期・維持期で用いるプロセス", "page": "p.366"}], "status": "確認済み"}, {"id": "12-10", "section": "4 保健指導を支える心理学の理論 ❸健康信念モデル", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "健康信念モデルでは、主観的罹患可能性と（ a ）が「健康障害に対する個人的脅威」を形成し、健康行動による主観的利益と健康行動を実行するときの（ b ）が「（ c ）」を形成して、健康行動に結びつくと考える。", "choices": ["a 疾患の主観的重篤度　b 主観的負担感　c 健康行動の有効性に関する信念", "a 主観的規範　b 主観的負担感　c 健康行動の有効性に関する信念", "a 疾患の主観的重篤度　b 行動コントロール感　c 健康行動の有効性に関する信念", "a 疾患の主観的重篤度　b 主観的負担感　c 行動意図", "a 主観的規範　b 行動コントロール感　c 行動意図"], "answer": 1, "explanations": [{"ok": true, "basis": "主観的罹患可能性と疾患の主観的重篤度→個人的脅威、主観的利益と主観的負担感→健康行動の有効性に関する信念（図12-8）", "page": "p.367〜368"}, {"ok": false, "basis": "a は疾患の主観的重篤度。主観的規範は合理的行為の理論の要因", "page": "p.368"}, {"ok": false, "basis": "b は主観的負担感。行動コントロール感は行動計画理論の要因", "page": "p.368〜369"}, {"ok": false, "basis": "c は健康行動の有効性に関する信念。行動意図は合理的行為の理論の概念", "page": "p.368"}, {"ok": false, "basis": "a は疾患の主観的重篤度、b は主観的負担感、c は健康行動の有効性に関する信念", "page": "p.368"}], "status": "確認済み"}, {"id": "12-11", "section": "4 保健指導を支える心理学の理論 ❸健康信念モデル／❹合理的行為の理論、行動計画理論", "type": "correct", "stem": "健康信念モデルおよび行動計画理論に関する記述である。正しいのはどれか。", "passage": "", "choices": ["健康信念モデルは、検診の料金が高いために受診しない人が大勢いるという問題を背景に考案された。", "健康信念モデルでは、健康行動に影響する3つの信念をあげている。", "行動計画理論では、行動コントロール感は行動意図にのみ関与する。", "「糖尿病は大変な病気だ」は、疾患の主観的重篤度の例である。", "「食事のコントロールは面倒だ」は、健康行動による主観的利益の例である。"], "answer": 4, "explanations": [{"ok": false, "basis": "検診が無料であったり安い料金で受けられるにもかかわらず受診しない人が大勢いるという問題を背景に考案された", "page": "p.367"}, {"ok": false, "basis": "健康行動に影響する4つの信念をあげている", "page": "p.367"}, {"ok": false, "basis": "行動コントロール感は行動意図と行動の両方に独立して関与する", "page": "p.369"}, {"ok": true, "basis": "疾患の主観的重篤度の例として「糖尿病は大変な病気だ」があげられている", "page": "p.367"}, {"ok": false, "basis": "「食事のコントロールは面倒だ」は健康行動を実行するときの主観的負担感の例", "page": "p.368"}], "status": "確認済み"}, {"id": "12-12", "section": "5 行動変容と心理学的技法 ❶行動変容におけるセルフコントロール（self-control）の方法", "type": "pair", "stem": "セルフコントロールの方法とその例の組合せである。正しいのはどれか。", "passage": "", "choices": ["自己契約 ―― 「運動ができる」「目標が達成できる」など、自分に語りかける。", "刺激統制法 ―― 食べるときには決まったテーブルに腰掛けて食べることに専念し、ほかの場所では食べない。", "自己教示 ―― 節煙ができたら温泉に行くことを家族に約束してもらう。", "自己罰 ―― 運動ができたらテレビを見る。", "自己監視法 ―― ご飯を食べ過ぎたら次の日のおやつはなしにする。"], "answer": 2, "explanations": [{"ok": false, "basis": "自分自身に向けた言葉で自分に語りかけるのは自己教示", "page": "p.370"}, {"ok": true, "basis": "刺激統制法の例として、決まったテーブルで食べることに専念し、ほかの場所では食べないことがあげられている", "page": "p.370"}, {"ok": false, "basis": "節煙できたら温泉に行くことを家族に約束してもらうのは自己契約", "page": "p.370"}, {"ok": false, "basis": "運動ができたらテレビを見るのは自己強化", "page": "p.370"}, {"ok": false, "basis": "食べ過ぎたら次の日のおやつはなしは自己罰。自己監視法は目標行動を自分で記録し監視する方法", "page": "p.370"}], "status": "確認済み"}, {"id": "12-13", "section": "6 カウンセリングの方法 ❶カウンセリングの立場／❷健康心理カウンセリングの方法", "type": "incorrect", "stem": "カウンセリングの立場と技法に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["カウンセリングには、指示的カウンセリング、来談者中心カウンセリング、折衷的カウンセリングの3つの立場がある。", "生活習慣病への介入や一般医療現場におけるコミュニケーションなどは、比較的、折衷的カウンセリングを応用することが望ましい。", "繰り返しでは、スタッフの独自な解釈を積極的に導入して繰り返すことが望ましい。", "「はい」「いいえ」では答えられない開かれた質問を用いると、対象者は自由に話すことができる。", "人間関係がまだ十分に確立されていないときは、なるべく穏やかに影響力を与える技法から始めるとよい。"], "answer": 3, "explanations": [{"ok": true, "basis": "カウンセリングには指示的・来談者中心・折衷的の3つの立場がある", "page": "p.371"}, {"ok": true, "basis": "生活習慣病への介入や一般医療現場のコミュニケーションは、比較的、折衷的カウンセリングの応用が望ましい", "page": "p.371"}, {"ok": false, "basis": "繰り返しは表現内容をなるべく忠実な形で繰り返す。スタッフの独自な解釈を導入すると対象者の体験から解離するため注意が必要", "page": "p.372"}, {"ok": true, "basis": "開かれた質問を用いると、対象者は自由に話すことができ、さまざまな感情を表出できる", "page": "p.372"}, {"ok": true, "basis": "積極技法で働きかける場合は、なるべく穏やかに影響力を与える技法から始めるとよい", "page": "p.372"}], "status": "確認済み"}, {"id": "12-14", "section": "6 カウンセリングの方法 ❷健康心理カウンセリングの方法", "type": "correct", "stem": "積極技法（表12-6）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["情報提供は、積極技法のうち、働きかけの最も強いものである。", "解釈法は、話し手に対する影響力が非常に強い技法である。", "指示法では、命令によって根本的な行動の変容が起こる。", "宿題法は、話し手の外発的動機により行動を定着させるために有効である。", "過去の自己開示で、話し手が解決策を拒否した場合は、さらに強く働きかけるべきである。"], "answer": 2, "explanations": [{"ok": false, "basis": "情報提供は積極技法のうち働きかけの最も穏やかなもの", "page": "p.373"}, {"ok": true, "basis": "解釈法は話し手に対する影響力が非常に強い技法", "page": "p.373"}, {"ok": false, "basis": "命令は一時的な行動変容は起こせても、根本的な変容には至らない場合が多い", "page": "p.373"}, {"ok": false, "basis": "話し手の内発的動機により行動を定着させるためには、指示法の中でも宿題法が有効", "page": "p.373"}, {"ok": false, "basis": "話し手が拒否した場合は引き下がり、次の機会を待つべき", "page": "p.373"}], "status": "確認済み"}, {"id": "12-15", "section": "7 認知行動療法の生活習慣病へのアプローチ ❶認知行動療法による肥満へのアプローチ／❷減量における認知行動療法の実際", "type": "correct", "stem": "認知行動療法による肥満へのアプローチに関する記述である。正しいのはどれか。", "passage": "", "choices": ["減量目標は、6カ月で体重の10%程度とする。", "治療後も介入しないと、3〜5年以降は動機づけが低下するため、定期的な介入が必要となる。", "減量への動機づけでは、健康上の問題で減量が必要であることを強調することが最も重要である。", "食事量の増減だけで、長期的に安定した減量が得られる。", "減量の初期の研究ではコミュニケーション技術の訓練が導入されていたが、その後、外的な刺激を制限する方法が導入された。"], "answer": 2, "explanations": [{"ok": false, "basis": "ゆっくりとした無理のない目標（6カ月で体重の3〜5%）を立てる", "page": "p.374"}, {"ok": true, "basis": "治療後も介入しないと3〜5年以降は動機づけが低下するため、定期的な介入が必要", "page": "p.374"}, {"ok": false, "basis": "減量の必要性を強調するだけでなく、より具体的な方法を提示することが最も重要", "page": "p.374"}, {"ok": false, "basis": "食事量の増減だけでは筋肉の増強が得られず、長期的には安定した減量ができない", "page": "p.374"}, {"ok": false, "basis": "初期は外的な刺激の制限や食べる行動をゆっくりさせる条件づけが導入され、その後、社会技術訓練や認知再構成法が導入された", "page": "p.374"}], "status": "確認済み"}, {"id": "12-16", "section": "8 カウンセリング技法によるアプローチ ❶認知行動療法の導入とその限界／❷カウンセリング技法の実践例／❸カウンセリングの立場からの指導や助言", "type": "incorrect", "stem": "カウンセリング技法による生活習慣病へのアプローチに関する記述である。誤っているのはどれか。", "passage": "", "choices": ["糖尿病のコントロールでは、情報提供において基本的な知識に絞って最小限にとどめる必要がある。", "自己管理の形成には、目標行動の設定や自己監視法が基本である。", "相談内容を聴いたら、表面上の問題意識に対して即時に答えを与えることが重要である。", "初期のころのトラウマ体験により、正常な生活習慣を営めない事例も多数認められる。", "本来の感情に気づきが生じた段階で、初めて助言やコンサルテーションが有効になる。"], "answer": 3, "explanations": [{"ok": true, "basis": "情報提供は基本的な知識に絞って最小限にとどめる必要がある", "page": "p.376"}, {"ok": true, "basis": "自己管理の形成には、特に目標行動の設定や自己監視法が基本", "page": "p.376"}, {"ok": false, "basis": "相談内容を聴いてもすぐに助言しないことが必要。即時に答えを与えるのは単に情報提供と説教にすぎない", "page": "p.377"}, {"ok": true, "basis": "初期のころのトラウマ体験により正常な生活習慣を営めない事例も多数認められる", "page": "p.376"}, {"ok": true, "basis": "本来の感情に気づきが生じた段階で、初めて助言、コンサルテーションが有効になる", "page": "p.382"}], "status": "確認済み"}, {"id": "12-17", "section": "9 認知行動療法の応用による心疾患へのアプローチ ❶心リハにおける認知行動療法的アプローチの有効性／❸AMTの応用／❻心疾患と怒り・敵意・攻撃性／❼心疾患とタイプDパーソナリティ", "type": "correct", "stem": "心疾患と心理的要因に関する記述である。正しいのはどれか。", "passage": "", "choices": ["心リハを行うことで、タイプA行動や怒りの表出性は低下するが、不安や抑うつには効果が認められなかった。", "1990年代以降、欧米ではタイプA行動パターン（TABP）とCHDとの関連の研究が増加している。", "タイプDパーソナリティは、ネガティブな感情の自覚が低く、対人関係において不安で寡黙な傾向をもつ。", "抑制型対処行動は、ネガティブな感情の表出や言語的表現が高い傾向を示す。", "AMTは、不安をコントロールするために開発された治療法で、筋弛緩訓練法と不安のイメージトレーニングを併用したものである。"], "answer": 5, "explanations": [{"ok": false, "basis": "心リハで不安や抑うつは低下するが、タイプA行動や怒りの表出性については効果が認められなかった", "page": "p.383"}, {"ok": false, "basis": "1990年代以降、欧米ではTABPに関する研究はほとんど認められず、代わって怒りや敵意と心疾患との関連性が重視されるようになった", "page": "p.389"}, {"ok": false, "basis": "タイプDパーソナリティはネガティブな感情の自覚が高い", "page": "p.390"}, {"ok": false, "basis": "抑制型対処行動はネガティブな感情の表出や言語的表現が低い傾向を示す", "page": "p.390"}, {"ok": true, "basis": "AMTは不安をコントロールするために開発された治療法で、筋弛緩訓練法と不安のイメージトレーニングを併用したもの", "page": "p.388"}], "status": "確認済み"}, {"id": "12-18", "section": "9 認知行動療法の応用による心疾患へのアプローチ ❷心リハにおける認知行動療法の応用事例", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "心リハの認知行動療法的介入では、目標行動が患者との十分な相談の上で自己決定されるように援助し、その際、カウンセラーの介入を徐々に低下させる（ a ）の手法を用いる。目標を複数提示する場合には、必ず容易に達成できるものを含め、徐々に難しい目標へと変化させる。これは行動療法での（ b ）法の応用である。さらに、自分でその問題をチェックする（ c ）は、動機づけの向上に効果的であり、行動変容の学習を促進させる。", "choices": ["a フェーディング　b シェイピング　c 自己監視法", "a シェイピング　b フェーディング　c 自己監視法", "a フェーディング　b シェイピング　c 刺激統制法", "a モデリング　b シェイピング　c 自己監視法", "a フェーディング　b 系統的脱感作　c 自己契約"], "answer": 1, "explanations": [{"ok": true, "basis": "介入を徐々に減らすのはフェーディング、徐々に難しい目標へ変化させるのはシェイピング法の応用、自分でチェックするのは自己監視法", "page": "p.387"}, {"ok": false, "basis": "a はフェーディング、b はシェイピング", "page": "p.387"}, {"ok": false, "basis": "c は自己監視法（self-monitoring）", "page": "p.387"}, {"ok": false, "basis": "a はフェーディング", "page": "p.387"}, {"ok": false, "basis": "b はシェイピング、c は自己監視法", "page": "p.387"}], "status": "確認済み"}]}, {"chapter": 13, "chapterTitle": "国内外の関連法規", "questions": [{"id": "13-01", "section": "1 背景", "type": "correct", "stem": "食品の健康表示と安全性に関連する制度の経緯に関する記述である。正しいのはどれか。", "passage": "", "choices": ["特定保健用食品は、1991年に食品衛生法において制度として定められた。", "栄養機能食品は、2001年に健康増進法に規格基準型の制度として制定された。", "食品安全基本法により、厚生労働省に食品安全委員会が設置された。", "食品表示法は、2015年4月に公布された。", "2003年の食品衛生法の改正により、「健康被害のおそれ」がある場合は販売禁止の措置がとれるようになった。"], "answer": 5, "explanations": [{"ok": false, "basis": "特定保健用食品は1991年に栄養改善法において制度として定められた", "page": "p.393"}, {"ok": false, "basis": "栄養機能食品は2001年に食品衛生法に規格基準型として制定された", "page": "p.393"}, {"ok": false, "basis": "食品安全基本法により、内閣府に食品安全委員会が設置された", "page": "p.393"}, {"ok": false, "basis": "食品表示法は2013年6月に公布され、2015年4月に施行された", "page": "p.393"}, {"ok": true, "basis": "いわゆる健康食品の安全性確保のため、「健康被害のおそれ」がある場合は販売禁止の措置がとれるよう食品衛生法が2003年に改正された", "page": "p.393"}], "status": "確認済み"}, {"id": "13-02", "section": "2 健康増進法 ❶背景と目的〜❽特別用途食品", "type": "incorrect", "stem": "健康増進法に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["健康増進法は、栄養改善法の内容を引き継いだ法律として2002年に制度化された。", "特に専門的な知識・技術を必要とする栄養指導などの保健指導は、市町村の役割と定められている。", "「日本人の食事摂取基準」は、2009年から健康増進法に位置づけられている。", "学校、百貨店、飲食店など多数の者が利用する施設の管理者は、受動喫煙を防止するための努力義務を負う。", "許可基準型の病者用食品には、腎臓病患者のための「低たんぱく質食品」がある。"], "answer": 2, "explanations": [{"ok": true, "basis": "特別用途表示制度・栄養表示制度などを含む栄養改善法の内容を引き継いだ法律として2002年に制度化された", "page": "p.394"}, {"ok": false, "basis": "生活習慣の改善に関する相談・保健指導は市町村、特に専門的な知識・技術を必要とする栄養指導などは都道府県の役割（第17〜19条）", "page": "p.395"}, {"ok": true, "basis": "2004年の改定以来「日本人の食事摂取基準」として公表され、2009年から同法に位置づけられている", "page": "p.395"}, {"ok": true, "basis": "多数の者が利用する施設の管理者は受動喫煙を防止するための努力義務を負う（第25〜26条）", "page": "p.395"}, {"ok": true, "basis": "許可基準型の病者用食品には、たんぱく質の摂取制限を必要とする腎臓病患者のための「低たんぱく質食品」がある", "page": "p.396"}], "status": "確認済み"}, {"id": "13-03", "section": "2 健康増進法 ❾誇大表示の禁止", "type": "correct", "stem": "健康増進法における誇大表示の禁止に関する記述である。正しいのはどれか。", "passage": "", "choices": ["健康増進法第65条の虚偽誇大広告の禁止の対象となる者は、食品等の製造業者と販売業者に限られる。", "「人を誤認させる」とは、十分な実験結果などの根拠が存在しないにもかかわらず表示する場合をいう。", "広告と判断される要件の1つに、「一般人が認知できる状態であること」がある。", "特定の商品名が記載されていない書籍は、販売業者の連絡先が掲載されていても広告には含まれない。", "「おなかの調子を整える」は、「身体の組織機能の一般的増強・増進を主たる目的とする効果」の表示例である。"], "answer": 3, "explanations": [{"ok": false, "basis": "第65条第1項は「何人も」と規定しており、新聞社、出版社、放送事業者、インターネット媒体等の広告媒体事業者等も対象となり得る", "page": "p.398"}, {"ok": false, "basis": "根拠がないのに表示する場合などは「事実に相違する」にあたる。「人を誤認させる」とは、「印象」や「期待感」と実際の効果などに相違があること", "page": "p.398"}, {"ok": true, "basis": "顧客を誘引する意図が明確、特定食品の商品名などが明らか、一般人が認知できる状態、の3項目に該当すれば広告と判断される", "page": "p.398"}, {"ok": false, "basis": "特定の商品名が記載されていない書籍等でも、販売業者の連絡先が掲載されている場合などは広告に含まれる", "page": "p.398"}, {"ok": false, "basis": "「おなかの調子を整える」は「特定の保健の用途に適する効果」の例。一般的増強・増進の例は「疲労回復」「体力増強」など", "page": "p.397"}], "status": "確認済み"}, {"id": "13-04", "section": "3 食品衛生法 ❺残留農薬", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "基準の定められた農薬等のリストを作成し、それ以外の残留農薬等を含む食品の販売を規制する制度を（ a ）制度と呼ぶ。この制度は2003年の食品衛生法改正によって公布され、（ b ）年に施行された。残留基準が定められていない農薬等については「人の健康を損なうおそれのない量」が一律基準として定められており、その値は（ c ）ppmである。", "choices": ["a ネガティブリスト　b 2006　c 0.01", "a ポジティブリスト　b 2003　c 0.01", "a ポジティブリスト　b 2006　c 0.1", "a ポジティブリスト　b 2006　c 0.01", "a ネガティブリスト　b 2003　c 0.1"], "answer": 4, "explanations": [{"ok": false, "basis": "a はポジティブリスト", "page": "p.402"}, {"ok": false, "basis": "b は2006（公布3年の後に施行）", "page": "p.402"}, {"ok": false, "basis": "c は0.01（食品1kg当たり農薬等が0.01mg含まれる濃度）", "page": "p.402"}, {"ok": true, "basis": "ポジティブリスト制度は2006年に施行。一律基準は0.01ppm", "page": "p.401〜402"}, {"ok": false, "basis": "a はポジティブリスト、b は2006、c は0.01", "page": "p.402"}], "status": "確認済み"}, {"id": "13-05", "section": "3 食品衛生法 ❹食品と食品添加物〜⓭罰則", "type": "correct", "stem": "食品衛生法に関する記述である。正しいのはどれか。", "passage": "", "choices": ["特別の注意を必要とする指定成分等として、プエラリア・ミリフィカやブラックコホシュが指定されている。", "指定成分等含有食品にかかわる健康被害情報は、営業者が厚生労働大臣に届け出ることが義務付けられている。", "販売用の食品を輸入しようとする者は、その都度、消費者庁長官に届け出なければならない。", "食中毒患者を診断した医師は、直ちに都道府県知事にその旨を届け出なければならない。", "法人の従業者等が違反行為をしたとき、その法人に対して科される罰金刑は300万円以下である。"], "answer": 1, "explanations": [{"ok": true, "basis": "第8条第1項に基づき、コレウス・フォルスコリー、ドオウレン、プエラリア・ミリフィカ、ブラックコホシュが指定成分等に指定されている", "page": "p.400"}, {"ok": false, "basis": "健康被害情報は営業者が都道府県知事等に届け出ることが義務付けられた", "page": "p.400〜401"}, {"ok": false, "basis": "輸入しようとする者は、その都度、厚生労働大臣に届け出なければならない（第27条）", "page": "p.403"}, {"ok": false, "basis": "医師は直ちに最寄りの保健所長に届け出なければならない（第58条）", "page": "p.403〜404"}, {"ok": false, "basis": "法人に対しては1億円以下の罰金刑を科す（第78条）。300万円以下は第71条の違反者に対する罰金", "page": "p.404"}], "status": "確認済み"}, {"id": "13-06", "section": "3 食品衛生法 ❹食品と食品添加物", "type": "incorrect", "stem": "食品衛生法における食品添加物に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["厚生労働大臣が定めたもの以外の添加物の販売等の禁止の対象には、化学的合成品だけでなく天然物も含まれる。", "1995年の法改正で、天然添加物として認められていた食品添加物約130品目が既存添加物に移行した。", "2007年の改正により、既存添加物のうち約130品目の安全性の見直しが行われることになった。", "「人の健康に問題のあるもの、流通実体のないもの」と確認されたものは、既存添加物から削除される。", "基準または規格が定められた添加物については、食品添加物公定書を作成し、その基準および規格を収載する。"], "answer": 2, "explanations": [{"ok": true, "basis": "第10条の対象には化学的合成品だけでなく天然物も含まれる", "page": "p.401"}, {"ok": false, "basis": "1995年の法改正で既存添加物に移行したのは489品目。約130品目は2007年改正で安全性の見直しの対象となった数", "page": "p.401"}, {"ok": true, "basis": "2007年の改正により、既存添加物のうち約130品目の安全性の見直しが行われることになった", "page": "p.401"}, {"ok": true, "basis": "「人の健康に問題のあるもの、流通実体のないもの」は既存添加物から削除される", "page": "p.401"}, {"ok": true, "basis": "食品添加物公定書を作成し、その基準および規格を収載する（第21条）", "page": "p.401"}], "status": "確認済み"}, {"id": "13-07", "section": "4 食品安全基本法 ❺食品安全委員会", "type": "blank", "stem": "次の文の空欄に入る正しいものの組合せはどれか。", "passage": "食品安全基本法に基づき（ a ）に設置された食品安全委員会は、食品健康影響評価（（ b ））の実施や、評価の結果に基づく施策の実施状況の監視と関係大臣への勧告などを主な役割とする。委員会は、内閣総理大臣が有識者から任命した（ c ）名の委員から構成され、委員の任期は3年である。", "choices": ["a 消費者庁　b リスク管理　c 9", "a 内閣府　b リスク管理　c 7", "a 厚生労働省　b リスク評価　c 7", "a 内閣府　b リスク評価　c 9", "a 内閣府　b リスク評価　c 7"], "answer": 5, "explanations": [{"ok": false, "basis": "a は内閣府、b はリスク評価、c は7", "page": "p.407"}, {"ok": false, "basis": "b はリスク評価（リスク管理は評価結果に基づいて施策を策定すること）", "page": "p.406〜407"}, {"ok": false, "basis": "a は内閣府", "page": "p.407"}, {"ok": false, "basis": "c は7（4名は常勤、3名は非常勤）", "page": "p.407"}, {"ok": true, "basis": "内閣府にリスク評価を実施するために設置。委員は7名（4名常勤、3名非常勤、任期3年）", "page": "p.407"}], "status": "確認済み"}, {"id": "13-08", "section": "4 食品安全基本法 ❶背景〜❹施策の策定にかかわる基本的な方針", "type": "incorrect", "stem": "食品安全基本法に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["BSE、原産地・賞味期限の偽装表示などの問題を背景に、2003年に施行された。", "基本理念の1つは、国民の健康の保護が最も重要であるという基本的認識のもとに食品の安全性を確保することである。", "消費者の役割として、食品の安全性の確保に関する施策について意見を表明するように努めることが明記されている。", "国は、食品の安全性の確保について第一義的責任を有していることを認識して、必要な措置を講じる責務がある。", "施策の策定にあたっては、リスクコミュニケーションの促進を図るために必要な措置が講じられなければならない。"], "answer": 4, "explanations": [{"ok": true, "basis": "BSE、原産地・賞味期限の偽装表示、中国産ダイエット食品による健康被害などから、2003年に施行された", "page": "p.404"}, {"ok": true, "basis": "基本理念①：国民の健康の保護が最も重要であるという基本的認識のもとに食品の安全性を確保すること", "page": "p.405"}, {"ok": true, "basis": "知識と理解を深め、施策について意見を表明するように努めることを消費者の役割として明記（第9条）", "page": "p.405"}, {"ok": false, "basis": "第一義的責任を有していることを認識するのは食品関連事業者の責務（第8条）。国の責務は施策を総合的に策定・実施すること（第6条）", "page": "p.405"}, {"ok": true, "basis": "リスクコミュニケーションの促進を図るために必要な措置が講じられなければならない（第13条）", "page": "p.406"}], "status": "確認済み"}, {"id": "13-09", "section": "5 薬機法 ❶目的〜❸食薬区分", "type": "correct", "stem": "薬機法と食薬区分に関する記述である。正しいのはどれか。", "passage": "", "choices": ["消化酵素は、「専ら医薬品として使用される成分（原材料）」の例である。", "通称46通知と呼ばれる食薬区分に関する最初の通知は、1946年に出された。", "「医薬品の範囲に関する基準」は、1994年に定められた。", "「医薬品リスト」にも「非医薬品リスト」にも収載されていない成分本質については、消費者庁に照会して判断を求めることができる。", "薬機法第2条の医薬品の定義には、日本薬局方に収められている物は含まれない。"], "answer": 1, "explanations": [{"ok": true, "basis": "専ら医薬品としての使用実態のある物の例として、解熱鎮痛消炎剤、ホルモン、抗生物質、消化酵素などがあげられている", "page": "p.409"}, {"ok": false, "basis": "46通知は1971年（昭和46年6月1日）に出された", "page": "p.408"}, {"ok": false, "basis": "1994年は米国でDSHEAが施行された年。厚生労働省は2001年に46通知を改正し「医薬品の範囲に関する基準」を定めた", "page": "p.408"}, {"ok": false, "basis": "どちらのリストにも収載されていない成分本質は厚生労働省に照会し、判断を求めることができる", "page": "p.409"}, {"ok": false, "basis": "第2条の医薬品には「日本薬局方に収められている物」が含まれる", "page": "p.407"}], "status": "確認済み"}, {"id": "13-10", "section": "5 薬機法 ❸食薬区分", "type": "pair", "stem": "食品の表示例と、医薬品的な効能・効果の判断における分類との組合せである。正しいのはどれか。", "passage": "", "choices": ["「疲労回復」 ―― 疾病の治療または予防を目的とする効能・効果", "「不老長寿」 ―― 名称またはキャッチフレーズによる医薬品的な効能・効果の暗示", "「便秘が治る」 ―― 身体の組織機能の一般的増強、増進を主たる目的とする効能・効果", "「健康維持」 ―― 医薬品的な効能・効果に該当する表現", "「体質改善」 ―― 製法の説明による医薬品的な効能・効果の暗示"], "answer": 2, "explanations": [{"ok": false, "basis": "「疲労回復」は身体の組織機能の一般的増強、増進を主たる目的とする効能・効果の例", "page": "p.409"}, {"ok": true, "basis": "名称またはキャッチフレーズによる暗示の例として「延命○○」「不老長寿」「漢方秘法」「和漢伝方」があげられている", "page": "p.409"}, {"ok": false, "basis": "「便秘が治る」は疾病の治療または予防を目的とする効能・効果の例", "page": "p.409"}, {"ok": false, "basis": "「健康維持」「美容」の表現は医薬品的な効能・効果に該当しない", "page": "p.409"}, {"ok": false, "basis": "「体質改善」は含有成分の表示および説明による暗示の例", "page": "p.409"}], "status": "確認済み"}, {"id": "13-11", "section": "6 景品表示法 ❶概要〜❹公正競争規約", "type": "correct", "stem": "景品表示法（不当景品類及び不当表示防止法）に関する記述である。正しいのはどれか。", "passage": "", "choices": ["景品表示法は、不正競争防止法の規制手続きの特別法として制定されている。", "有利誤認表示とは、商品の内容が実際よりも著しく優良であると誤認させる表示をいう。", "公正競争規約は、事業者または事業者団体が都道府県知事の認定を受けて締結または設定する。", "公正取引委員会は、著しく優良であると示す表示について、15日以内に表示の裏づけとなる合理的な根拠の提出を事業者に求めることができる。", "景品表示法は、2009年に厚生労働省に移管された。"], "answer": 4, "explanations": [{"ok": false, "basis": "独占禁止法の規制手続きの特別法として制定されている", "page": "p.410"}, {"ok": false, "basis": "実際よりも著しく優良であると誤認させるのは優良誤認表示。有利誤認表示は価格その他の取引条件を著しく有利であると誤認させるもの", "page": "p.411"}, {"ok": false, "basis": "公正取引委員会および消費者庁長官の認定を受けて締結・設定する（第31条）", "page": "p.411"}, {"ok": true, "basis": "2003年の改正により、15日以内に合理的な根拠の提出を求めることができるようになった。提出しない場合は不当表示として規制できる（第7条）", "page": "p.411"}, {"ok": false, "basis": "公正取引委員会が所管していたが、2009年に消費者庁が設置されたことにより消費者庁に移管された", "page": "p.410"}], "status": "確認済み"}, {"id": "13-12", "section": "7 JAS法 ❶背景〜❹有機農産物および有機加工食品の表示", "type": "incorrect", "stem": "JAS法（農林物資の規格化等に関する法律）に関する記述である。誤っているのはどれか。", "passage": "", "choices": ["JAS法は、1950年に制定された。", "1970年の改正により、品質表示基準についても定めるようになった。", "JAS規格の格付けを受けるかどうかは製造業者等に任されており、JASマークの貼付されていない製品の流通にも制限はない。", "有機農産物の生産方法の基準では、播種・植付け前2年以上（多年生作物の場合は収穫前3年以上）、原則として化学的肥料および農薬を使用しない。", "有機加工食品の生産方法の基準では、原材料（水と食塩を除く）の80%以上が有機農産物、有機畜産物または有機加工食品であることとされている。"], "answer": 5, "explanations": [{"ok": true, "basis": "1950（昭和25）年にJAS法が制定された", "page": "p.411"}, {"ok": true, "basis": "1970（昭和45）年の改正により品質表示基準についても定めるようになった", "page": "p.412"}, {"ok": true, "basis": "格付けを受けるかどうかは製造業者等に任されており、JASマークのない製品の流通にも制限はない", "page": "p.412"}, {"ok": true, "basis": "播種・植付け前2年以上（多年生作物は収穫前3年以上）および栽培中に原則として化学的肥料・農薬を使用しない", "page": "p.412"}, {"ok": false, "basis": "原材料（水と食塩を除く）の95%以上が有機農産物、有機畜産物または有機加工食品であること", "page": "p.413"}], "status": "確認済み"}, {"id": "13-13", "section": "8 食品表示法 ❶経緯と目的〜❸不適正な表示に対する措置", "type": "correct", "stem": "食品表示法に関する記述である。正しいのはどれか。", "passage": "", "choices": ["食品表示法は、2015年4月1日に公布された。", "食品表示法に基づく細かいルールは、厚生労働省令である食品表示基準に定められている。", "食品表示法における内閣総理大臣の権限は、消費者庁長官に委任されている。", "経過措置期間は、生鮮食品の表示については2020年3月31日までであった。", "食品表示法第11条には、申出制度が定められている。"], "answer": 3, "explanations": [{"ok": false, "basis": "2013（平成25）年6月28日に公布、2015（平成27）年4月1日に施行された", "page": "p.414"}, {"ok": false, "basis": "食品表示基準は内閣府令（2015年4月1日施行）", "page": "p.414"}, {"ok": true, "basis": "内閣総理大臣の権限は消費者庁長官に委任されている（第15条）", "page": "p.415"}, {"ok": false, "basis": "生鮮食品の表示は2016（平成28）年9月30日まで。2020年3月31日までは加工食品および添加物の表示", "page": "p.415"}, {"ok": false, "basis": "第11条は適格消費者団体の差止請求権。申出制度は第12条", "page": "p.414"}], "status": "確認済み"}, {"id": "13-14", "section": "8 食品表示法 ❹食品表示基準", "type": "correct", "stem": "食品表示基準における栄養成分の表示に関する記述である。正し const RELEASE = true;
const STORE = "nrsa-quiz-v1";

const all = DATA.flatMap(c => c.questions.map(q => ({ ...q, chapter: c.chapter, chapterTitle: c.chapterTitle })));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function loadStats() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
function saveStats(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {} }
let stats = loadStats(); // { [id]: { right: n, wrong: n, last: true|false } }

const state = { chapters: new Set(DATA.map(c => c.chapter)), count: 10, mode: "all", queue: [], idx: 0, answered: null, results: [] };

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 章ごとの解答回数と誤答回数（この端末の成績から）
function chapterStats() {
  const s = {};
  all.forEach(q => {
    const c = s[q.chapter] ||= { right: 0, wrong: 0 };
    const t = stats[q.id];
    if (t) { c.right += t.right; c.wrong += t.wrong; }
  });
  return s;
}
// 誤答率の高い章ほど、また前回まちがえた・未解答の問題ほど出やすくする
function weakWeight(q, cs) {
  const c = cs[q.chapter];
  const rate = (c.wrong + 1) / (c.right + c.wrong + 2); // 解答が少ない章は 0.5 前後
  const t = stats[q.id];
  return rate * (!t ? 1.5 : t.last === false ? 3 : 1);
}
function weightedSample(items, weightOf, n) {
  // 重み付きの非復元抽出（Efraimidis–Spirakis 法）
  return items.map(x => ({ x, k: Math.pow(Math.random(), 1 / weightOf(x)) }))
    .sort((a, b) => b.k - a.k).slice(0, n).map(o => o.x);
}
function pool() {
  let p = all.filter(q => state.chapters.has(q.chapter));
  if (state.mode === "wrong") p = p.filter(q => stats[q.id] && stats[q.id].last === false);
  return p;
}
function pagesOf(q) { return [...new Set(q.explanations.map(e => e.page))].join("、"); }

function home() {
  const p = pool();
  const wrongCount = all.filter(q => stats[q.id] && stats[q.id].last === false).length;
  const cs = chapterStats();
  const acc = c => { const s = cs[c]; const n = s.right + s.wrong; return n ? `正答率 ${Math.round(s.right / n * 100)}%（${n}回）` : "未解答"; };
  $("#app").innerHTML = `
    <h1>NR・サプリメントアドバイザー 練習問題</h1>
    <p class="sub">『第7版 NR・サプリメントアドバイザー必携』準拠の独自問題・全${all.length}問。解説にテキストの参照ページを示しています。</p>
    ${RELEASE ? "" : `<div class="banner">確認用：教員確認前の問題を含みます。学生には配布しないでください。</div>`}
    <div class="card">
      <h2 style="margin-top:0">出題する章</h2>
      ${DATA.map(c => `<label class="row"><input type="checkbox" data-ch="${c.chapter}" ${state.chapters.has(c.chapter) ? "checked" : ""}>
        <span>第${c.chapter}章 ${esc(c.chapterTitle)}<span class="sub">（${c.questions.length}問｜${acc(c.chapter)}）</span></span></label>`).join("")}
      <button class="link" id="allch">すべて選ぶ / 外す</button>
      <h2>問題数</h2>
      <div class="seg">${[10, 20, 0].map(n => `<button data-n="${n}" class="${state.count === n ? "on" : ""}">${n ? n + "問" : "すべて"}</button>`).join("")}</div>
      <h2>出題範囲</h2>
      <div class="seg">
        <button data-m="all" class="${state.mode === "all" ? "on" : ""}">全問からランダム</button>
        <button data-m="weak" class="${state.mode === "weak" ? "on" : ""}">苦手な章を中心に</button>
        <button data-m="wrong" class="${state.mode === "wrong" ? "on" : ""}">前回まちがえた問題（${wrongCount}）</button>
      </div>
      ${state.mode === "weak" ? `<p class="sub" style="margin:8px 0 0">まちがいの多い章ほど多く出題します。前回まちがえた問題とまだ解いていない問題も出やすくなります。</p>` : ""}
    </div>
    <button class="primary" id="start" ${p.length ? "" : "disabled"}>開始（対象 ${p.length}問）</button>
    <p class="foot">成績はこの端末のブラウザにだけ保存されます。<button class="link" id="reset">成績を消去</button></p>`;
  document.querySelectorAll("[data-ch]").forEach(el => el.onchange = () => { const c = +el.dataset.ch; el.checked ? state.chapters.add(c) : state.chapters.delete(c); home(); });
  $("#allch").onclick = () => { state.chapters = state.chapters.size === DATA.length ? new Set() : new Set(DATA.map(c => c.chapter)); home(); };
  document.querySelectorAll("[data-n]").forEach(el => el.onclick = () => { state.count = +el.dataset.n; home(); });
  document.querySelectorAll("[data-m]").forEach(el => el.onclick = () => { state.mode = el.dataset.m; home(); });
  // 確認ダイアログは使えない環境があるため、2回押しで消去する
  $("#reset").onclick = e => {
    if (e.target.dataset.armed) { stats = {}; saveStats(stats); home(); return; }
    e.target.dataset.armed = "1"; e.target.textContent = "もう一度押すと成績を消去します";
  };
  $("#start").onclick = () => {
    const p = pool(), n = state.count || p.length;
    if (state.mode === "weak") { const cs = chapterStats(); state.queue = weightedSample(p, q => weakWeight(q, cs), n); }
    else state.queue = shuffle(p).slice(0, n);
    state.idx = 0; state.results = []; question();
  };
}

function question() {
  const q = state.queue[state.idx];
  state.answered = null;
  $("#app").innerHTML = `
    <div class="meta"><span>${state.idx + 1} / ${state.queue.length}</span><button class="link" id="quit">中断してもどる</button></div>
    <div class="bar"><i style="width:${(state.idx / state.queue.length) * 100}%"></i></div>
    <div class="card">
      <span class="field">第${q.chapter}章 ${esc(q.chapterTitle)} ｜ ${esc(q.section)}</span>
      <div class="stem">${esc(q.stem)}</div>
      ${q.passage ? `<div class="passage">${esc(q.passage)}</div>` : ""}
      <div id="choices">${q.choices.map((c, i) => `<button class="choice" data-i="${i + 1}"><span class="n">${i + 1}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div id="exp"></div>
    </div>
    <div id="next"></div>`;
  $("#quit").onclick = home;
  document.querySelectorAll(".choice").forEach(el => el.onclick = () => answer(+el.dataset.i));
}

function answer(i) {
  if (state.answered) return;
  const q = state.queue[state.idx];
  const right = i === q.answer;
  state.answered = i;
  state.results.push({ q, right });
  const s = stats[q.id] || { right: 0, wrong: 0 };
  right ? s.right++ : s.wrong++; s.last = right; stats[q.id] = s; saveStats(stats);
  document.querySelectorAll(".choice").forEach(el => {
    const n = +el.dataset.i; el.disabled = true;
    if (n === q.answer) el.classList.add("correct"); else if (n === i) el.classList.add("wrong");
  });
  $("#exp").innerHTML = `
    <div class="verdict ${right ? "ok" : "ng"}">${right ? "正解" : "不正解"}　解答：${q.answer}</div>
    <div class="sub">参照：テキスト ${esc(pagesOf(q))}</div>
    <table><tr><th>肢</th><th>正誤</th><th>根拠</th><th>参照</th></tr>
    ${q.explanations.map((e, k) => `<tr><td class="mk">${k + 1}</td><td class="mk" style="color:var(${e.ok ? "--ok" : "--ng"})">${e.ok ? "○" : "×"}</td><td>${esc(e.basis)}</td><td class="pg">${esc(e.page)}</td></tr>`).join("")}
    </table>`;
  const last = state.idx === state.queue.length - 1;
  $("#next").innerHTML = `<button class="primary" id="go">${last ? "結果を見る" : "次の問題へ"}</button>`;
  $("#go").onclick = () => { if (last) result(); else { state.idx++; question(); window.scrollTo(0, 0); } };
}

function result() {
  const r = state.results, ok = r.filter(x => x.right).length;
  const byCh = {};
  r.forEach(x => { const c = byCh[x.q.chapter] ||= { title: x.q.chapterTitle, n: 0, ok: 0 }; c.n++; if (x.right) c.ok++; });
  const miss = r.filter(x => !x.right);
  $("#app").innerHTML = `
    <h1>結果</h1>
    <div class="card"><div class="big">${ok} / ${r.length}</div><div class="sub">正答率 ${Math.round(ok / r.length * 100)}%</div>
      ${Object.entries(byCh).sort((a, b) => a[0] - b[0]).map(([c, v]) => `<div>第${c}章 ${esc(v.title)}　${v.ok}/${v.n}</div><div class="bar"><i style="width:${v.ok / v.n * 100}%"></i></div>`).join("")}
    </div>
    ${miss.length ? `<h2>まちがえた問題の復習ページ</h2><div class="card stack">${miss.map(x => `<div><b>${esc(x.q.id)}</b>　${esc(x.q.stem)}<div class="sub" style="margin:0">解答 ${x.q.answer} ｜ テキスト ${esc(pagesOf(x.q))}</div></div>`).join("")}</div>` : ""}
    <button class="primary" id="home">最初の画面へ</button>`;
  $("#home").onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
